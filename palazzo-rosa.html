<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Il mistero di Palazzo Rosa</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout concept: a police case file on a phone. Sticky header with hazard tape, one column of evidence cards, fixed bottom tab bar. */
:root{
  --bg:#E6E9E7; --surface:#F7F8F6; --fg:#15202B; --muted:#4F5C67; --line:#C5CCC8;
  --tape:#F2C300; --on-tape:#15202B; --stamp:#B3261E; --sea:#0A5A70; --yes:#1B6E45; --no:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
    --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
  --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0}
small{font-size:13px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#15202B 14px 28px)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{font-size:28px;letter-spacing:.05em}
.brand span{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{min-height:40px;min-width:44px;padding:0 12px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}

/* layout */
.main{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;background:var(--tape);color:var(--on-tape);padding:2px 8px;border-radius:2px;text-transform:uppercase}
.it{font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.en{color:var(--sea);font-size:16px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.entog{align-self:flex-start;min-height:36px;padding:0 12px;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:4px;font-size:14px;font-weight:700}
.entog[aria-expanded="true"]{background:var(--sea);color:var(--bg)}
.w{padding:0;border:0;border-bottom:2px dotted var(--sea);background:none;font:inherit;line-height:inherit;color:inherit;cursor:help}
.gloss{background:var(--tape);color:var(--on-tape);font-weight:700;padding:6px 10px;border-radius:3px;font-size:16px;align-self:flex-start}
.ico{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center;flex:none}
.ico[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.ico svg{width:22px;height:22px}

/* buttons */
.btn{min-height:50px;padding:0 20px;border:2px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:4px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn.tape{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-family:var(--body);font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:inherit;opacity:.85}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:15px;align-self:flex-start;min-height:44px}

/* setup */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-height:48px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[disabled]{opacity:.3;cursor:not-allowed}
.q{font-weight:700;font-size:18px}
.q small{display:block;font-weight:400}

/* rounds */
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rd{min-height:56px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.rd[aria-pressed="true"]{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.rd[aria-disabled="true"]{opacity:.45;border-style:dashed}
.rd svg{width:16px;height:16px;flex:none}
.task{border-left:6px solid var(--tape);padding-left:12px}
.ask{background:transparent;border:2px dashed var(--muted)}

/* cast */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:24px;flex:none}
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.who span{font-size:15px;color:var(--muted)}

/* notebook */
.tw{overflow-x:auto}
table.nb{border-collapse:collapse;width:100%;min-width:340px}
.nb th,.nb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.nb thead th{font-family:var(--mono);font-size:12px;text-transform:uppercase;vertical-align:bottom}
.nb thead th small{display:block;text-transform:none;font-family:var(--body)}
.nb tbody th{text-align:left;font-weight:700;font-size:16px;padding-right:8px}
.nb tbody th small{display:block;font-weight:400}
.cell{width:100%;min-width:52px;min-height:48px;border:2px solid var(--line);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted)}
.cell.y{border-color:var(--yes);color:var(--yes);background:color-mix(in srgb,var(--yes) 14%,transparent)}
.cell.n{border-color:var(--no);color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}

/* accuse */
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);min-height:56px}
.opt input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--sea);flex:none}
.opt:has(input:checked){border-color:var(--fg)}
.opt .e{display:block;color:var(--sea);font-size:15px}
.msg{padding:12px 14px;border-radius:4px;background:var(--surface);border:2px solid var(--stamp)}
.msg .e{display:block;color:var(--sea);font-size:15px}
.stamp{display:inline-block;align-self:flex-start;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;padding:2px 14px;transform:rotate(-5deg);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:st .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes st{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
}
ul.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li span{display:block;color:var(--sea);font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--fg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:58px;border:0;background:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-top:5px solid transparent;margin-top:-2px;padding:4px 2px}
.tab small{display:block;font-family:var(--body);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0}
.tab[aria-current="page"]{border-top-color:var(--tape);background:color-mix(in srgb,var(--tape) 16%,transparent)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.ov input[type=search]{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%}
.gl-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{overflow-wrap:anywhere}
.gl-item span{color:var(--sea);text-align:right;overflow-wrap:anywhere}
table.tt{border-collapse:collapse;width:100%;font-size:15px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tt td.c{font-family:var(--mono);text-align:center}

.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--tape)}
.turn{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:4px;display:flex;flex-direction:column}
.turn small{color:inherit;opacity:.85}
.txt{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%;min-width:0}
textarea.txt{min-height:96px;padding:10px 12px;resize:vertical}
details.old{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.old summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer}
details.old .card{border:0;border-top:1px solid var(--line);border-radius:0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img,.fig svg{display:block;width:100%;max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:#fff}
.fig.sm{max-width:260px}
.fig figcaption{font-size:14px;color:var(--muted)}
img.av{object-fit:cover;object-position:top center;background:#cde;border:2px solid var(--line)}
span.av{background:none}
.qa{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}.qa summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--stamp);margin-left:4px;vertical-align:middle}
.sus{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:68px;padding:8px 12px;border:2px solid var(--fg);background:var(--surface);border-radius:6px}
.sus .sn{flex:1;min-width:0;display:flex;flex-direction:column}
.sus .sn b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.sus .sn span,.sus .sn small{font-size:14px;color:var(--muted)}
.cnt2{font-family:var(--mono);font-weight:700}
.qbtn{text-align:left;min-height:60px;padding:10px 14px;border:2px solid var(--fg);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;gap:2px;width:100%}
.qbtn span{font-weight:700;font-size:17px}.qbtn small{color:var(--muted);font-size:14px}
.qbtn.done{border-style:dashed;color:var(--muted)}.qbtn[disabled]{opacity:.4;cursor:not-allowed}
.bubble{border-left:6px solid var(--tape)}
.who .ico{margin-left:auto}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}
.pill.cnt{background:var(--tape);color:#15202B;border-color:#15202B;font-size:20px;line-height:1}

.clock{border:2px solid var(--fg);background:var(--surface);border-radius:6px;padding:10px 12px}
.clock-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.clock-t b{font-family:var(--display);font-size:30px;line-height:1}
.clock-t span{font-size:15px}.clock-t small{width:100%;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape)}
.clock.hot{border-color:#b3261e}.clock.hot .bar i{background:#b3261e}.clock.hot b{color:#b3261e}
.help{border:2px dashed var(--fg)}
.hl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.hl li{display:flex;gap:12px;align-items:flex-start}
.hl li>span:last-child{flex:1;display:block}.hl small{display:block;color:var(--muted)}
.demo{display:inline-block;width:78px;text-align:center;font-weight:700;border:2px solid var(--fg);border-radius:6px;padding:4px 6px;background:var(--surface);flex:none;font-size:14px}
.demo.w{border:0;border-bottom:2px dotted var(--fg);border-radius:0;background:none}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--tape);padding-left:10px}
.tl li b{font-family:var(--display);font-size:20px;min-width:54px}
.tl li>span{flex:1;display:block}.tl small{display:block;color:var(--muted);font-size:13px}
.tl li.unk{border-left-color:var(--line);color:var(--muted)}
.entog{font-weight:700;padding:10px 16px;min-height:44px}
img.av,span.av{width:104px;height:104px;border-radius:10px;object-fit:cover;object-position:50% 20%;border:2px solid var(--fg);flex:none}
span.av svg{width:100%;height:100%}
.sus img.av,.sus span.av{width:84px;height:84px}
.bubble .who img.av,.bubble .who span.av{width:76px;height:76px}
.sus{min-height:96px}
.fig.sm{max-width:none;width:100%}
.fig img,.fig svg{width:100%;height:auto;min-height:220px;object-fit:cover}
</style>

<div id="app"></div>
<div id="gl" class="ov" hidden></div>
<script>
(function(){
'use strict';
function fig(inner,it,en,cls){return '<figure class="fig '+(cls||'')+'">'+inner+'<figcaption><span lang="it">'+it+'</span> · <span lang="en">'+en+'</span></figcaption></figure>'}
function S(w,h,body,label){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>'}
function faceSVG(f,size){
 var s=f.skin,h=f.hair,st=f.style||'short',sh=f.shirt||'#556',bg=f.bg||'#dfe6ea';
 var o='<svg viewBox="0 0 64 64" width="'+size+'" height="'+size+'" aria-hidden="true"><rect width="64" height="64" fill="'+bg+'"/>';
 if(st==='long')o+='<path d="M13 34C12 14 22 8 32 8s20 6 19 26v20H13z" fill="'+h+'"/>';
 o+='<path d="M7 64c0-13 10-19 25-19s25 6 25 19z" fill="'+sh+'"/><rect x="27" y="38" width="10" height="10" rx="3" fill="'+s+'"/><ellipse cx="32" cy="29" rx="12" ry="14" fill="'+s+'"/>';
 if(st==='short')o+='<path d="M19.5 28C18 14 25 9 32 9s14 5 12.5 19c-2-6-6-9-12.5-9s-10.5 3-12.5 9z" fill="'+h+'"/>';
 if(st==='long')o+='<path d="M20 28c0-9 5-13 12-13s12 4 12 13c-3-4-7-6-12-6s-9 2-12 6z" fill="'+h+'"/>';
 if(st==='bun')o+='<circle cx="32" cy="8" r="6" fill="'+h+'"/><path d="M19.5 28C18 14 25 10 32 10s14 4 12.5 18c-2-6-6-9-12.5-9s-10.5 3-12.5 9z" fill="'+h+'"/>';
 if(st==='cap'){var cc=f.cap||'#2f5fa8';o+='<path d="M18 23c0-10 6-15 14-15s14 5 14 15z" fill="'+cc+'"/><rect x="15" y="22" width="34" height="4" rx="2" fill="'+cc+'"/>'}
 o+='<circle cx="27" cy="29" r="1.7" fill="#1d1d1d"/><circle cx="37" cy="29" r="1.7" fill="#1d1d1d"/>';
 if(f.beard)o+='<path d="M20 32c0 10 5 15 12 15s12-5 12-15c-3 4-7 5-12 5s-9-1-12-5z" fill="'+h+'"/>';
 if(f.stache||f.beard)o+='<path d="M26 34q6-3 12 0q-6 2-12 0z" fill="'+h+'"/>';
 o+='<path d="M28 39q4 2.5 8 0" stroke="#7a3b3b" stroke-width="1.6" fill="none" stroke-linecap="round"/>';

 {id:'marco',name:'Marco Riva',age:45,role:'il socio',roleEn:'the business partner',desc:`Doveva molti soldi a Lorenzo. Dice di essere stato in giardino al telefono.`,descEn:'He owed Lorenzo a lot of money. He says he was in the garden on the phone.',face:{}},

 {id:'paolo',name:'Paolo Neri',age:64,role:'il vicino',roleEn:'the neighbour',desc:`Abita accanto alla villa. Ha sentito una porta chiudersi.`,descEn:'He lives next to the villa. He heard a door close.',face:{}},

var VICTIM={name:'Lorenzo Bianchi',it:'62 anni · padrone di Palazzo Rosa',en:'62 · owner of Palazzo Rosa',face:{img:FIMG.lorenzo},bio:[`Lorenzo amava le feste, i libri e le rose bianche. Quella sera era felice e un po' nervoso: doveva dire a qualcuno una [verità|truth] difficile, ma voleva farlo con calma, da solo. Non ha fatto in tempo.`,`Lorenzo loved parties, books and white roses. That evening he was happy and a little nervous: he had to tell someone a difficult truth, but he wanted to do it calmly, alone. He did not make it in time.`]};
var QS=[
 {k:'alibi',col:'alibi',it:`Dov'eri tra le 21:10 e le 21:25?`,en:'Where were you between 9:10 and 9:25 p.m.?'},
 {k:'rapporto',col:'motive',it:`Che rapporto avevi con Lorenzo?`,en:'What was your relationship with Lorenzo?'},
 {k:'key',col:'access',it:`Conosci il passaggio di servizio dietro la libreria?`,en:'Do you know the service passage behind the bookcase?'},
 {k:'know',col:'saw',it:`Hai visto o sentito qualcosa di strano?`,en:'Did you see or hear anything strange?'}
];
var ANS={
 anna:{
  alibi:[`Ero in salotto, con gli ospiti. Ho chiacchierato con qualcuno vicino al buffet, ma non ricordo con chi: c'era così tanta gente che non mi sono ricordata dei volti. Non mi sono mai mossa da lì, te lo assicuro.`,`I was in the living room, with the guests. I chatted with someone near the buffet, but I do not remember with whom: there were so many people that I did not remember the faces. I never moved from there, I assure you.`],
  rapporto:[`Lorenzo era mio zio e anche il mio capo: lavoro nell'azienda di famiglia, in [amministrazione|administration]. Mi ha sempre trattata come una figlia. Per questo la sua morte mi ha distrutta: non riesco ancora a crederci.`,`Lorenzo was my uncle and also my boss: I work in the family company, in administration. He always treated me like a daughter. That is why his death has devastated me: I still cannot believe it.`],
  key:[`Il passaggio dietro la libreria? Sì, lo conosco: da bambini lo usavamo per giocare a nascondino, io, mio zio ed Elena. Ma sono passati vent'anni, e non lo uso più. Perché dovrei andarci proprio stasera?`,`The passage behind the bookcase? Yes, I know it: as children we used it to play hide and seek, I, my uncle and Elena. But twenty years have passed, and I no longer use it. Why would I go there tonight of all nights?`],
  know:[`Sì: ho visto Marco camminare nervosamente vicino alla porta dello studio e aveva in mano una piccola bottiglia. Se vuoi il mio parere, sta nascondendo qualcosa. Ed è stato lui a litigare con mio zio per i soldi.`,`Yes: I saw Marco pacing nervously near the study door and he had a small bottle in his hand. If you want my opinion, he is hiding something. And he was the one who argued with my uncle about money.`]},
 marco:{
  alibi:[`Alle 21:15 ero in giardino, al telefono con mia moglie, e non sono mai entrato nello studio. Sono rimasto vicino al cancello, sotto il lampione, dalle 21:10 fino alle 21:30: il telefono può dimostrarlo, e credo anche che Davide mi abbia visto.`,`At 9:15 I was in the garden, on the phone with my wife, and I never went into the study. I stayed near the gate, under the lamp, from 9:10 until 9:30: the phone can prove it, and I believe Davide also saw me.`],
  rapporto:[`Ero il suo socio da dieci anni. È vero che gli dovevo ventimila euro e che abbiamo discusso, ma Lorenzo aveva accettato di aspettare fino all'autunno. Non avevo alcun motivo per fargli del male: da morto non poteva più aiutarmi.`,`I was his partner for ten years. It is true that I owed him twenty thousand euros and that we argued, but Lorenzo had agreed to wait until autumn. I had no reason to harm him: dead, he could no longer help me.`],
  key:[`L'ho scoperto soltanto l'anno scorso, per caso, quando cercavo un libro. Ma non l'ho mai usato, e comunque stasera non avrei avuto nessun motivo di nascondermi: ero in giardino, davanti a tutti.`,`I only found out last year, by chance, when I was looking for a book. But I never used it, and in any case tonight I would have had no reason to hide: I was in the garden, in front of everyone.`],
  know:[`Nella bottiglietta c'era olio alle mandorle per la barba! Lo uso ogni giorno e lo porto sempre con me: chiedetelo a chiunque mi conosca. Mi sembra assurdo che qualcuno abbia pensato a un [veleno|poison].`,`In the little bottle there was almond oil for my beard! I use it every day and I always carry it with me: ask anyone who knows me. It seems absurd to me that anyone thought of poison.`]},
 giulia:{
  alibi:[`Dalle 21:10 ero in cucina con i miei due aiutanti, Teresa e Nino: stavamo preparando il dolce per le 21:30. Se vuoi, puoi chiedere a loro: non siamo mai usciti dalla cucina, perché c'era moltissimo lavoro.`,`From 9:10 I was in the kitchen with my two assistants, Teresa and Nino: we were preparing the dessert for 9:30. If you like, you can ask them: we never left the kitchen, because there was a great deal of work.`],
  rapporto:[`Lavoro per Lorenzo da quindici anni. Quella sera era stanco e si lamentava di un forte mal di stomaco, così alle 21:05 gli ho portato una bevanda nello studio: soltanto acqua e limone. Lui ne ha bevuto un sorso e ha lasciato il bicchiere sul tavolo.`,`I have worked for Lorenzo for fifteen years. That evening he was tired and complained of a strong stomach ache, so at 9:05 I took him a drink in the study: only water and lemon. He drank a sip and left the glass on the table.`],
  key:[`Il passaggio? Io non lo conosco: sono sempre entrata dalla porta dello studio, e non mi sono mai interessata alla libreria. So soltanto che alcuni membri della famiglia ci giocavano da piccoli.`,`The passage? I do not know it: I have always come in through the study door, and I was never interested in the bookcase. I only know that some members of the family used to play there as children.`],
  know:[`Sì, una cosa. Verso le 21:10, mentre tornavo in cucina, ho visto una donna con un foulard colorato nel corridoio dello studio. Ero troppo lontana per riconoscerne il viso, ma il foulard era molto vistoso, non si poteva non notarlo.`,`Yes, one thing. Around 9:10, as I was going back to the kitchen, I saw a woman with a colourful scarf in the study corridor. I was too far away to recognise her face, but the scarf was very showy, you could not miss it.`]},
 paolo:{
  alibi:[`Ero a casa mia, qui accanto: avevo lasciato la festa presto, perché non mi sentivo bene. Stavo guardando la televisione. Purtroppo non ho testimoni, perché vivo da solo: ma non ho motivo di mentire.`,`I was at my house, next door: I had left the party early, because I was not feeling well. I was watching television. Unfortunately I have no witnesses, because I live alone: but I have no reason to lie.`],
  rapporto:[`Siamo vicini da venti anni e, ogni giovedì, giocavamo a carte. Lorenzo era una persona generosa, anche se a volte troppo riservata. Non avevo nessun motivo di fargli del male: ho perso un amico.`,`We have been neighbours for twenty years and, every Thursday, we played cards. Lorenzo was a generous person, although sometimes too reserved. I had no reason to harm him: I have lost a friend.`],
  key:[`Dalla finestra del mio bagno vedo l'uscita del corridoio di servizio, vicino al garage, ma non l'ho mai percorso. Non conosco la libreria: so soltanto che esiste un passaggio, perché una volta Lorenzo me l'aveva raccontato.`,`From my bathroom window I can see the exit of the service corridor, near the garage, but I have never walked it. I do not know the bookcase: I only know that a passage exists, because Lorenzo told me once.`],
  know:[`Verso le 21:20 ho sentito una porta chiudersi piano. Poi ho sentito dei passi veloci, con un rumore secco: sembravano tacchi, non scarpe da uomo. Non ho visto chi fosse uscito, perché la finestra è piccola e quel lato della casa è buio.`,`Around 9:20 I heard a door close softly. Then I heard quick steps, with a sharp sound: they seemed like heels, not men's shoes. I did not see who had come out, because the window is small and that side of the house is dark.`]},
 elena:{
  alibi:[`Dalle 21:10 alle 21:30 ero sulla [terrazza|terrace] con Chiara: stavamo parlando di nostro fratello, che era molto stanco. Ci ha viste anche Tommaso, quando ci ha fotografate alle 21:12. Non ci siamo mai separate.`,`From 9:10 to 9:30 I was on the terrace with Chiara: we were talking about my brother, who was very tired. Tommaso also saw us, when he photographed us at 9:12. We never separated.`],
  rapporto:[`Lorenzo era mio fratello e mi ha sempre protetta. Non avevamo segreti, o almeno così credevo: stasera sembrava preoccupato, come se dovesse rivelare qualcosa di difficile. Ci siamo abbracciati un'ultima volta alle 20:30.`,`Lorenzo was my brother and he always protected me. We had no secrets, or at least so I thought: tonight he seemed worried, as if he had to reveal something difficult. We hugged for the last time at 8:30.`],
  key:[`Lo conoscevamo in tre: io, Lorenzo e Anna, perché ci giocavamo da piccoli. Marco l'ha scoperto soltanto l'anno scorso, ma non l'ha mai usato. Il passaggio sbuca vicino al garage e chi lo percorre può uscire senza essere visto.`,`Three of us knew it: me, Lorenzo and Anna, because we played there as children. Marco only found out last year, but he never used it. The passage comes out near the garage, and whoever walks it can get out without being seen.`],
  know:[`La finestra dello studio era chiusa dall'interno: l'ho notato subito. Quindi chiunque sia entrato o uscito l'ha fatto dalla porta oppure dal passaggio. E dalla porta, in corridoio, c'era troppa gente per passare inosservati.`,`The study window was locked from the inside: I noticed it immediately. So whoever came in or went out did so through the door or through the passage. And through the door, in the corridor, there were too many people to go unnoticed.`]},
 luca:{
  alibi:[`Ho suonato il piano dalle 21:00 alle 21:25, davanti a una trentina di ospiti, quindi in molti possono confermarlo. Dal pianoforte vedo tutta la sala, anche se di solito non guardo la gente: guardo la tastiera.`,`I played the piano from 9:00 to 9:25, in front of about thirty guests, so many can confirm it. From the piano I can see the whole room, although I usually do not watch people: I watch the keyboard.`],
  rapporto:[`Suono a Palazzo Rosa da cinque anni, a ogni festa. Lorenzo mi pagava bene e mi lasciava scegliere la musica: per me era più un amico che un cliente. Non ho mai avuto un litigio con lui.`,`I have played at Palazzo Rosa for five years, at every party. Lorenzo paid me well and let me choose the music: to me he was more a friend than a client. I never had an argument with him.`],
  key:[`Un passaggio dietro la libreria? Non ne ho mai sentito parlare. Io entro dalla sala e non conosco le altre stanze: la casa è molto grande e non mi sono mai perso in giro.`,`A passage behind the bookcase? I have never heard of it. I come in through the hall and I do not know the other rooms: the house is very big and I never wandered around.`],
  know:[`Sì. Marco è uscito in giardino alle 21:10. Subito dopo, verso le 21:15, mi sono accorto che Anna non era più tra gli ospiti: è ritornata più tardi, un po' agitata. E verso le 21:20 una porta si è chiusa in fondo al corridoio.`,`Yes. Marco went out to the garden at 9:10. Right after, around 9:15, I realised Anna was no longer among the guests: she came back later, a bit agitated. And around 9:20 a door closed at the end of the corridor.`]},
 sara:{
  alibi:[`Dalle 21:05 alle 21:25 ero al buffet a prendere appunti per un articolo, e ho parlato con tre invitati: possono confermarlo. Non sono mai andata verso lo studio, perché Lorenzo mi aveva detto che mi avrebbe cercata lui.`,`From 9:05 to 9:25 I was at the buffet taking notes for an article, and I spoke with three guests: they can confirm it. I never went towards the study, because Lorenzo had told me he would look for me himself.`],
  rapporto:[`Alle 20:50 Lorenzo mi ha detto che voleva rivelare un segreto, ma che prima doveva parlare con una persona di cui si fidava. Mi aveva promesso una notizia importante per il mio giornale: non ho fatto in tempo a sentirla.`,`At 8:50 Lorenzo told me he wanted to reveal a secret, but that first he had to talk to a person he trusted. He had promised me an important story for my newspaper: I did not make it in time to hear it.`],
  key:[`Non conosco la villa così bene, sono una giornalista, non una parente. Ma ricordo che Lorenzo, in un'intervista di anni fa, raccontò che il palazzo aveva un passaggio segreto: ci rise sopra e disse che serviva ai bambini.`,`I do not know the villa so well, I am a journalist, not a relative. But I remember that Lorenzo, in an interview years ago, said that the palace had a secret passage: he laughed about it and said it was for the children.`],
  know:[`Sì: Lorenzo aveva scoperto un falso. Qualcuno imitava la sua firma per prelevare denaro dall'azienda da circa un anno. Non mi ha fatto il nome, ma ha detto: «È qualcuno della famiglia.» Attenzione, però: avevano accesso ai conti anche persone che non sono parenti.`,`Yes: Lorenzo had discovered a forgery. Someone had been imitating his signature to withdraw money from the company for about a year. He did not give me the name, but he said: "It is someone in the family." Careful, though: people who are not relatives also had access to the accounts.`]},
 davide:{
  alibi:[`Dalle 21:10 ero dietro la villa, a controllare l'impianto dell'acqua: l'ho fatto da solo, quindi non ho testimoni. Ma ero a quaranta metri dal garage e, se qualcuno fosse uscito dal passaggio prima delle 21:28, penso che l'avrei visto.`,`From 9:10 I was behind the villa, checking the water system: I did it alone, so I have no witnesses. But I was forty metres from the garage and, if anyone had come out of the passage before 9:28, I think I would have seen them.`],
  rapporto:[`Lavoro qui da dodici anni e Lorenzo mi ha sempre trattato con rispetto: l'anno scorso mi ha anche aumentato lo stipendio. Piantava rose bianche sotto la finestra dello studio: mi aiutava lui, nelle domeniche libere.`,`I have worked here for twelve years and Lorenzo always treated me with respect: last year he even raised my salary. He planted white roses under the study window: he helped me himself, on his free Sundays.`],
  key:[`Il passaggio sbuca vicino al garage, dietro la villa, dove stavo lavorando. Ma non sono mai entrato dalla libreria: lo conosco soltanto perché Lorenzo, una volta, mi ha mostrato l'uscita. Sono un giardiniere, non un detective.`,`The passage comes out near the garage, behind the villa, where I was working. But I never went in through the bookcase: I only know it because Lorenzo once showed me the exit. I am a gardener, not a detective.`],
  know:[`Due cose. Alle 21:10 ho visto Marco uscire in giardino: l'ho visto vicino al cancello, sotto il lampione, mentre parlava al telefono, e camminava avanti e indietro fino alle 21:28. Poi, più tardi, ho notato impronte di tacchi sul terreno bagnato, vicino alla porta di servizio.`,`Two things. At 9:10 I saw Marco go out to the garden: I saw him near the gate, under the lamp, talking on the phone, pacing up and down until 9:28. Then, later, I noticed heel prints on the wet ground, near the service door.`]},
 chiara:{
  alibi:[`Dalle 21:10 alle 21:30 ero sulla terrazza con Elena: abbiamo parlato di Lorenzo e di quanto fosse affaticato. Tommaso ci ha fotografate alle 21:12, e nessuna delle due si è mossa da lì fino a quando abbiamo sentito il grido di Giulia.`,`From 9:10 to 9:30 I was on the terrace with Elena: we talked about Lorenzo and how tired he was. Tommaso photographed us at 9:12, and neither of us moved from there until we heard Giulia's scream.`],
  rapporto:[`Lorenzo era un caro amico: per il suo compleanno gli ho regalato una colonia al sandalo. Quando ho visto il bicchiere ho sentito un odore dolce, quasi di mandorla ma troppo forte e un po' amaro: non assomiglia per niente al mio regalo.`,`Lorenzo was a dear friend: for his birthday I gave him a sandalwood cologne. When I saw the glass I smelled something sweet, almost almond but too strong and a little bitter: it is nothing like my gift.`],
  key:[`Non sapevo nemmeno che esistesse un passaggio: mi sembra una cosa da film. Sono amica di Lorenzo da vent'anni, ma non ho mai sentito parlare di porte nascoste. Probabilmente lo conoscevano soltanto i parenti.`,`I did not even know that a passage existed: it seems like something from a film. I have been Lorenzo's friend for twenty years, but I have never heard of hidden doors. Probably only the relatives knew it.`],
  know:[`È l'olio alle mandorle di Marco? Non credo: quello per la barba ha un profumo leggero e piacevole, mentre l'odore del bicchiere era chimico, completamente diverso. Non può essere olio per la barba.`,`Is it Marco's almond oil? I do not think so: the beard oil has a light, pleasant scent, while the smell of the glass was chemical, completely different. It cannot be beard oil.`]},
 tommaso:{
  alibi:[`Le mie foto hanno l'orario: alle 21:12 ho fotografato Elena e Chiara sulla terrazza, alle 21:18 ho scattato nel corridoio, vicino allo studio, e alle 21:24 ero di nuovo in salotto. Quindi in quei minuti ero sempre in movimento, tra molte persone.`,`My photos have the time: at 9:12 I photographed Elena and Chiara on the terrace, at 9:18 I shot in the corridor, near the study, and at 9:24 I was back in the living room. So during those minutes I was always on the move, among many people.`],
  rapporto:[`Sono il fotografo di famiglia da qualche anno: Lorenzo mi chiamava per ogni festa, e voleva sempre più foto dei bambini che dei grandi. Per me era un cliente gentile, non un nemico: non avevo nessun interesse alla sua morte.`,`I have been the family photographer for a few years: Lorenzo called me for every party, and he always wanted more photos of the children than of the adults. To me he was a kind client, not an enemy: I had no interest in his death.`],
  key:[`Il passaggio dietro la libreria? No, non lo conoscevo. Ma nello specchio dello studio, nella foto delle 21:18, si vede la libreria dietro la figura: era leggermente aperta, come se qualcuno stesse uscendo.`,`The passage behind the bookcase? No, I did not know it. But in the study mirror, in the 9:18 photo, you can see the bookcase behind the figure: it was slightly open, as if someone were coming out.`],
  know:[`Nella foto delle 21:18, nello specchio dello studio, c'è una figura vicino alla libreria: ha i capelli lunghi e un foulard colorato, ed è più bassa di Marco. Il viso non si vede, perché è nascosto dal riflesso della lampada. Il file ha l'orario originale e non è stato modificato.`,`In the 9:18 photo, in the study mirror, there is a figure near the bookcase: it has long hair and a colourful scarf, and is shorter than Marco. The face cannot be seen, because it is hidden by the reflection of the lamp. The file has the original time and has not been edited.`]}
};
var STORY={
 it:[
  `Sabato sera, ore 20:30. Palazzo Rosa brilla di luci: più di venti invitati, musica dal vivo, un buffet e il padrone di casa, Lorenzo Bianchi, che brinda con tutti. Sembra la festa perfetta. Ma Lorenzo, ogni tanto, guarda l'orologio e sparisce nel suo studio.`,
  `Alle 21:30 la cuoca grida. Lorenzo è nello studio, morto. La porta è socchiusa, la finestra è chiusa dall'interno. Sul tavolo ci sono un bicchiere e una lettera strappata a metà. Il [silenzio|silence] nella villa è improvviso: la musica si è fermata.`,
  `La commissaria Fabbri arriva in pochi minuti, chiude il cancello e guarda gli invitati uno a uno: «Nessuno lascia il palazzo. Qualcuno, tra voi, sa che cosa è successo. E mente.»`,
  `Sono le 21:40. Avete tempo fino a mezzanotte, poi gli invitati se ne vanno. Dieci persone, un solo colpevole. Voi siete gli assistenti della commissaria: [interrogate|question] gli invitati, leggete i rapporti, confrontate le versioni con i fatti. Ogni domanda costa dieci minuti: ne avete soltanto 14.`
 ],
 en:[
  `Saturday evening, 8:30 p.m. Palazzo Rosa is shining with lights: more than twenty guests, live music, a buffet and the host, Lorenzo Bianchi, toasting with everyone. It looks like the perfect party. But Lorenzo, now and then, looks at his watch and disappears into his study.`,
  `At 9:30 p.m. the cook screams. Lorenzo is in the study, dead. The door is ajar, the window is locked from the inside. On the desk there are a glass and a letter torn in half. The silence in the villa is sudden: the music has stopped.`,
  `Commissioner Fabbri arrives within minutes, closes the gate and looks at the guests one by one: "Nobody leaves the palace. Someone among you knows what happened. And is lying."`,
  `It is 9:40 p.m. You have until midnight, then the guests leave. Ten people, one culprit. You are the commissioner's assistants: question the guests, read the reports, compare the versions with the facts. Every question costs ten minutes: you only have 14.`
 ]
};
var TIMELINE=[
 {t:'20:30',a:'elena.rapporto',it:`Elena abbraccia suo fratello Lorenzo. Lui sembra preoccupato.`,en:`Elena hugs her brother Lorenzo. He seems worried.`},
 {t:'20:50',a:'sara.rapporto',it:`Lorenzo dice a Sara che rivelerà un segreto, dopo aver parlato con una persona di cui si fida.`,en:`Lorenzo tells Sara he will reveal a secret, after talking to a person he trusts.`},
 {t:'21:00',a:'luca.alibi',it:`Luca comincia a suonare il piano davanti agli ospiti. Suona fino alle 21:25.`,en:`Luca starts playing the piano in front of the guests. He plays until 9:25.`},
 {t:'21:05',a:'giulia.rapporto',it:`Giulia porta a Lorenzo, nello studio, acqua e limone. Lui ne beve un sorso.`,en:`Giulia takes Lorenzo water and lemon in the study. He drinks a sip.`},
 {t:'21:10',a:'davide.know',it:`Marco esce in giardino e telefona. Davide lo vede sotto il lampione fino alle 21:28.`,en:`Marco goes out to the garden and phones. Davide sees him under the lamp until 9:28.`},
 {t:'21:10',a:'giulia.know',it:`Giulia vede una donna con un foulard colorato nel corridoio dello studio.`,en:`Giulia sees a woman with a colourful scarf in the study corridor.`},
 {t:'21:12',a:'chiara.alibi',it:`Tommaso fotografa Elena e Chiara sulla terrazza.`,en:`Tommaso photographs Elena and Chiara on the terrace.`},
 {t:'21:15',a:'luca.know',it:`Luca si accorge che Anna non è più tra gli ospiti.`,en:`Luca realises Anna is no longer among the guests.`},
 {t:'21:15',at:0,it:`L'ora scritta nella lettera: «Alle 21:15. Vieni da solo.»`,en:`The time written in the letter: "At 9:15. Come alone."`},
 {t:'21:18',a:'tommaso.know',it:`Nello specchio dello studio, una figura con foulard colorato e capelli lunghi, accanto alla libreria.`,en:`In the study mirror, a figure with a colourful scarf and long hair, next to the bookcase.`},
 {t:'21:20',a:'paolo.know',it:`Paolo sente una porta e dei tacchi vicino al garage.`,en:`Paolo hears a door and heels near the garage.`},
 {t:'21:30',at:0,it:`Giulia trova Lorenzo morto. La commissaria chiude il cancello.`,en:`Giulia finds Lorenzo dead. The commissioner closes the gate.`}
];
var REPORTS=[
 {at:0,t:'Il bicchiere',it:`Sul tavolo dello studio c'è un bicchiere mezzo pieno. Ha un odore dolce e strano, quasi di mandorla, ma troppo forte. Non si distinguono impronte chiare, perché qualcuno lo ha pulito con molta cura. La cuoca dice di aver portato a Lorenzo, alle 21:05, soltanto acqua e limone.`,en:`On the study desk there is a half-full glass. It has a sweet, strange smell, almost almond, but too strong. No clear fingerprints can be made out, because someone wiped it with great care. The cook says she took Lorenzo only water and lemon at 9:05.`,img:'bicchiere'},
 {at:0,t:'La lettera',it:`Accanto al bicchiere c'è una lettera strappata. Si legge: «Alle 21:15. Vieni da solo. Devo dirti la verità.» La parte con il nome e con la firma è stata strappata. Il medico stabilisce che Lorenzo è morto tra le 21:15 e le 21:30, probabilmente per un [veleno|poison] che agisce in pochi minuti.`,en:`Next to the glass there is a torn letter. It reads: "At 9:15. Come alone. I must tell you the truth." The part with the name and the signature has been torn off. The doctor establishes that Lorenzo died between 9:15 and 9:30, probably from a poison that acts in a few minutes.`,img:'lettera'},
 {at:3,t:'La chiave',it:`La chiave dello studio si trova sul pavimento, vicino alla porta: chi è uscito di fretta non ha avuto il tempo di chiudere a chiave. La finestra, però, è chiusa dall'interno. Dietro la libreria c'è un piccolo passaggio di servizio che sbuca vicino al garage: la libreria, oggi, non è perfettamente chiusa.`,en:`The study key is on the floor near the door: whoever left in a hurry did not have time to lock it. The window, however, is locked from the inside. Behind the bookcase there is a small service passage that comes out near the garage: the bookcase, today, is not perfectly closed.`,img:'chiave'},
 {at:4,twist:true,t:'Marco tenta di scappare',it:`Alle 21:50 la polizia ferma Marco al cancello, con una borsa in mano e le chiavi della macchina. Dice di avere paura e di volere soltanto andare a casa da sua moglie. Per molti invitati, è lui il colpevole: ha un debito, una bottiglietta strana e ha tentato di fuggire.`,en:`At 9:50 the police stop Marco at the gate, with a bag in his hand and the car keys. He says he is afraid and only wants to go home to his wife. For many guests, he is the culprit: he has a debt, a strange little bottle and he tried to run away.`},
 {at:6,t:'Il laboratorio',it:`Il laboratorio analizza il bicchiere: non contiene olio alle mandorle, ma una sostanza chimica dolce e [letale|lethal], che non si trova in giardino né in cucina. Il veleno è stato aggiunto dopo le 21:05, quando la cuoca ha lasciato il bicchiere sul tavolo. Chi ha pulito il vetro lo ha fatto con un fazzoletto di stoffa.`,en:`The laboratory analyses the glass: it does not contain almond oil, but a sweet, lethal chemical substance, which is not found in the garden or in the kitchen. The poison was added after 9:05, when the cook left the glass on the desk. Whoever cleaned the glass did so with a cloth handkerchief.`},
 {at:8,twist:true,t:'La telefonata di Marco',it:`Colpo di scena! La compagnia telefonica conferma: Marco è rimasto al telefono con sua moglie dalle 21:12 alle 21:28. Il segnale arriva dal giardino, vicino al cancello. Marco non può essere entrato nello studio. Il colpevole è ancora libero, e forse sta guardando la polizia da vicino.`,en:`Plot twist! The phone company confirms: Marco stayed on the phone with his wife from 9:12 to 9:28. The signal comes from the garden, near the gate. Marco cannot have entered the study. The culprit is still free, and perhaps watching the police from close by.`},
 {at:9,t:'La foto delle 21:18',it:`Il fotografo consegna la foto delle 21:18, scattata nel corridoio: nello specchio dello studio si vede una figura con i capelli lunghi e un foulard colorato, accanto alla libreria. Il viso è nascosto dal riflesso della lampada. Il file non è stato modificato. La figura è più bassa di Marco, che è molto alto e porta i capelli corti.`,en:`The photographer hands over the 9:18 photo, taken in the corridor: in the study mirror you can see a figure with long hair and a colourful scarf, next to the bookcase. The face is hidden by the reflection of the lamp. The file has not been edited. The figure is shorter than Marco, who is very tall and has short hair.`},
 {at:12,t:'I conti dell\'azienda',it:`La polizia controlla i conti: da circa un anno qualcuno preleva denaro con la firma di Lorenzo, ma la firma è un'imitazione. Tra i presenti alla festa, hanno accesso alla firma e ai conti soltanto due persone che lavorano in amministrazione: Anna e Marco. Lorenzo aveva scoperto tutto e voleva parlarne con «una persona di cui si fidava».`,en:`The police check the accounts: for about a year someone has been withdrawing money with Lorenzo's signature, but the signature is an imitation. Among those present at the party, only two people who work in administration have access to the signature and the accounts: Anna and Marco. Lorenzo had discovered everything and wanted to talk about it with "a person he trusted".`}
];
var HINT={it:`Aiuto della commissaria: Marco ha un movente evidente, ma chiedetevi se può dimostrare dove si trovava. Poi confrontate chi non era in salotto tra le 21:10 e le 21:25 con la figura nella foto: foulard, capelli lunghi, tacchi.`,en:`Help from the commissioner: Marco has an obvious motive, but ask yourselves whether he can prove where he was. Then compare who was not in the living room between 9:10 and 9:25 with the figure in the photo: scarf, long hair, heels.`};

var SOL={
 it:[
  `La commissaria Fabbri riunisce tutti nel salotto e dice: «Tutto sembrava indicare Marco: il debito, la bottiglietta, il litigio. Ma ogni prova contro di lui crolla, una dopo l'altra.»`,
  `Marco era in giardino, sotto il lampione, dalle 21:12 alle 21:28: lo ha visto Davide e lo conferma il telefono. La bottiglietta conteneva olio per la barba, non veleno. E nella foto delle 21:18 la figura è più bassa di lui e ha i capelli lunghi.`,
  `Lorenzo aveva scoperto che qualcuno della famiglia imitava la sua firma per prelevare denaro dall'azienda. I prelievi erano cominciati un anno prima, proprio quando Anna aveva iniziato a lavorare in amministrazione. Lorenzo, che si fidava di lei, le scrisse: «Alle 21:15. Vieni da solo. Devo dirti la verità.»`,
  `Prima di incontrarlo, Anna lasciò il salotto tra le 21:10 e le 21:25, come ha notato Luca. Giulia vide una donna con un foulard colorato nel corridoio, e Anna indossava proprio quel foulard. Quando Anna entrò nello studio, mise una sostanza dall'odore dolce nel bicchiere di Lorenzo.`,
  `Anna conosceva il passaggio dietro la libreria fin da bambina, e uscì da lì: Paolo sentì i tacchi alle 21:20 e Davide trovò le impronte nel fango. Poi pulì il bicchiere, strappò la parte della lettera con il suo nome e tornò in salotto. Quando la polizia le chiese dove fosse stata, rispose in modo vago e accusò Marco.`,
  `Anna resta immobile, poi dice con la voce rotta: «Non volevo che finisse così. Lui voleva soltanto parlare, e io... avevo troppa paura.»`
 ],
 en:[
  `Commissioner Fabbri gathers everyone in the living room and says: "Everything seemed to point to Marco: the debt, the little bottle, the argument. But every piece of evidence against him falls apart, one after another."`,
  `Marco was in the garden, under the lamp, from 9:12 to 9:28: Davide saw him and the phone confirms it. The little bottle held beard oil, not poison. And in the 9:18 photo the figure is shorter than him and has long hair.`,
  `Lorenzo had discovered that someone in the family was imitating his signature to take money from the company. The withdrawals had begun a year earlier, just when Anna had started working in administration. Lorenzo, who trusted her, wrote to her: "At 9:15. Come alone. I must tell you the truth."`,
  `Before meeting him, Anna left the living room between 9:10 and 9:25, as Luca noticed. Giulia saw a woman with a colourful scarf in the corridor, and Anna was wearing exactly that scarf. When Anna entered the study, she put a sweet-smelling substance in Lorenzo's glass.`,
  `Anna had known the passage behind the bookcase since childhood, and she left that way: Paolo heard the heels at 9:20 and Davide found the prints in the mud. Then she wiped the glass, tore off the part of the letter with her name and went back to the living room. When the police asked her where she had been, she answered vaguely and accused Marco.`,
  `Anna stays motionless, then says with a broken voice: "I did not want it to end like this. He only wanted to talk, and I... I was too afraid."`
 ]
};
var CULPRIT='anna';
var TEACHER=`Anna Conti. Lorenzo scopre che qualcuno della famiglia imita la sua firma per prelevare denaro (da un anno, da quando Anna lavora in amministrazione) e le scrive «Alle 21:15. Vieni da solo». Anna lascia il salotto tra le 21:10 e le 21:25 (Luca), ha il foulard colorato (Giulia, foto 21:18 di Tommaso), usa il passaggio dietro la libreria (conosciuto da Elena, Lorenzo, Anna), tacchi alle 21:20 (Paolo, impronte di Davide). Marco: in giardino 21:12-21:28 (Davide), la bottiglietta è olio per la barba. Alibi degli altri: Luca (piano), Sara (buffet), Giulia (cucina), Elena e Chiara (terrazza), Tommaso (foto con orario).`;
var EPI={title:'Il segreto di Lorenzo',teaser:['Il caso è chiuso. Ma il telefono di Lorenzo, dietro i libri della libreria, non è ancora stato ascoltato.','The case is closed. But Lorenzo\'s phone, behind the books in the bookcase, has not been listened to yet.'],
 it:[
  `Anna viene portata via dalla polizia. Nello studio resta il silenzio. Poi la commissaria prende il telefono di Lorenzo, trovato dietro i libri della libreria, e sorride: «Lorenzo era un uomo prudente.»`,
  `Lorenzo, che sospettava qualcosa, aveva attivato la [registrazione|recording] vocale prima dell'incontro. La commissaria preme il pulsante. Si sente una porta, poi la voce di Anna, bassa e veloce: «Non dovevi scoprirlo, zio. Non dovevi.» E la voce stanca di Lorenzo: «Volevo aiutarti, Anna.»`,

function viewNote(){

    h+='</tr>';
  });
  h+='</tbody></table></div><div class="card"><p class="it" lang="it">Esempio: Nicola ha una chiave? Se sì, tocca <b>Sì</b> nella colonna Chiave.</p><p class="en" lang="en">Example: does Nicola have a key? If yes, tap Yes in the Key column.</p></div>';

    h+='<details class="old"><summary>'+esc(c.name)+' · '+Object.keys(a).length+'/4</summary><div class="stack" style="padding:12px 14px">';
    QS.forEach(function(q){if(a[q.k]){var an=ANS[c.id][q.k];h+='<div><p class="it" lang="it"><b>'+esc(q.it)+'</b></p><p class="it" lang="it">«'+mk(an[0])+'»</p><div class="gloss" hidden></div><button type="button" class="entog" data-act="enq" aria-expanded="false">English</button><p class="en" lang="en" hidden>'+esc(an[1])+'</p></div>'}});

function ratingHtml(){
  if(!S.solved)return '';
  var sc=S.used+3*(S.att||0),stars=sc<=10?3:(sc<=14?2:1);
  var L={3:['Investigatore Maestro','Master detective'],2:['Investigatore Esperto','Expert detective'],1:['Investigatore Junior','Junior detective']}[stars];
  var s='';for(var i=0;i<3;i++)s+=i<stars?'★':'☆';
  return '<div class="card"><div class="card-h"><span class="tag">Il vostro grado</span></div><div><span class="stars" aria-label="'+stars+' / 3">'+s+'</span></div><p class="it" lang="it"><b>'+L[0]+'</b></p><p class="en" lang="en">'+L[1]+'</p><small lang="en">Questions used: '+S.used+' · wrong accusations: '+(S.att||0)+'</small></div>';
}
function solDone(){return solStep>=SOL.it.length}
function solBlock(){
  var n=SOL.it.length;if(solStep<1)solStep=1;var k=Math.min(solStep,n);
  var h=cardHtml('sol',k<n?'Il momento della verità':'La verità','',SOL.it.slice(0,k),SOL.en.slice(0,k));
  if(k<n)return h+'<button type="button" class="btn tape" data-act="solnext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  var c=castById(CULPRIT);
  h+='<div class="card"><div class="who">'+av(c.face)+'<div><b>'+esc(c.name)+'</b><span lang="it">'+esc(c.role)+'</span></div></div><span class="stamp">Colpevole</span></div>';
  return h+ratingHtml();
}
function epiBlock(){
  var n=EPI.it.length,h='';
  if(epiStep<1)return '<div class="card" style="border-style:dashed"><div class="card-h"><span class="tag">Finale nascosto</span></div><p class="it" lang="it"><b>'+esc(EPI.teaser[0])+'</b></p><p class="en" lang="en">'+esc(EPI.teaser[1])+'</p></div><button type="button" class="btn tape" data-act="epistart">Leggi l\'epilogo<small>Read the epilogue</small></button>';
  var k=Math.min(epiStep,n);
  h+='<h2>Epilogo</h2>'+cardHtml('epi',k<n?'Dopo l\'arresto':'Il segreto',EPI.title,EPI.it.slice(0,k),EPI.en.slice(0,k));
  if(k<n)h+='<button type="button" class="btn tape" data-act="epinext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  else h+='<span class="stamp">Fine</span>';
  return h;
}
function viewAccusa(){
  var h='';
  if(S.solved||S.revealed){
    h+='<span class="stamp">Caso chiuso</span><h2>La soluzione</h2>'+solBlock();
    if(solDone()){
      h+='<div class="card"><div class="card-h"><span class="tag">Le prove</span></div><ol class="steps">'+PROOFS.filter(function(p){return p.ok}).map(function(p){return '<li>'+esc(p.it)+'<span lang="en">'+esc(p.en)+'</span></li>'}).join('')+'</ol></div>';
      h+=cardHtml('red','Le false piste','',RED.it,RED.en);
      h+=epiBlock();
      if(epiStep>=EPI.it.length)h+='<button type="button" class="btn tape" data-act="again">Nuova partita<small>New game</small></button>';
    }
    return h;
  }
  h+='<h2>Accusa</h2><p class="it" lang="it">'+esc(GAME.q[0])+' Scegliete una persona e tre prove.</p><p class="en" lang="en">'+esc(GAME.q[1])+' Choose one person and three proofs.</p>';
  h+='<fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">1. Il colpevole<small lang="en">The culprit</small></legend>';
  CAST.forEach(function(c){h+='<label class="opt"><input type="radio" name="sus" data-act="pick" value="'+c.id+'"'+(selSus===c.id?' checked':'')+'><span><b>'+esc(c.name)+'</b><span class="e">'+esc(c.roleEn)+'</span></span></label>'});
  h+='</fieldset><fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">2. Tre prove<small lang="en">Three proofs</small></legend>';
  PROOFS.forEach(function(p){h+='<label class="opt"><input type="checkbox" data-act="proof" value="'+p.k+'"'+(selProofs[p.k]?' checked':'')+'><span lang="it">'+esc(p.it)+'<span class="e" lang="en">'+esc(p.en)+'</span></span></label>'});
  h+='</fieldset><div id="res" aria-live="polite">'+resMsg+'</div><button type="button" class="btn tape" data-act="accuse">Accuso!<small>I accuse!</small></button>';
  if(S.att>=2)h+=cb('reveal','x','Mostra la soluzione','Show the solution');
  return h;
}
function render(){
  var body=!S.started?viewSetup():({caso:viewCaso,interroga:viewInterroga,taccuino:viewNote,accusa:viewAccusa})[tab]();
  $('#app').innerHTML=header()+'<main class="wrap main">'+body+'</main>'+(S.started?nav():'');
}
function go(t){tab=t;pend='';sus='';last=null;render();window.scrollTo(0,0)}

function glossary(){
  var map={},texts=[].concat(STORY.it,SOL.it,EPI.it);
  REPORTS.forEach(function(r){texts.push(r.it)});
  CAST.forEach(function(c){texts.push(c.desc)});TIMELINE.forEach(function(e){texts.push(e.it)});if(VICTIM.bio)texts.push(VICTIM.bio[0]);
  Object.keys(ANS).forEach(function(id){Object.keys(ANS[id]).forEach(function(k){texts.push(ANS[id][k][0])})});
  texts.forEach(function(t){var re=/\[([^|\]]+)\|([^\]]+)\]/g,m;while((m=re.exec(t))){var key=m[1].toLowerCase();if(!map[key])map[key]=[m[1],m[2]]}});
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,'it')}).map(function(k){return map[k]});
}
function glList(q){
  q=q.toLowerCase();
  var items=gl.filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>-1||p[1].toLowerCase().indexOf(q)>-1});
  if(!items.length)return '<p>Nessun risultato / No results</p>';
  return items.map(function(p){return '<div class="gl-item"><b lang="it">'+esc(p[0])+'</b><span lang="en">'+esc(p[1])+'</span></div>'}).join('');
}
function openGlossary(){
  if(!gl)gl=glossary();
  var el=$('#gl');
  el.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><h2>Parole</h2><button type="button" class="pill" data-act="closeglos">Chiudi</button></div><small>Glossario italiano → inglese / Italian → English glossary</small><input type="search" id="gs" placeholder="Cerca / Search" aria-label="Cerca / Search"><div id="gl-list">'+glList('')+'</div></div>';
  el.hidden=false;document.body.style.overflow='hidden';
}
var ITV=null,ITV_TRIED=false;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    var it=vs.filter(function(v){return /^it([-_]|$)/i.test(v.lang)||/ital/i.test(v.name)});
    if(!it.length)return null;
    function sc(v){var n=v.name||'',x=0;if(/^it[-_]IT/i.test(v.lang))x+=3;if(/premium|enhanced|natural|neural|google|siri/i.test(n))x+=4;if(/alice|federica|elsa|paola|luca|isabella|diego|emma|giorgio/i.test(n))x+=2;if(v.localService===false)x+=1;return x}
    it.sort(function(p,q){return sc(q)-sc(p)});
    return it[0];
  }catch(e){return null}
}
function refreshSay(){ITV=TTS?pickVoice():null;SAY=ITV?SAYB:''}
refreshSay();
if(TTS){try{window.speechSynthesis.onvoiceschanged=function(){var had=!!SAY;refreshSay();if(!!SAY!==had){var ap=document.getElementById('app');if(ap&&ap.innerHTML)render()}};if(window.speechSynthesis.getVoices)window.speechSynthesis.getVoices()}catch(e){}}
function prepSpeech(t){
  return t.replace(/[«»“”"]/g,'').replace(/\s+/g,' ')
   .replace(/\b(\d{1,2}):00\b/g,'$1 in punto')
   .replace(/\b(\d{1,2}):(\d{2})\b/g,'$1 e $2')
   .replace(/\s*[—–]\s*/g,', ').replace(/…/g,'.').trim();
}
function chunks(t){
  var parts=t.match(/[^.!?;:]+[.!?;:]*/g)||[t],out=[],cur='';
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.map(function(x){return x.trim()}).filter(Boolean);
}
function speak(card,btn){
  if(!TTS)return;
  try{
    var ss=window.speechSynthesis;
    if(btn.getAttribute('aria-pressed')==='true'){ss.cancel();btn.setAttribute('aria-pressed','false');return}
    ss.cancel();$$('.ico[aria-pressed="true"]').forEach(function(b){b.setAttribute('aria-pressed','false')});
    var txt=prepSpeech($$('.it',card).map(function(n){return n.textContent}).join(' '));
    var v=ITV||pickVoice();ITV=v;
    var gl=$('.gloss',card);
    if(!v&&gl){gl.innerHTML='Voce italiana non trovata sul telefono. Nelle impostazioni, scarica o scegli una voce italiana (Sintesi vocale).<br><i>Italian voice not found on your phone. In Settings, download or choose an Italian voice (Text-to-speech).</i>';gl.hidden=false}
    var list=chunks(txt),i=0;
    btn.setAttribute('aria-pressed','true');
    (function next(){
      if(i>=list.length||btn.getAttribute('aria-pressed')!=='true'){btn.setAttribute('aria-pressed','false');return}
      var u=new SpeechSynthesisUtterance(list[i++]);
      u.lang=v?v.lang.replace('_','-'):'it-IT';if(v)u.voice=v;u.rate=0.92;u.pitch=1;
      u.onend=next;u.onerror=function(){btn.setAttribute('aria-pressed','false')};
      ss.speak(u);
    })();
  }catch(e){btn.setAttribute('aria-pressed','false')}
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  var keep=(a==='restart'||a==='resetnb'||a==='reveal'||a==='teacher');
  if(!keep&&pend)pend='';
  switch(a){
   case 'n':S.n=+v;save();render();break;
   case 'start':S.started=true;S.turn=0;tab='caso';save();render();window.scrollTo(0,0);break;
   case 'tab':go(v);break;
   case 'en':S.en=!S.en;save();render();break;
   case 'glos':openGlossary();break;
   case 'closeglos':$('#gl').hidden=true;document.body.style.overflow='';break;
   case 'w':var cd=b.closest('.card,details'),g=cd&&$('.gloss',cd);if(g){g.textContent=b.textContent+' = '+b.getAttribute('data-t');g.hidden=false}break;
   case 'ent':var c2=b.closest('.card'),id=c2.getAttribute('data-id'),en=$('.en',c2);var op=en.hidden;en.hidden=!op;openEn[id]=op;b.setAttribute('aria-expanded',op?'true':'false');break;
   case 'enq':var nx=b.nextElementSibling;nx.hidden=!nx.hidden;b.setAttribute('aria-expanded',nx.hidden?'false':'true');break;
   case 'say':speak(b.closest('.card'),b);break;
   case 'sus':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'more':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'back':sus='';last=null;render();window.scrollTo(0,0);break;
   case 'ask':
     var s=b.getAttribute('data-s');
     if(left()<=0)break;
     S.asked[s]=S.asked[s]||{};S.asked[s][v]=true;S.used++;S.turn=(S.turn+1)%S.n;
     last={s:s,k:v,fresh:true};save();render();window.scrollTo(0,0);break;
   case 'reread':last={s:b.getAttribute('data-s'),k:v,fresh:false};render();window.scrollTo(0,0);break;
   case 'hint':if(!S.hint&&left()>=3){S.hint=true;S.used+=2;save();render();window.scrollTo(0,0)}break;
   case 'mark':
     var ss=b.getAttribute('data-s'),kk=b.getAttribute('data-k');S.marks[ss]=S.marks[ss]||{};
     var cur=S.marks[ss][kk]||'',nv=cur===''?'y':cur==='y'?'n':'';S.marks[ss][kk]=nv;save();
     b.className='cell '+nv;b.textContent=nv==='y'?'Sì':nv==='n'?'No':'?';break;
   case 'resetnb':if(pend==='resetnbx'){S.marks={};pend='';save();render()}else{pend='resetnbx';render()}break;
   case 'accuse':doAccuse();break;
   case 'reveal':if(pend==='revealx'){S.revealed=true;solStep=1;pend='';save();render();window.scrollTo(0,0)}else{pend='revealx';render()}break;
   case 'epistart':epiStep=1;render();break;
   case 'epinext':epiStep++;render();var nb2=$('[data-act=epinext]');if(nb2)nb2.scrollIntoView({block:'center'});break;
   case 'solnext':solStep++;render();var nb=$('[data-act=solnext]');if(nb)nb.scrollIntoView({block:'center'});else window.scrollTo(0,0);break;
   case 'restart':if(pend==='restartx'){newGame();pend=''}else{pend='restartx';render()}break;
   case 'again':newGame();break;
   case 'teacher':if(pend==='teacherx'){teacherOpen=!teacherOpen;pend=''}else{pend='teacherx';if(teacherOpen)teacherOpen=false}render();break;
  }
});
function newGame(){
  S.started=false;S.turn=0;S.used=0;S.asked={};S.seen=0;S.marks={};S.att=0;S.solved=false;S.revealed=false;S.hint=false;
  tab='caso';sus='';last=null;selSus='';selProofs={};resMsg='';solStep=1;epiStep=0;openEn={};save();render();window.scrollTo(0,0);
}
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-act');
  if(a==='pick')selSus=t.value;
  if(a==='proof')selProofs[t.value]=t.checked;
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.id==='gs'&&gl)$('#gl-list').innerHTML=glList(t.value);
  if(t.id.indexOf('pn')===0&&/^pn\d+$/.test(t.id)){S.names[+t.id.slice(2)]=t.value;save()}
});
function doAccuse(){
  var picked=Object.keys(selProofs).filter(function(k){return selProofs[k]});
  var box=$('#res');
  if(!selSus||picked.length!==3){resMsg='<div class="msg" role="alert"><span lang="it">Scegliete una persona e tre prove.</span><span class="e" lang="en">Choose one person and three proofs.</span></div>';box.innerHTML=resMsg;return}
  var ok=picked.every(function(k){return PROOFS.filter(function(p){return p.k===k})[0].ok});
  if(selSus===CULPRIT&&ok){S.solved=true;solStep=1;save();render();window.scrollTo(0,0);return}
  S.att=(S.att||0)+1;save();
  resMsg='<div class="msg" role="alert"><span lang="it">Non ancora. Il colpevole o le prove non sono giusti. Guardate il taccuino e i verbali.</span><span class="e" lang="en">Not yet. The culprit or the proofs are not right. Look at the notebook and the records.</span></div>';
  render();var r=$('#res');if(r)r.scrollIntoView({block:'center'});
}
render();

})();
</script>
</body></html>
