<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Delitto a Villa Rufina</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout concept: a police case file on a phone. Sticky header with hazard tape, one column of evidence cards, fixed bottom tab bar. */
:root{
  --bg:#E6E9E7; --surface:#F7F8F6; --fg:#15202B; --muted:#4F5C67; --line:#C5CCC8;
  --tape:#F2C300; --on-tape:#15202B; --stamp:#B3261E; --sea:#0A5A70; --yes:#1B6E45; --no:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
    --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
  --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0}
small{font-size:13px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#15202B 14px 28px)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{font-size:28px;letter-spacing:.05em}
.brand span{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{min-height:40px;min-width:44px;padding:0 12px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}

/* layout */
.main{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;background:var(--tape);color:var(--on-tape);padding:2px 8px;border-radius:2px;text-transform:uppercase}
.it{font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.en{color:var(--sea);font-size:16px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.entog{align-self:flex-start;min-height:36px;padding:0 12px;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:4px;font-size:14px;font-weight:700}
.entog[aria-expanded="true"]{background:var(--sea);color:var(--bg)}
.w{padding:0;border:0;border-bottom:2px dotted var(--sea);background:none;font:inherit;line-height:inherit;color:inherit;cursor:help}
.gloss{background:var(--tape);color:var(--on-tape);font-weight:700;padding:6px 10px;border-radius:3px;font-size:16px;align-self:flex-start}
.ico{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center;flex:none}
.ico[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.ico svg{width:22px;height:22px}

/* buttons */
.btn{min-height:50px;padding:0 20px;border:2px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:4px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn.tape{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-family:var(--body);font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:inherit;opacity:.85}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:15px;align-self:flex-start;min-height:44px}

/* setup */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-height:48px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[disabled]{opacity:.3;cursor:not-allowed}
.q{font-weight:700;font-size:18px}
.q small{display:block;font-weight:400}

/* rounds */
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rd{min-height:56px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.rd[aria-pressed="true"]{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.rd[aria-disabled="true"]{opacity:.45;border-style:dashed}
.rd svg{width:16px;height:16px;flex:none}
.task{border-left:6px solid var(--tape);padding-left:12px}
.ask{background:transparent;border:2px dashed var(--muted)}

/* cast */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:24px;flex:none}
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.who span{font-size:15px;color:var(--muted)}

/* notebook */
.tw{overflow-x:auto}
table.nb{border-collapse:collapse;width:100%;min-width:340px}
.nb th,.nb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.nb thead th{font-family:var(--mono);font-size:12px;text-transform:uppercase;vertical-align:bottom}
.nb thead th small{display:block;text-transform:none;font-family:var(--body)}
.nb tbody th{text-align:left;font-weight:700;font-size:16px;padding-right:8px}
.nb tbody th small{display:block;font-weight:400}
.cell{width:100%;min-width:52px;min-height:48px;border:2px solid var(--line);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted)}
.cell.y{border-color:var(--yes);color:var(--yes);background:color-mix(in srgb,var(--yes) 14%,transparent)}
.cell.n{border-color:var(--no);color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}

/* accuse */
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);min-height:56px}
.opt input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--sea);flex:none}
.opt:has(input:checked){border-color:var(--fg)}
.opt .e{display:block;color:var(--sea);font-size:15px}
.msg{padding:12px 14px;border-radius:4px;background:var(--surface);border:2px solid var(--stamp)}
.msg .e{display:block;color:var(--sea);font-size:15px}
.stamp{display:inline-block;align-self:flex-start;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;padding:2px 14px;transform:rotate(-5deg);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:st .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes st{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
}
ul.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li span{display:block;color:var(--sea);font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--fg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:58px;border:0;background:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-top:5px solid transparent;margin-top:-2px;padding:4px 2px}
.tab small{display:block;font-family:var(--body);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0}
.tab[aria-current="page"]{border-top-color:var(--tape);background:color-mix(in srgb,var(--tape) 16%,transparent)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.ov input[type=search]{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%}
.gl-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{overflow-wrap:anywhere}
.gl-item span{color:var(--sea);text-align:right;overflow-wrap:anywhere}
table.tt{border-collapse:collapse;width:100%;font-size:15px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tt td.c{font-family:var(--mono);text-align:center}

.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--tape)}
.turn{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:4px;display:flex;flex-direction:column}
.turn small{color:inherit;opacity:.85}
.txt{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%;min-width:0}
textarea.txt{min-height:96px;padding:10px 12px;resize:vertical}
details.old{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.old summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer}
details.old .card{border:0;border-top:1px solid var(--line);border-radius:0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img,.fig svg{display:block;width:100%;max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:#fff}
.fig.sm{max-width:260px}
.fig figcaption{font-size:14px;color:var(--muted)}
img.av{object-fit:cover;object-position:top center;background:#cde;border:2px solid var(--line)}
span.av{background:none}
.qa{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}.qa summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--stamp);margin-left:4px;vertical-align:middle}
.sus{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:68px;padding:8px 12px;border:2px solid var(--fg);background:var(--surface);border-radius:6px}
.sus .sn{flex:1;min-width:0;display:flex;flex-direction:column}
.sus .sn b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.sus .sn span,.sus .sn small{font-size:14px;color:var(--muted)}
.cnt2{font-family:var(--mono);font-weight:700}
.qbtn{text-align:left;min-height:60px;padding:10px 14px;border:2px solid var(--fg);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;gap:2px;width:100%}
.qbtn span{font-weight:700;font-size:17px}.qbtn small{color:var(--muted);font-size:14px}
.qbtn.done{border-style:dashed;color:var(--muted)}.qbtn[disabled]{opacity:.4;cursor:not-allowed}
.bubble{border-left:6px solid var(--tape)}
.who .ico{margin-left:auto}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}
.pill.cnt{background:var(--tape);color:#15202B;border-color:#15202B;font-size:20px;line-height:1}

.clock{border:2px solid var(--fg);background:var(--surface);border-radius:6px;padding:10px 12px}
.clock-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.clock-t b{font-family:var(--display);font-size:30px;line-height:1}
.clock-t span{font-size:15px}.clock-t small{width:100%;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape)}
.clock.hot{border-color:#b3261e}.clock.hot .bar i{background:#b3261e}.clock.hot b{color:#b3261e}
.help{border:2px dashed var(--fg)}
.hl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.hl li{display:flex;gap:12px;align-items:flex-start}
.hl li>span:last-child{flex:1;display:block}.hl small{display:block;color:var(--muted)}
.demo{display:inline-block;width:78px;text-align:center;font-weight:700;border:2px solid var(--fg);border-radius:6px;padding:4px 6px;background:var(--surface);flex:none;font-size:14px}
.demo.w{border:0;border-bottom:2px dotted var(--fg);border-radius:0;background:none}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--tape);padding-left:10px}
.tl li b{font-family:var(--display);font-size:20px;min-width:54px}
.tl li>span{flex:1;display:block}.tl small{display:block;color:var(--muted);font-size:13px}
.tl li.unk{border-left-color:var(--line);color:var(--muted)}
.entog{font-weight:700;padding:10px 16px;min-height:44px}
img.av,span.av{width:104px;height:104px;border-radius:10px;object-fit:cover;object-position:50% 20%;border:2px solid var(--fg);flex:none}
span.av svg{width:100%;height:100%}
.sus img.av,.sus span.av{width:84px;height:84px}
.bubble .who img.av,.bubble .who span.av{width:76px;height:76px}
.sus{min-height:96px}
.fig.sm{max-width:none;width:100%}
.fig img,.fig svg{width:100%;height:auto;min-height:220px;object-fit:cover}
</style>

<div id="app"></div>
<div id="gl" class="ov" hidden></div>
<script>
(function(){
'use strict';

function S(w,h,body,label){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>'}

 var s=f.skin,h=f.hair,st=f.style||'short',sh=f.shirt||'#556',bg=f.bg||'#dfe6ea';

 if(st==='long')o+='<path d="M13 34C12 14 22 8 32 8s20 6 19 26v20H13z" fill="'+h+'"/>';
 o+='<path d="M7 64c0-13 10-19 25-19s25 6 25 19z" fill="'+sh+'"/><rect x="27" y="38" width="10" height="10" rx="3" fill="'+s+'"/><ellipse cx="32" cy="29" rx="12" ry="14" fill="'+s+'"/>';
 if(st==='short')o+='<path d="M19.5 28C18 14 25 9 32 9s14 5 12.5 19c-2-6-6-9-12.5-9s-10.5 3-12.5 9z" fill="'+h+'"/>';
 if(st==='long')o+='<path d="M20 28c0-9 5-13 12-13s12 4 12 13c-3-4-7-6-12-6s-9 2-12 6z" fill="'+h+'"/>';
 if(st==='bun')o+='<circle cx="32" cy="8" r="6" fill="'+h+'"/><path d="M19.5 28C18 14 25 10 32 10s14 4 12.5 18c-2-6-6-9-12.5-9s-10.5 3-12.5 9z" fill="'+h+'"/>';
 if(st==='cap'){var cc=f.cap||'#2f5fa8';o+='<path d="M18 23c0-10 6-15 14-15s14 5 14 15z" fill="'+cc+'"/><rect x="15" y="22" width="34" height="4" rx="2" fill="'+cc+'"/>'}
 o+='<circle cx="27" cy="29" r="1.7" fill="#1d1d1d"/><circle cx="37" cy="29" r="1.7" fill="#1d1d1d"/>';
 if(f.beard)o+='<path d="M20 32c0 10 5 15 12 15s12-5 12-15c-3 4-7 5-12 5s-9-1-12-5z" fill="'+h+'"/>';
 if(f.stache||f.beard)o+='<path d="M26 34q6-3 12 0q-6 2-12 0z" fill="'+h+'"/>';
 o+='<path d="M28 39q4 2.5 8 0" stroke="#7a3b3b" stroke-width="1.6" fill="none" stroke-linecap="round"/>';

var ANS={
 filippo:{
  alibi:[`Dalle 14:00 alle 15:40 sono rimasto in [salotto|living room] con Ascanio: abbiamo parlato di investimenti per più di un'ora e mezza e non ci siamo mai separati, nemmeno per andare in bagno. Possiamo confermarlo a vicenda.`,`From 2:00 to 3:40 I stayed in the living room with Ascanio: we talked about investments for more than an hour and a half and we never separated, not even to go to the bathroom. We can vouch for each other.`],
  vendita:[`Non lo nego: i soldi mi servono. Ho uno stile di vita costoso e avevo già chiesto più volte a mia madre un [anticipo|advance] sull'[eredità|inheritance], ma lei mi aveva sempre risposto di no. Però, se la volevo morta per i soldi, perché aspettare proprio il giorno in cui avrebbe annunciato il nome dell'azienda?`,`I do not deny it: I need money. I have an expensive lifestyle and I had already asked my mother several times for an advance on my inheritance, but she had always said no. But if I wanted her dead for the money, why wait for the very day she was going to announce the name of the company?`],
  key:[`Certo che so dov'è la pianta di [cicuta|hemlock]: dopo la festa di Guglielmo l'abbiamo spostata tutti insieme in un angolo lontano dalle erbe aromatiche, per evitare altri errori. In famiglia lo sa chiunque.`,`Of course I know where the hemlock plant is: after Guglielmo's party we all moved it together to a corner away from the aromatic herbs, to avoid more mistakes. Anyone in the family knows.`],
  know:[`A pranzo mia madre sembrava agitata, ma contenta. Ha detto che alle 17:00, in giardino, ci avrebbe rivelato il nome dell'azienda. Più tardi, mentre parlavo con Ascanio, ho sentito il telefono della cucina squillare più volte, ma non ci ho fatto caso.`,`At lunch my mother seemed agitated, but happy. She said that at 5:00 p.m., in the garden, she would reveal the name of the company. Later, while I was talking with Ascanio, I heard the kitchen phone ring several times, but I did not pay attention.`]},
 giada:{
  alibi:[`Dalle 14:30 sono stata in [diretta|live] su Instagram dalla tenuta, per presentare il mio progetto del centro per animali. Mi hanno seguita centinaia di persone: potete rivedere la registrazione e leggere i commenti, che hanno tutti l'orario.`,`From 2:30 I was live on Instagram from the estate, to present my project for the animal centre. Hundreds of people followed me: you can watch the recording and read the comments, which all have the time.`],
  vendita:[`Da sempre sogno di trasformare Villa Rufina in un centro per animali [abbandonati|abandoned], e con la vendita quel sogno non si realizzerebbe mai. Questo mi fa soffrire, è vero. Ma non farei mai del male a mia madre: sarebbe come distruggere una parte di me.`,`I have always dreamed of turning Villa Rufina into a centre for abandoned animals, and with the sale that dream would never come true. That makes me suffer, it is true. But I would never harm my mother: it would be like destroying a part of myself.`],
  key:[`Sì, so dov'è la pianta: me l'ha mostrata mia madre dopo la festa, perché io, che amo gli animali, non voglio che un cane o un gatto la mangi per sbaglio. È in fondo alla serra, in un angolo nascosto.`,`Yes, I know where the plant is: my mother showed it to me after the party, because I, who love animals, do not want a dog or a cat to eat it by mistake. It is at the back of the greenhouse, in a hidden corner.`],
  know:[`Mentre ero in diretta, verso le 15:15, ho visto in lontananza, vicino ai vigneti, una figura che camminava velocemente verso la villa. Era troppo lontana perché potessi riconoscerla: so soltanto che non era mia madre.`,`While I was live, around 3:15, I saw in the distance, near the vineyards, a figure walking quickly towards the villa. It was too far away for me to recognise: I only know it was not my mother.`]},
 ascanio:{
  alibi:[`Ero in salotto con Filippo dalle 14:00 fino alle 15:40, a parlare di investimenti. Come sapete, la mia situazione finanziaria è delicata, quindi ho ascoltato con grande attenzione ogni suo consiglio. Non mi sono mai alzato dalla poltrona.`,`I was in the living room with Filippo from 2:00 until 3:40, talking about investments. As you know, my financial situation is delicate, so I listened very carefully to every piece of his advice. I never got up from the armchair.`],
  vendita:[`Ho fatto [investimenti|investments] sbagliati e rischio la [bancarotta|bankruptcy]: se non trovo denaro entro l'estate, perderò tutto. La vendita mi avrebbe aiutato, perché speravo in un prestito da mia zia. Ma ora che lei è morta, il prestito è sparito: la sua morte non mi serve a niente.`,`I made bad investments and I risk bankruptcy: if I do not find money by the summer, I will lose everything. The sale would have helped me, because I was hoping for a loan from my aunt. But now that she is dead, the loan has vanished: her death is of no use to me.`],
  key:[`La pianta? Sì, so dov'è: lo sanno tutti in famiglia, dopo l'incidente della festa di Guglielmo. Ma in serra non ci vado mai, perché preferisco di gran lunga il salotto e il divano.`,`The plant? Yes, I know where it is: everyone in the family knows, after the accident at Guglielmo's party. But I never go to the greenhouse, because I far prefer the living room and the sofa.`],
  know:[`Verso le 15:00 ho sentito squillare il telefono della cucina e ho sentito Vittorio correre giù per le scale della cantina. Ho pensato: «Che confusione!» Poi Filippo ha ricominciato a parlarmi di azioni e non ci ho più pensato.`,`Around 3:00 I heard the kitchen phone ring and I heard Vittorio running down the cellar stairs. I thought: "What a mess!" Then Filippo started talking to me about shares again and I did not think about it any more.`]},
 ludovica:{
  alibi:[`Ho scattato un [selfie|selfie] ogni dieci minuti dalle 14:00 alle 15:40, in stanze diverse della villa: sono tutti datati con l'ora esatta. Se guardate le foto, vedrete che non sono mai entrata né in cucina né in serra.`,`I took a selfie every ten minutes from 2:00 to 3:40, in different rooms of the villa: they are all dated with the exact time. If you look at the photos, you will see that I never went into the kitchen or the greenhouse.`],
  vendita:[`Faccio la [scenografa|set designer], ma il mio sogno è dirigere un film tutto mio, e costa moltissimo: non ho ancora trovato un [produttore|producer]. La vendita non mi riguarda direttamente. Però capisco chi voleva restare: questa villa sembra un set cinematografico.`,`I work as a set designer, but my dream is to direct a film of my own, and it costs a great deal: I have not yet found a producer. The sale does not concern me directly. But I understand those who wanted to stay: this villa looks like a film set.`],
  key:[`Dov'è la pianta di cicuta? Lo so, perché dopo la festa di Guglielmo la Contessa ce l'ha mostrata e ci ha chiesto di non toccarla. Io lavoro con piante finte, e una pianta vera così pericolosa mi fa paura.`,`Where is the hemlock plant? I know, because after Guglielmo's party the Countess showed it to us and asked us not to touch it. I work with fake plants, and a real plant that dangerous scares me.`],
  know:[`Mentre scattavo i selfie ho notato che Aurora non era in nessuna stanza della villa, quando sono passata. L'ho vista rientrare dai vigneti verso le 15:30, un po' agitata. Pensavo avesse solo camminato troppo.`,`While I was taking selfies I noticed that Aurora was not in any room of the villa when I passed through. I saw her come back from the vineyards around 3:30, a little agitated. I thought she had simply walked too far.`]},
 maria:{
  alibi:[`Dalle 14:00 alle 15:40 mi hanno vista in molti mentre giravo per la villa: ho preparato le camere, sparecchiato e infine servito la tisana. Alle 15:10 ho portato le due tazze in serra e alle 15:40 sono tornata a ritirarle.`,`From 2:00 to 3:40 many people saw me as I moved around the villa: I prepared the bedrooms, cleared the tables and finally served the herbal tea. At 3:10 I took the two cups to the greenhouse and at 3:40 I went back to collect them.`],
  vendita:[`Lavoro qui da venticinque anni e, se la tenuta passasse a una società straniera, rischierei il posto. Ma la Contessa non era soltanto la mia padrona: per me era come una sorella maggiore. Non le farei mai del male.`,`I have worked here for twenty-five years and, if the estate passed to a foreign company, I would risk my job. But the Countess was not only my employer: to me she was like an older sister. I would never harm her.`],
  key:[`Dove sia la pianta di cicuta non lo so: quell'angolo della serra non lo frequento e la famiglia non me l'ha mai detto. Io pulisco soltanto le parti dove crescono le orchidee.`,`I do not know where the hemlock plant is: I do not go to that corner of the greenhouse and the family never told me. I only clean the parts where the orchids grow.`],
  know:[`Quando sono entrata in serra, alle 15:10, ho appoggiato le due tazze sul tavolino e sono tornata in cucina. Alle 15:40, invece, ho trovato la Contessa a terra e la porta sul retro era aperta. Non c'era nessuno, ma l'aria era fredda, come se fosse uscito qualcuno poco prima.`,`When I went into the greenhouse at 3:10, I put the two cups on the small table and went back to the kitchen. At 3:40, on the other hand, I found the Countess on the floor and the back door was open. There was nobody, but the air was cold, as if someone had left shortly before.`]},
 vittorio:{
  alibi:[`Dalle 14:30 sono stato sempre in cucina, tranne quando sono sceso in cantina. Maria ha servito la tisana che avevo preparato io. Inoltre sono allergico alle piante fresche, e infatti oggi non ho nessuna [irritazione|irritation] sulle mani e sulle braccia: non ho toccato niente di strano.`,`From 2:30 I was always in the kitchen, except when I went down to the cellar. Maria served the herbal tea that I had prepared. Besides, I am allergic to fresh plants, and in fact today I have no irritation on my hands or arms: I touched nothing strange.`],
  vendita:[`Se la tenuta venisse venduta, il nuovo proprietario porterebbe i suoi cuochi e io perderei il posto: ho appena cominciato e ho tante idee. Perciò la Contessa viva mi serviva molto più che morta.`,`If the estate were sold, the new owner would bring his own cooks and I would lose my job: I have just started and I have many ideas. So the Countess alive was worth much more to me than dead.`],
  key:[`La pianta di cicuta? Non so dove sia. Non vado mai in quell'angolo della serra e, con la mia [allergia|allergy], tocco le piante fresche il meno possibile.`,`The hemlock plant? I do not know where it is. I never go to that corner of the greenhouse and, with my allergy, I touch fresh plants as little as possible.`],
  know:[`Ecco che cosa è successo. Alle 14:30 la Contessa mi ha telefonato in cucina: voleva due tazze della solita tisana in serra, alle 15:00 precise. Alle 14:45 mi ha chiamato Aurora: «In cantina si stanno rompendo delle bottiglie!» Sono corso giù. Quando sono risalito, la Contessa mi ha richiamato, arrabbiata: la tisana non era ancora in serra. Allora ho preso quella del solito barattolo e ho chiesto a Maria di servirla.`,`Here is what happened. At 2:30 the Countess phoned me in the kitchen: she wanted two cups of the usual herbal tea in the greenhouse, at 3:00 sharp. At 2:45 Aurora called me: "Some bottles are breaking in the cellar!" I ran down. When I came back up, the Countess called me again, angry: the tea was not yet in the greenhouse. So I took the one from the usual jar and asked Maria to serve it.`]},
 guglielmo:{
  alibi:[`Dalle 14:30 alle 16:00 ho giocato a [tennis|tennis] con il mio vecchio amico Claudio, sul campo vicino alla villa. Ho un SMS in cui Claudio conferma l'appuntamento, e lui stesso può testimoniare che non ci siamo mai separati.`,`From 2:30 to 4:00 I played tennis with my old friend Claudio, on the court near the villa. I have a text in which Claudio confirms the appointment, and he himself can testify that we never separated.`],
  vendita:[`Un tempo ero un [playboy|playboy], oggi non lavoro e vivo grazie a Carlotta. È vero: con la vendita il mio tenore di vita poteva cambiare, in meglio o in peggio. Ma io amavo Carlotta e senza di lei non ho più niente.`,`I used to be a playboy, today I do not work and I live thanks to Carlotta. It is true: with the sale my standard of living could change, for better or worse. But I loved Carlotta and without her I have nothing left.`],
  key:[`La pianta di cicuta? Purtroppo la conosco bene: quattro mesi fa, alla mia festa di compleanno, alcuni invitati sono finiti al pronto soccorso per colpa di quell'erba. Qualcuno l'aveva scambiata per [prezzemolo|parsley]. Dopo, l'abbiamo spostata in fondo alla serra.`,`The hemlock plant? Unfortunately I know it well: four months ago, at my birthday party, some guests ended up in the emergency room because of that herb. Someone had mistaken it for parsley. Afterwards, we moved it to the back of the greenhouse.`],
  know:[`Quella festa è stata un incidente, o almeno così credevamo. Ora, però, mi chiedo se non sia stata una prova generale. Anche il giornale ha scritto che gli ospiti avevano rischiato la fine di [Socrate|Socrates]. Troppe coincidenze, non vi pare?`,`That party was an accident, or at least so we thought. Now, though, I wonder whether it was a rehearsal. The newspaper also wrote that the guests had risked the fate of Socrates. Too many coincidences, don't you think?`]},
 aurora:{
  alibi:[`Dopo pranzo avevo un forte mal di testa, così sono uscita a fare una passeggiata da sola tra i [vigneti|vineyards]. Non ho incontrato nessuno e quindi non posso dimostrarlo: so che sembra strano, ma è la verità.`,`After lunch I had a bad headache, so I went out for a walk alone among the vineyards. I did not meet anyone and so I cannot prove it: I know it seems strange, but it is the truth.`],
  vendita:[`Sono laureata in economia con il massimo dei voti, e vi dico che vendere l'azienda adesso sarebbe un grave errore: tra pochi anni le [cantine|wine cellars] varranno molto di più. A tavola l'ho detto chiaramente a mia zia, ma lei sembrava decisa.`,`I have a degree in economics with top marks, and I tell you that selling the company now would be a serious mistake: in a few years the wine cellars will be worth much more. At the table I told my aunt so clearly, but she seemed determined.`],
  key:[`La pianta? Certo che so dov'è: dopo la festa di Guglielmo l'hanno spostata e tutti noi parenti l'abbiamo saputo. Ma questo non significa niente: lo sanno anche gli altri.`,`The plant? Of course I know where it is: after Guglielmo's party they moved it and all of us relatives found out. But that does not mean anything: the others know too.`],
  know:[`Non ho visto niente di particolare. Ricordo soltanto che a pranzo la zia ha annunciato che alle 17:00 ci avrebbe detto il nome dell'azienda. Per me era un errore, e sono rimasta molto turbata per tutto il pomeriggio.`,`I did not see anything in particular. I only remember that at lunch my aunt announced that at 5:00 she would tell us the name of the company. For me it was a mistake, and I was very upset for the whole afternoon.`]},
 sofia:{
  alibi:[`Dalle 14:00 alle 16:00 sono stata nella mia camera con il [fisioterapista|physiotherapist]: da quando mi sono rotta un piede mi sposto in [sedia a rotelle|wheelchair] e faccio gli esercizi ogni pomeriggio. Lui può confermarlo.`,`From 2:00 to 4:00 I was in my room with the physiotherapist: since I broke my foot I move around in a wheelchair and I do my exercises every afternoon. He can confirm it.`],
  vendita:[`Sono [contraria|against] alla vendita e non l'ho mai nascosto. Alle 11:30 ho scritto ad Aurora: «Sono preoccupata per la decisione di Carlotta. Dobbiamo farle cambiare idea!» Ma volevo farle cambiare idea con le parole, non con il veleno.`,`I am against the sale and I never hid it. At 11:30 I wrote to Aurora: "I am worried about Carlotta's decision. We must make her change her mind!" But I wanted to change her mind with words, not with poison.`],
  key:[`La pianta di cicuta è in fondo alla serra, dietro le orchidee. Con la sedia a rotelle non potrei mai arrivarci, perché il passaggio è stretto: lo sapevamo tutti dopo la festa di Guglielmo.`,`The hemlock plant is at the back of the greenhouse, behind the orchids. With the wheelchair I could never get there, because the passage is narrow: we all knew after Guglielmo's party.`],
  know:[`Sì, c'è una cosa. Ho scritto ad Aurora perché era l'unica che potesse convincere Carlotta, con i suoi argomenti da economista. Lei mi ha risposto soltanto: «Ci penso io.» Allora non ho capito che cosa intendesse.`,`Yes, there is one thing. I wrote to Aurora because she was the only one who could convince Carlotta, with her economist's arguments. She only answered: "I will take care of it." At the time I did not understand what she meant.`]}
};

 {t:'14:30',a:'guglielmo.alibi',it:`Guglielmo comincia a giocare a tennis con Claudio. Giada comincia la diretta Instagram.`,en:`Guglielmo starts playing tennis with Claudio. Giada starts her Instagram live.`},
 {t:'14:30',a:'vittorio.know',it:`La Contessa telefona al cuoco: vuole due tazze della solita tisana in serra, alle 15:00.`,en:`The Countess phones the cook: she wants two cups of the usual herbal tea in the greenhouse, at 3:00.`},

 {t:'15:00',a:'ascanio.know',it:`Il telefono della cucina squilla. Ascanio sente Vittorio correre verso la cantina.`,en:`The kitchen phone rings. Ascanio hears Vittorio running towards the cellar.`},
 {t:'15:10',a:'maria.alibi',it:`Maria porta le due tazze di tisana in serra.`,en:`Maria takes the two cups of herbal tea to the greenhouse.`},
 {t:'15:15',a:'giada.know',it:`Giada vede una figura che cammina in fretta, dai vigneti verso la villa.`,en:`Giada sees a figure walking quickly, from the vineyards towards the villa.`},

 {t:'15:40',at:0,it:`Maria trova la Contessa a terra, nella serra. La porta sul retro è aperta.`,en:`Maria finds the Countess on the floor, in the greenhouse. The back door is open.`}

var STORY={
 it:[
  `Sabato, ore 13:30. [Villa Rufina|Villa Rufina] è una [tenuta|estate] elegante nel Chianti, in Toscana: colline dolci, vigneti a perdita d'occhio e cantine centenarie. La famiglia Ricci produce vino da quattro generazioni, e da molti anni l'azienda è guidata dalla Contessa Carlotta Ricci.`,
  `Da qualche settimana i giornali non parlano d'altro: la Contessa [intende|intends] vendere le cantine a un'azienda straniera, per quindici milioni di euro. Per questo ha convocato tutta la famiglia a pranzo. Alla fine del pranzo si alza e dice: «Alle 17:00, in giardino, vi dirò il nome dell'azienda.» Poi esce, con un sorriso strano. Nessuno la vedrà più viva.`,
  `Alle 15:40 la cameriera, Maria, trova la Contessa a terra nella [serra|greenhouse]. Muore pochi minuti dopo. Il vicequestore Volponi arriva in fretta, fa chiudere i cancelli e dichiara: «Nessuno lascerà la villa. L'assassino è ancora qui, tra voi.»`,
  `Sono le 15:50. Alle 18:00 arriveranno il magistrato e gli avvocati: dopo quell'ora, nessuno parlerà più. Nove persone, un solo colpevole. Voi siete gli assistenti del vicequestore: [interrogate|question] i sospettati, leggete i rapporti, confrontate le loro versioni con i fatti e scoprite chi mente. Ogni domanda costa nove minuti: ne avete soltanto 14.`
 ],
 en:[
  `Saturday, 1:30 p.m. Villa Rufina is an elegant estate in the Chianti hills, in Tuscany: gentle hills, vineyards as far as the eye can see and centuries-old cellars. The Ricci family has made wine for four generations, and for many years the company has been run by Countess Carlotta Ricci.`,
  `For a few weeks the newspapers have talked about nothing else: the Countess intends to sell the wine cellars to a foreign company, for fifteen million euros. That is why she called the whole family to lunch. At the end of lunch she stands up and says: "At 5:00 p.m., in the garden, I will tell you the name of the company." Then she goes out, with a strange smile. Nobody will see her alive again.`,
  `At 3:40 p.m. the maid, Maria, finds the Countess on the floor in the greenhouse. She dies a few minutes later. Deputy Chief Volponi arrives quickly, has the gates closed and declares: "Nobody will leave the villa. The murderer is still here, among you."`,
  `It is 3:50 p.m. At 6:00 the magistrate and the lawyers will arrive: after that hour, nobody will talk any more. Nine people, one culprit. You are the deputy chief's assistants: question the suspects, read the reports, compare their versions with the facts and find out who is lying. Every question costs nine minutes: you only have 14.`
 ]
};
var REPORTS=[
 {at:0,t:'Il ritrovamento',it:`Alle 15:40 Maria trova la Contessa a terra, nella [serra|greenhouse]. Respira a fatica, ha le mani fredde e [fatica a parlare|has trouble speaking]. Muore poco dopo, prima dell'arrivo dell'ambulanza. La sua mano destra è chiusa a [pugno|fist], con le dita rigide. Il medico commenta: «È una posizione strana, quasi voluta. Come se volesse indicare qualcosa.»`,en:`At 3:40 Maria finds the Countess on the floor, in the greenhouse. She is breathing with difficulty, her hands are cold and she has trouble speaking. She dies shortly after, before the ambulance arrives. Her right hand is closed in a fist, with stiff fingers. The doctor comments: "It is a strange position, almost deliberate. As if she wanted to point to something."`,img:'pugno'},
 {at:0,t:'Il laboratorio',it:`Sul tavolino della serra c'è una tazza di [tisana|herbal tea] ancora piena. Sul pavimento ce n'è un'altra, identica, [rovesciata|knocked over]: la Contessa ha bevuto da questa. Le impronte sono soltanto quelle di Maria e della Contessa. Il laboratorio analizza la tisana versata: contiene [cicuta|hemlock] in dose mortale. Anche il barattolo della tisana in dispensa contiene qualche foglia di cicuta mescolata alle erbe.`,en:`On the small table in the greenhouse there is a cup of herbal tea that is still full. On the floor there is another, identical one, knocked over: the Countess drank from this one. The fingerprints are only those of Maria and the Countess. The laboratory analyses the spilled tea: it contains hemlock in a deadly dose. The tea jar in the pantry also contains a few hemlock leaves mixed with the herbs.`,img:'tazze'},
 {at:3,t:'Il pranzo',it:`Dopo il pranzo di famiglia la Contessa si è alzata e ha annunciato: «Oggi alle 17:00, in giardino, vi dirò il nome dell'azienda che compra le cantine.» Finora nessuno conosce quel nome. La Contessa vuole usare il ricavato per creare una [fondazione|foundation] dedicata alle persone [non udenti|deaf]: è un progetto personale, che porta avanti da anni.`,en:`After the family lunch the Countess stood up and announced: "Today at 5:00, in the garden, I will tell you the name of the company that is buying the wine cellars." So far nobody knows that name. The Countess wants to use the proceeds to set up a foundation for deaf people: it is a personal project that she has been pursuing for years.`,img:'villa'},
 {at:4,twist:true,t:'Filippo fermato',it:`La polizia scopre che Filippo ha chiesto a sua madre un anticipo di duecentomila euro tre giorni fa e che non ha ancora pagato la sua macchina sportiva. Filippo viene fermato. «Ero in salotto con Ascanio, tutto il tempo!» Ma i due si garantiscono a vicenda, e il vicequestore sospetta che si coprano. Per molti, il colpevole è lui.`,en:`The police discover that Filippo asked his mother for an advance of two hundred thousand euros three days ago and that he has not yet paid for his sports car. Filippo is stopped. "I was in the living room with Ascanio, the whole time!" But the two vouch for each other, and the deputy chief suspects they are covering for each other. For many, he is the culprit.`},
 {at:6,t:'Il codice dei segni',it:`Nello studio della Contessa c'è un poster con l'[alfabeto dei segni|sign language alphabet] usato dalle persone sorde: il pugno chiuso rappresenta la lettera A. Sulla scrivania c'è un [biglietto|note] scritto con il codice dei segni. Dice: «SERRA ORE 15». Solo la Contessa lo capisce: sembra scritto da qualcuno che voleva essere certo che nessun altro lo leggesse.`,en:`In the Countess's study there is a poster with the sign language alphabet used by deaf people: the closed fist represents the letter A. On the desk there is a note written in the sign code. It says: "GREENHOUSE 3 PM". Only the Countess understands it: it looks as if it was written by someone who wanted to be sure that nobody else could read it.`,img:'segni'},
 {at:8,twist:true,t:'La telecamera del salotto',it:`Colpo di scena! La telecamera di sicurezza del salotto mostra Filippo e Ascanio seduti sulle poltrone dalle 14:00 alle 15:40: non si sono mai alzati. Filippo viene rilasciato. Volponi riflette: «Allora Ascanio non può essere la A del pugno. Chi altro, in questa casa, ha un nome con la A e nessuno che possa dire dove fosse?»`,en:`Plot twist! The living room security camera shows Filippo and Ascanio sitting in the armchairs from 2:00 to 3:40: they never got up. Filippo is released. Volponi reflects: "Then Ascanio cannot be the A of the fist. Who else in this house has a name with an A and nobody who can say where they were?"`},
 {at:9,t:'La pianta e la festa',it:`In un angolo nascosto della serra Volponi trova una pianta di cicuta: alcune foglie sono state [strappate|torn off] di recente. Quattro mesi fa, durante la festa di Guglielmo, alcuni invitati erano finiti al pronto soccorso: nel cibo c'erano tracce di cicuta, ma in dose non mortale. Dopo, la famiglia ha spostato la pianta in un angolo lontano dalle erbe aromatiche. Tutti i familiari sanno dove si trova; Maria e Vittorio, invece, non vanno mai in quell'angolo.`,en:`In a hidden corner of the greenhouse Volponi finds a hemlock plant: some leaves have been torn off recently. Four months ago, during Guglielmo's party, some guests had ended up in the emergency room: there were traces of hemlock in the food, but in a non-deadly dose. Afterwards, the family moved the plant to a corner away from the aromatic herbs. All the family members know where it is; Maria and Vittorio, however, never go to that corner.`},
 {at:12,t:'Il computer di Aurora',it:`Sul computer di Aurora la polizia trova la cronologia degli acquisti: tre libri comprati online. «Gestione aziendale», «Vita di Socrate» e «Marketing vincente». Il secondo è stato ordinato due settimane fa. Nessuno ha visto Aurora per tutto il pomeriggio.`,en:`On Aurora's computer the police find the purchase history: three books bought online. "Business Management", "Life of Socrates" and "Winning Marketing". The second was ordered two weeks ago. Nobody saw Aurora for the whole afternoon.`}
];
var HINT={it:`Aiuto di Volponi: la Contessa, morendo, ha lasciato un messaggio con la mano. Che lettera è? Poi controllate chi ha un alibi e chi ha fatto una telefonata a un orario preciso: il veleno era nel barattolo della cucina.`,en:`Help from Volponi: the Countess, dying, left a message with her hand. Which letter is it? Then check who has an alibi and who made a phone call at a precise time: the poison was in the jar in the kitchen.`};
