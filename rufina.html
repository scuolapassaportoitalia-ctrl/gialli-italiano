var SOL={
 it:[
  `Il vicequestore Volponi riunisce tutti nel salone e dice: «La Contessa ci ha lasciato un messaggio: un pugno chiuso. Nell'alfabeto dei segni significa la lettera A. Due persone hanno un nome che comincia con A: Ascanio e Aurora.»`,
  `Ascanio ha un grosso motivo: rischia la bancarotta. Ma dalle 14:00 alle 15:40 era in salotto con Filippo, e i due si garantiscono a vicenda. Gli altri hanno alibi solidi: Giada era in diretta su Instagram, Ludovica ha i selfie con l'orario, Guglielmo giocava a tennis con Claudio, Sofia era con il fisioterapista, Maria è stata vista da molti, e Vittorio, allergico alle piante, non ha irritazioni sulla pelle.`,
  `Resta Aurora, che è l'unica senza alibi. È convinta che vendere sia un errore economico, conosce bene la pianta di cicuta e, due settimane prima, ha comprato un libro su Socrate: stava preparando qualcosa.`,
  `Alle 14:45 telefona a Vittorio: «In cantina si rompono delle bottiglie!» Il cuoco lascia la cucina e Aurora ne approfitta: entra e mette la cicuta nel barattolo della tisana. Non sa chi berrà quella tisana, ma sa che la Contessa ne vuole sempre due tazze.`,
  `Poi scrive un biglietto con il codice dei segni: «SERRA ORE 15». Solo la Contessa lo capisce, quindi nessun altro lo ha letto. Maria serve la tisana e, quando i sintomi iniziano, Aurora scappa dalla porta sul retro.`,
  `In punto di morte la Contessa capisce chi è stato e chiude la mano a pugno: la lettera A. Aurora abbassa lo sguardo e non dice più niente.`
 ],
 en:[
  `Deputy Chief Volponi gathers everyone in the great hall and says: "The Countess left us a message: a closed fist. In the sign alphabet it means the letter A. Two people have a name that starts with A: Ascanio and Aurora."`,
  `Ascanio has a big motive: he risks bankruptcy. But from 2:00 to 3:40 he was in the living room with Filippo, and the two vouch for each other. The others have solid alibis: Giada was live on Instagram, Ludovica has the time-stamped selfies, Guglielmo was playing tennis with Claudio, Sofia was with the physiotherapist, Maria was seen by many people, and Vittorio, who is allergic to plants, has no skin irritation.`,
  `That leaves Aurora, who is the only one without an alibi. She is convinced that selling is an economic mistake, she knows the hemlock plant well and, two weeks earlier, she bought a book on Socrates: she was preparing something.`,
  `At 2:45 she phones Vittorio: "Some bottles are breaking in the cellar!" The cook leaves the kitchen and Aurora takes advantage of it: she goes in and puts the hemlock in the tea jar. She does not know who will drink that tea, but she knows the Countess always wants two cups.`,
  `Then she writes a note in the sign code: "GREENHOUSE 3 PM". Only the Countess understands it, so nobody else read it. Maria serves the tea and, when the symptoms begin, Aurora runs away through the back door.`,
  `Dying, the Countess understands who it was and closes her hand into a fist: the letter A. Aurora lowers her eyes and says nothing more.`
 ]
};
var CULPRIT='aurora';
var TEACHER=`Aurora Belgrano. La Contessa muore avvelenata con cicuta nel barattolo della tisana. Il pugno chiuso = lettera A (alfabeto dei segni). Nomi con A: Ascanio (alibi in salotto con Filippo) e Aurora (nessun alibi, passeggiata nei vigneti). Aurora telefona a Vittorio alle 14:45 («bottiglie rotte in cantina») per allontanarlo dalla cucina, conosce la pianta, ha ordinato «Vita di Socrate» due settimane prima. Alibi degli altri: Giada (diretta Instagram), Ludovica (selfie datati), Guglielmo (tennis con Claudio), Sofia (fisioterapista), Maria (vista da molti), Vittorio (allergia alle piante, nessuna irritazione).`;
var EPI={title:'Il nome dell\'azienda',teaser:['Il caso è chiuso. Ma alle 17:00, in giardino, qualcuno deve ancora scoprire il nome dell\'azienda.','The case is closed. But at 5:00 p.m., in the garden, someone has yet to discover the name of the company.'],
 it:[
  `Alle 17:00, nel giardino, Volponi apre la cartella trovata sulla scrivania della Contessa e legge ad alta voce il nome che nessuno conosceva: «Fondazione Silenzio». Non era un'azienda straniera che comprava tutto: era una fondazione per le persone non udenti, creata dalla Contessa stessa.`,
  `Nei documenti c'è una sorpresa: la Contessa non voleva vendere le cantine, ma soltanto una parte. Avrebbe tenuto il sessanta per cento e destinato il resto alla Fondazione, che per anni avrebbe finanziato scuole, interpreti e posti di lavoro. In questo modo il valore delle cantine sarebbe cresciuto: esattamente ciò che Aurora aveva sostenuto a tavola.`,
  `Ecco il segreto. All'ultima pagina c'è il nuovo testamento: la Contessa lascia ad Aurora la direzione economica delle cantine. Accanto, un appunto a mano: «Aurora ha ragione. Ne parlo con lei alle 15, in serra, davanti a una tisana.» Era per lei che aveva ordinato le due tazze: voleva dirle di persona che aveva vinto.`,
  `Nei mesi seguenti la Fondazione Silenzio nasce comunque. Giada apre il rifugio per animali nella parte nord della tenuta, Sofia guida i corsi di linguaggio dei segni e, sul muro della serra, nell'angolo dove cresceva la pianta, i bambini sordi dipingono una grande mano aperta.`
 ],
 en:[
  `At 5:00, in the garden, Volponi opens the folder found on the Countess's desk and reads aloud the name nobody knew: "Silence Foundation". It was not a foreign company buying everything: it was a foundation for deaf people, created by the Countess herself.`,
  `In the documents there is a surprise: the Countess did not want to sell the cellars, only a part of them. She would have kept sixty percent and given the rest to the Foundation, which for years would have financed schools, interpreters and jobs. In this way the value of the cellars would have grown: exactly what Aurora had argued at the table.`,
  `Here is the secret. On the last page there is the new will: the Countess leaves Aurora the financial management of the cellars. Next to it, a handwritten note: "Aurora is right. I will talk to her at 3, in the greenhouse, over a cup of tea." The two cups were for her: she wanted to tell her in person that she had won.`,
  `In the following months the Silence Foundation is born anyway. Giada opens the animal shelter in the north part of the estate, Sofia runs the sign language courses and, on the greenhouse wall, in the corner where the plant used to grow, the deaf children paint a big open hand.`
 ]};
var RED={it:[
 `Ascanio: nome con la A, rischio bancarotta, ma alibi di ferro: era in salotto con Filippo, che lo conferma. Filippo: ha bisogno di soldi, ma era sempre con Ascanio e non sapeva il nome dell'azienda.`,
 `Vittorio: ha preparato la tisana, ma non conosce la pianta, è allergico e non ha irritazioni. Maria: ha servito le tazze, ma l'hanno vista in molti e non va mai in quell'angolo della serra. Sofia: contraria alla vendita, ma con il fisioterapista e in sedia a rotelle.`,
 `Giada (diretta Instagram), Ludovica (selfie con l'orario) e Guglielmo (tennis con Claudio) hanno alibi verificabili. L'incidente della festa di quattro mesi fa era soltanto una prova generale di Aurora.`],
 en:[
 `Ascanio: name with an A, risks bankruptcy, but an iron-clad alibi: he was in the living room with Filippo, who confirms it. Filippo: he needs money, but he was always with Ascanio and did not know the name of the company.`,
 `Vittorio: he prepared the tea, but he does not know the plant, he is allergic and has no irritation. Maria: she served the cups, but many people saw her and she never goes to that corner of the greenhouse. Sofia: against the sale, but with the physiotherapist and in a wheelchair.`,
 `Giada (Instagram live), Ludovica (time-stamped selfies) and Guglielmo (tennis with Claudio) have verifiable alibis. The accident at the party four months ago was only a rehearsal by Aurora.`]};
CAST.forEach(function(c){if(FIMG[c.id])c.face.img=FIMG[c.id]});
VICTIM.face.img=FIMG.contessa;VICTIM.bio=[`Carlotta Ricci guidava l'azienda con mano ferma e con il sorriso. Da anni imparava la lingua dei segni, per una causa che le stava a cuore. Quel giorno, a pranzo, era agitata e felice: voleva dire a tutti una cosa importante, alle 17:00, in giardino. Non ha fatto in tempo.`,`Carlotta Ricci ran the company with a firm hand and a smile. For years she had been learning sign language, for a cause close to her heart. That day, at lunch, she was agitated and happy: she wanted to tell everyone something important, at 5:00 p.m., in the garden. She did not make it in time.`];
IMGS.pugno=fig('<img src="'+FIMG.pugno+'" alt="La serra" loading="lazy">','La serra, dopo il delitto','The greenhouse, after the crime','sm');
IMGS.tazze=fig('<img src="'+FIMG.tazze+'" alt="La tisana" loading="lazy">','La tisana rovesciata','The spilled herbal tea','sm');
IMGS.villa=fig('<img src="'+FIMG.copertina+'" alt="Villa Rufina" loading="lazy">','Villa Rufina, al tramonto','Villa Rufina, at sunset','sm');
IMGS.segni=fig('<img src="'+FIMG.segni+'" alt="Alfabeto dei segni" loading="lazy">','L\'alfabeto dei segni','The sign language alphabet','sm');
IMGS.scena=IMGS.villa;

/* ---------- app ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var SAYB=TTS?'<button type="button" class="ico" data-act="say" aria-pressed="false" aria-label="Ascolta / Listen">'+SPK+'</button>':'';
var SAY='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mk(s){return esc(s).replace(/\[([^|\]]+)\|([^\]]+)\]/g,function(m,a,b){return '<button type="button" class="w" data-act="w" data-t="'+b+'">'+a+'</button>'})}

var KEY=GAME.key;
var S={n:1,names:[],started:false,turn:0,used:0,asked:{},seen:0,marks:{},att:0,solved:false,revealed:false,hint:false,en:false};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o){S[k]=o[k]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var epiStep=0;var tab='caso',sus='',last=null,openEn={},pend='',selSus='',selProofs={},resMsg='',solStep=1,teacherOpen=false,gl=null;

function pname(p){var s=(S.names[p]||'').replace(/^\s+|\s+$/g,'');return s||('Giocatore '+(p+1))}
function castById(id){for(var i=0;i<CAST.length;i++){if(CAST[i].id===id)return CAST[i]}return null}
function av(f){if(f.img)return '<img class="av" alt="" src="'+f.img+'">';return '<span class="av" style="background:none;overflow:hidden" aria-hidden="true">'+faceSVG(f,52)+'</span>'}
function pad2(n){return (n<10?'0':'')+n}
function clockStr(){var m=(GAME.t0+S.used*GAME.dt)%1440;return pad2(Math.floor(m/60))+':'+pad2(m%60)}
function clockHtml(){
  var l=left(),pc=Math.round(100*S.used/B);
  return '<div class="clock'+(l<=3?' hot':'')+'" role="status"><div class="clock-t"><b>'+clockStr()+'</b><span lang="it">'+esc(GAME.dl[0])+'</span><small lang="en">'+esc(GAME.dl[1])+'</small></div><div class="bar" aria-hidden="true"><i style="width:'+pc+'%"></i></div></div>';
}
function helpCard(compact){
  var rows=[['<span class="demo">English</span>','Sotto ogni testo c\'è il bottone <b>English</b>: toccalo e leggi la traduzione.','Under every text there is an English button: tap it to read the translation.'],
   ['<span class="demo w">parola</span>','Le parole <b>sottolineate</b> hanno un aiuto: toccale e compare il significato.','Underlined words have help: tap them and the meaning appears.'],
   ['<span class="demo">Aa</span>','In alto, <b>Aa</b> apre il glossario completo, con ricerca.','At the top, Aa opens the full glossary, with search.'],
   ['<span class="demo">EN</span>','In alto, <b>EN</b> mostra sempre tutte le traduzioni.','At the top, EN always shows every translation.']];
  if(!compact&&SAY)rows.push(['<span class="demo">&#128266;</span>','L\'altoparlante legge il testo in italiano.','The speaker reads the text aloud in Italian.']);
  var list='<ul class="hl">'+rows.map(function(r){return '<li>'+r[0]+'<span><span lang="it">'+r[1]+'</span><small lang="en">'+r[2]+'</small></span></li>'}).join('')+'</ul>';
  if(compact)return '<details class="card help"><summary><b>Traduzione e glossario: come si usano</b><small lang="en" style="display:block">English translation and glossary: how to use them</small></summary>'+list+'</details>';
  return '<div class="card help"><div class="card-h"><span class="tag">Traduzione e glossario</span></div><p class="it" lang="it"><b>Tutto il gioco ha la traduzione in inglese e il glossario.</b></p><p class="en" lang="en">The whole game has an English translation and a glossary.</p>'+list+'</div>';
}
function timelineHtml(){
  var vis=TIMELINE.filter(function(e){return e.a?(S.asked[e.a.split('.')[0]]&&S.asked[e.a.split('.')[0]][e.a.split('.')[1]]):S.used>=e.at});
  var h='<h3 lang="it" style="margin-top:6px">La linea del tempo<small lang="en" style="display:block;font-weight:400">The timeline: it fills in as you investigate</small></h3><div class="card"><ol class="tl">';
  if(!vis.length)h+='<li><span lang="it">Ancora niente. Interrogate i sospettati!</span><small lang="en">Nothing yet. Question the suspects!</small></li>';
  vis.forEach(function(e){h+='<li><b>'+esc(e.t)+'</b><span><span class="it" lang="it">'+mk(e.it)+'</span><small lang="en">'+esc(e.en)+'</small></span></li>'});
  var hid=TIMELINE.length-vis.length;
  if(hid>0)h+='<li class="unk"><b>?</b><span><span lang="it">Altri momenti da scoprire: '+hid+'</span><small lang="en">More moments to discover: '+hid+'</small></span></li>';
  return h+'</ol><div class="gloss" hidden></div></div>';
}
function left(){return Math.max(0,B-S.used)}
function unlocked(){return REPORTS.filter(function(r){return S.used>=r.at})}

function cardHtml(id,tag,title,it,en,img){
  var open=S.en||openEn[id];
  var its=(Array.isArray(it)?it:[it]).map(function(p){return '<p class="it" lang="it">'+mk(p)+'</p>'}).join('');
  var ens=(Array.isArray(en)?en:[en]).map(function(p){return '<p lang="en">'+esc(p)+'</p>'}).join('');
  return '<article class="card" data-id="'+id+'"><div class="card-h"><span class="tag">'+tag+'</span>'+SAY+'</div>'+(title?'<h3>'+esc(title)+'</h3>':'')+(img||'')+its+'<div class="gloss" hidden aria-live="polite"></div><button type="button" class="entog" data-act="ent" aria-expanded="'+(open?'true':'false')+'">English</button><div class="en" '+(open?'':'hidden')+'>'+ens+'</div></article>';
}
function answerCard(c,q,a,id){
  var open=S.en||openEn[id];
  return '<article class="card bubble" data-id="'+id+'"><div class="who">'+av(c.face)+'<div><b>'+esc(c.name)+'</b><span lang="it">'+esc(q.it)+'</span><small lang="en" style="display:block">'+esc(q.en)+'</small></div>'+SAY+'</div>'+
   '<p class="it" lang="it">«'+mk(a[0])+'»</p><div class="gloss" hidden aria-live="polite"></div><button type="button" class="entog" data-act="ent" aria-expanded="'+(open?'true':'false')+'">English</button><div class="en" '+(open?'':'hidden')+'><p lang="en">“'+esc(a[1])+'”</p></div></article>';
}
function header(){
  var l=left();
  return '<header class="top"><div class="tape"></div><div class="wrap top-row"><div class="brand"><h1>'+esc(GAME.title)+'</h1><span>'+esc(GAME.sub)+'</span></div>'+
   (S.started?'<span class="pill cnt" aria-label="Domande rimaste: '+l+'" style="display:grid;place-items:center">'+l+'<small style="display:block;font-size:10px;line-height:1">domande</small></span>':'')+
   '<button type="button" class="pill" data-act="en" aria-pressed="'+(S.en?'true':'false')+'" aria-label="Mostra sempre inglese / Always show English">EN</button>'+
   '<button type="button" class="pill" data-act="glos" aria-label="Parole / Glossary">Aa</button></div></header>';
}
function nav(){
  var T=[['caso','Caso','Case'],['interroga','Interroga','Question'],['taccuino','Taccuino','Notebook'],['accusa','Accusa','Accuse']];
  var dot=(S.seen<unlocked().length)?'<i class="dot" aria-label="Nuovo messaggio"></i>':'';
  return '<nav class="nav" aria-label="Menu"><div class="nav-in" style="grid-template-columns:repeat(4,1fr)">'+T.map(function(t){
    return '<button type="button" class="tab" data-act="tab" data-v="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='caso'?dot:'')+'<small>'+t[2]+'</small></button>'}).join('')+'</div></nav>';
}

function viewSetup(){
  var chips='',i,names='';
  for(i=1;i<=10;i++)chips+='<button type="button" class="chip" data-act="n" data-v="'+i+'" aria-pressed="'+(S.n===i)+'">'+i+'</button>';
  if(S.n>1)for(i=0;i<S.n;i++)names+='<input class="txt" id="pn'+i+'" type="text" maxlength="20" value="'+esc(S.names[i]||'')+'" placeholder="Giocatore '+(i+1)+'" aria-label="Nome del giocatore '+(i+1)+'">';
  var rules=[GAME.rule1,['A turno, scegliete un sospettato e fate una domanda.','Take turns: choose a suspect and ask a question.'],['Leggete la risposta a voce alta. Scrivete nel taccuino.','Read the answer out loud. Write in the notebook.'],['Avete solo '+B+' domande. Scegliete bene!','You only have '+B+' questions. Choose well!'],['Poi accusate il colpevole con tre prove.','Then accuse the culprit with three proofs.']];
  return '<div class="stack"><h2>'+esc(GAME.q[0])+'</h2><p class="it" lang="it">'+esc(GAME.intro[0])+'</p><p class="en" lang="en">'+esc(GAME.intro[1])+'</p></div>'+
   '<section class="stack"><div class="q" lang="it">Quanti giocatori siete?<small lang="en">How many players? (1–10). Everyone shares one phone, or each plays on their own.</small></div><div class="chips">'+chips+'</div>'+(names?'<div class="q" lang="it">I nomi<small lang="en">Names (optional)</small></div><div class="stack">'+names+'</div>':'')+'</section>'+
   helpCard(false)+'<div class="card"><div class="card-h"><span class="tag">Come si gioca</span></div><ol class="steps">'+rules.map(function(r){return '<li>'+esc(r[0])+'<span lang="en">'+esc(r[1])+'</span></li>'}).join('')+'</ol></div>'+
   '<button type="button" class="btn tape" data-act="start">Inizia l\'indagine<small>Start the investigation</small></button>'+
   '<button type="button" class="link" data-act="teacher">Per l\'insegnante / For the teacher</button>'+(teacherOpen?'<div class="card"><h3>Soluzione / Solution</h3><p>'+esc(TEACHER)+'</p></div>':'');
}
function viewCaso(){
  var seenBefore=S.seen;S.seen=unlocked().length;save();
  var h='<h2>Il caso</h2>'+clockHtml()+helpCard(true)+cardHtml('story','La storia','',STORY.it,STORY.en,IMGS.scena);
  h+='<div class="card"><div class="card-h"><span class="tag">La vittima</span></div><div class="who">'+av(VICTIM.face)+'<div><b>'+esc(VICTIM.name)+'</b><span lang="it">'+esc(VICTIM.it)+'</span><small lang="en" style="display:block">'+esc(VICTIM.en)+'</small></div></div>'+(VICTIM.bio?'<p class="it" lang="it">'+mk(VICTIM.bio[0])+'</p><div class="gloss" hidden></div><small lang="en">'+esc(VICTIM.bio[1])+'</small>':'')+'</div>';
  h+='<h3 lang="it" style="margin-top:6px">'+esc(GAME.reportsH)+'</h3>';
  var un=unlocked();
  un.forEach(function(r,idx){h+=cardHtml('rep'+idx,(r.twist?'Colpo di scena':'Rapporto '+(idx+1))+(idx>=seenBefore&&seenBefore>0?' · NUOVO':''),r.t,r.it,r.en,r.img?IMGS[r.img]:'')});
  var nx=REPORTS.filter(function(r){return S.used<r.at})[0];
  if(nx)h+='<div class="card ask"><p class="it" lang="it">Un nuovo rapporto arriva dopo <b>'+(nx.at-S.used)+'</b> '+((nx.at-S.used)===1?'domanda':'domande')+'.</p><p class="en" lang="en">A new report arrives after '+(nx.at-S.used)+' more '+((nx.at-S.used)===1?'question':'questions')+'.</p></div>';
  h+='<button type="button" class="btn tape" data-act="tab" data-v="interroga">Interroga i sospettati<small>Question the suspects</small></button>';
  h+=cb('restart','x','Ricomincia la partita','Start a new game');
  return h;
}
function cb(act,v,it,en){var on=pend===act+v;return '<button type="button" class="btn ghost" data-act="'+act+'" data-v="'+v+'">'+(on?'Tocca ancora per confermare':esc(it))+'<small>'+(on?'Tap again to confirm':esc(en))+'</small></button>'}
function turnBanner(){
  if(S.n<2)return '';
  return '<div class="turn"><span lang="it">Turno di <b>'+esc(pname(S.turn%S.n))+'</b></span><small lang="en">Choose a suspect and ask a question</small></div>';
}
function viewInterroga(){
  var h='<h2>Interroga</h2>'+clockHtml();
  if(left()>0&&left()<=3)h+='<div class="msg" role="status"><span lang="it"><b>Il tempo sta finendo!</b> Restano solo '+left()+' domande.</span><span class="e" lang="en">Time is running out! Only '+left()+' questions left.</span></div>';
  if(left()===0)h+='<div class="msg" role="status"><span lang="it">Le domande sono finite. È il momento di accusare!</span><span class="e" lang="en">No questions left. Time to accuse!</span></div>';
  if(last){
    var c=castById(last.s),q=QS.filter(function(x){return x.k===last.k})[0];
    var a=ANS[last.s][last.k];
    h+=answerCard(c,q,a,'ans-'+last.s+'-'+last.k);
    h+='<p class="it" lang="it">Leggi la risposta a voce alta. Poi scrivi nel <b>taccuino</b>.</p><small lang="en">Read the answer out loud. Then write in the notebook.</small>';
    var nm=REPORTS.filter(function(r){return r.at>0&&r.at===S.used&&last.fresh});
    if(nm.length)h+='<div class="msg" role="status"><span lang="it"><b>Nuovo rapporto</b> '+esc(GAME.fromIt)+'!</span><span class="e" lang="en">New report '+esc(GAME.fromEn)+'!</span></div><button type="button" class="btn tape" data-act="tab" data-v="caso">Leggi il rapporto<small>Read the report</small></button>';
    if(S.n>1&&last.fresh)h+='<div class="turn"><span lang="it">Passa il telefono a <b>'+esc(pname(S.turn%S.n))+'</b></span><small lang="en">Pass the phone to the next player</small></div>';
    if(left()>0)h+='<button type="button" class="btn" data-act="more" data-v="'+last.s+'">Altra domanda a '+esc(c.name.split(' ')[0])+'<small>Another question</small></button><button type="button" class="btn ghost" data-act="back">Altri sospettati<small>Other suspects</small></button>';
    else h+='<button type="button" class="btn tape" data-act="tab" data-v="accusa">Vai all\'accusa<small>Go to the accusation</small></button>';
    return h;
  }
  if(sus){
    var c2=castById(sus);
    h+='<div class="card"><div class="who">'+av(c2.face)+'<div><b>'+esc(c2.name)+'</b><span lang="it">'+c2.age+' anni · '+esc(c2.role)+'</span><small lang="en" style="display:block">'+c2.age+' · '+esc(c2.roleEn)+'</small></div></div><p class="it" lang="it">'+mk(c2.desc)+'</p><div class="gloss" hidden></div></div>';
    h+=turnBanner()+'<div class="q" lang="it">Scegli una domanda<small lang="en">Choose a question ('+left()+' left)</small></div><div class="stack">';
    QS.forEach(function(q){
      var done=S.asked[sus]&&S.asked[sus][q.k];
      h+='<button type="button" class="qbtn'+(done?' done':'')+'" data-act="'+(done?'reread':'ask')+'" data-s="'+sus+'" data-v="'+q.k+'"'+((!done&&left()===0)?' disabled':'')+'><span lang="it">'+esc(q.it)+'</span><small lang="en">'+esc(q.en)+(done?' · già chiesta / already asked':'')+'</small></button>';
    });
    h+='</div><button type="button" class="btn ghost" data-act="back">Altri sospettati<small>Other suspects</small></button>';
    return h;
  }
  h+=turnBanner()+'<p class="it" lang="it">Tocca un sospettato.</p><small lang="en">Tap a suspect.</small><div class="stack">';
  CAST.forEach(function(c){
    var n=S.asked[c.id]?Object.keys(S.asked[c.id]).length:0;
    h+='<button type="button" class="sus" data-act="sus" data-v="'+c.id+'">'+av(c.face)+'<span class="sn"><b>'+esc(c.name)+'</b><span lang="it">'+esc(c.role)+'</span><small lang="en">'+esc(c.roleEn)+'</small></span><span class="cnt2">'+n+'/4</span></button>';
  });
  h+='</div>';
  if(S.hint)h+=cardHtml('hint',GAME.helpTag,'',HINT.it,HINT.en);
  else if(left()>=3)h+='<button type="button" class="btn ghost" data-act="hint">'+esc(GAME.helpBtn[0])+'<small>'+esc(GAME.helpBtn[1])+' · costs 2 questions</small></button>';
  return h;
}
function viewNote(){
  var h='<h2>Il taccuino</h2><p lang="it">Tocca una casella: <b>?</b> → <b>Sì</b> → <b>No</b>.</p><small lang="en">Tap a box: ? (not sure) → Yes → No.</small>';
  h+='<div class="tw"><table class="nb"><thead><tr><th scope="col"><span lang="it">Sospetto</span><small lang="en">Suspect</small></th>'+COLS.map(function(c){return '<th scope="col"><span lang="it">'+esc(c.it)+'</span><small lang="en">'+esc(c.en)+'</small></th>'}).join('')+'</tr></thead><tbody>';
  CAST.forEach(function(c){
    h+='<tr><th scope="row">'+esc(c.name.split(' ')[0])+'<small>'+esc(c.roleEn)+'</small></th>';
    COLS.forEach(function(col){var v=(S.marks[c.id]&&S.marks[c.id][col.k])||'';
      h+='<td><button type="button" class="cell '+v+'" data-act="mark" data-s="'+c.id+'" data-k="'+col.k+'" aria-label="'+esc(c.name+', '+col.it)+': '+(v==='y'?'Sì':v==='n'?'No':'?')+'">'+(v==='y'?'Sì':v==='n'?'No':'?')+'</button></td>'});
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="card"><p class="it" lang="it">Esempio: Nicola ha una chiave? Se sì, tocca <b>Sì</b> nella colonna Chiave.</p><p class="en" lang="en">Example: does Nicola have a key? If yes, tap Yes in the Key column.</p></div>';
  h+=timelineHtml();
  h+='<h3 lang="it" style="margin-top:6px">I verbali (risposte dei sospettati)</h3>';
  var any=false;
  CAST.forEach(function(c){
    var a=S.asked[c.id];if(!a||!Object.keys(a).length)return;any=true;
    h+='<details class="old"><summary>'+esc(c.name)+' · '+Object.keys(a).length+'/4</summary><div class="stack" style="padding:12px 14px">';
    QS.forEach(function(q){if(a[q.k]){var an=ANS[c.id][q.k];h+='<div><p class="it" lang="it"><b>'+esc(q.it)+'</b></p><p class="it" lang="it">«'+mk(an[0])+'»</p><div class="gloss" hidden></div><button type="button" class="entog" data-act="enq" aria-expanded="false">English</button><p class="en" lang="en" hidden>'+esc(an[1])+'</p></div>'}});
    h+='</div></details>';
  });
  if(!any)h+='<div class="card"><p class="it" lang="it">Non ci sono ancora verbali. Interrogate un sospettato!</p><p class="en" lang="en">No records yet. Question a suspect!</p></div>';
  h+=cb('resetnb','x','Cancella le caselle','Clear the boxes');
  return h;
}
function ratingHtml(){
  if(!S.solved)return '';
  var sc=S.used+3*(S.att||0),stars=sc<=10?3:(sc<=14?2:1);
  var L={3:['Investigatore Maestro','Master detective'],2:['Investigatore Esperto','Expert detective'],1:['Investigatore Junior','Junior detective']}[stars];
  var s='';for(var i=0;i<3;i++)s+=i<stars?'★':'☆';
  return '<div class="card"><div class="card-h"><span class="tag">Il vostro grado</span></div><div><span class="stars" aria-label="'+stars+' / 3">'+s+'</span></div><p class="it" lang="it"><b>'+L[0]+'</b></p><p class="en" lang="en">'+L[1]+'</p><small lang="en">Questions used: '+S.used+' · wrong accusations: '+(S.att||0)+'</small></div>';
}
function solDone(){return solStep>=SOL.it.length}
function solBlock(){
  var n=SOL.it.length;if(solStep<1)solStep=1;var k=Math.min(solStep,n);
  var h=cardHtml('sol',k<n?'Il momento della verità':'La verità','',SOL.it.slice(0,k),SOL.en.slice(0,k));
  if(k<n)return h+'<button type="button" class="btn tape" data-act="solnext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  var c=castById(CULPRIT);
  h+='<div class="card"><div class="who">'+av(c.face)+'<div><b>'+esc(c.name)+'</b><span lang="it">'+esc(c.role)+'</span></div></div><span class="stamp">Colpevole</span></div>';
  return h+ratingHtml();
}
function epiBlock(){
  var n=EPI.it.length,h='';
  if(epiStep<1)return '<div class="card" style="border-style:dashed"><div class="card-h"><span class="tag">Finale nascosto</span></div><p class="it" lang="it"><b>'+esc(EPI.teaser[0])+'</b></p><p class="en" lang="en">'+esc(EPI.teaser[1])+'</p></div><button type="button" class="btn tape" data-act="epistart">Leggi l\'epilogo<small>Read the epilogue</small></button>';
  var k=Math.min(epiStep,n);
  h+='<h2>Epilogo</h2>'+cardHtml('epi',k<n?'Dopo l\'arresto':'Il segreto',EPI.title,EPI.it.slice(0,k),EPI.en.slice(0,k));
  if(k<n)h+='<button type="button" class="btn tape" data-act="epinext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  else h+='<span class="stamp">Fine</span>';
  return h;
}
function viewAccusa(){
  var h='';
  if(S.solved||S.revealed){
    h+='<span class="stamp">Caso chiuso</span><h2>La soluzione</h2>'+solBlock();
    if(solDone()){
      h+='<div class="card"><div class="card-h"><span class="tag">Le prove</span></div><ol class="steps">'+PROOFS.filter(function(p){return p.ok}).map(function(p){return '<li>'+esc(p.it)+'<span lang="en">'+esc(p.en)+'</span></li>'}).join('')+'</ol></div>';
      h+=cardHtml('red','Le false piste','',RED.it,RED.en);
      h+=epiBlock();
      if(epiStep>=EPI.it.length)h+='<button type="button" class="btn tape" data-act="again">Nuova partita<small>New game</small></button>';
    }
    return h;
  }
  h+='<h2>Accusa</h2><p class="it" lang="it">'+esc(GAME.q[0])+' Scegliete una persona e tre prove.</p><p class="en" lang="en">'+esc(GAME.q[1])+' Choose one person and three proofs.</p>';
  h+='<fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">1. Il colpevole<small lang="en">The culprit</small></legend>';
  CAST.forEach(function(c){h+='<label class="opt"><input type="radio" name="sus" data-act="pick" value="'+c.id+'"'+(selSus===c.id?' checked':'')+'><span><b>'+esc(c.name)+'</b><span class="e">'+esc(c.roleEn)+'</span></span></label>'});
  h+='</fieldset><fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">2. Tre prove<small lang="en">Three proofs</small></legend>';
  PROOFS.forEach(function(p){h+='<label class="opt"><input type="checkbox" data-act="proof" value="'+p.k+'"'+(selProofs[p.k]?' checked':'')+'><span lang="it">'+esc(p.it)+'<span class="e" lang="en">'+esc(p.en)+'</span></span></label>'});
  h+='</fieldset><div id="res" aria-live="polite">'+resMsg+'</div><button type="button" class="btn tape" data-act="accuse">Accuso!<small>I accuse!</small></button>';
  if(S.att>=2)h+=cb('reveal','x','Mostra la soluzione','Show the solution');
  return h;
}
function render(){
  var body=!S.started?viewSetup():({caso:viewCaso,interroga:viewInterroga,taccuino:viewNote,accusa:viewAccusa})[tab]();
  $('#app').innerHTML=header()+'<main class="wrap main">'+body+'</main>'+(S.started?nav():'');
}
function go(t){tab=t;pend='';sus='';last=null;render();window.scrollTo(0,0)}

function glossary(){
  var map={},texts=[].concat(STORY.it,SOL.it,EPI.it);
  REPORTS.forEach(function(r){texts.push(r.it)});
  CAST.forEach(function(c){texts.push(c.desc)});TIMELINE.forEach(function(e){texts.push(e.it)});if(VICTIM.bio)texts.push(VICTIM.bio[0]);
  Object.keys(ANS).forEach(function(id){Object.keys(ANS[id]).forEach(function(k){texts.push(ANS[id][k][0])})});
  texts.forEach(function(t){var re=/\[([^|\]]+)\|([^\]]+)\]/g,m;while((m=re.exec(t))){var key=m[1].toLowerCase();if(!map[key])map[key]=[m[1],m[2]]}});
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,'it')}).map(function(k){return map[k]});
}
function glList(q){
  q=q.toLowerCase();
  var items=gl.filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>-1||p[1].toLowerCase().indexOf(q)>-1});
  if(!items.length)return '<p>Nessun risultato / No results</p>';
  return items.map(function(p){return '<div class="gl-item"><b lang="it">'+esc(p[0])+'</b><span lang="en">'+esc(p[1])+'</span></div>'}).join('');
}
function openGlossary(){
  if(!gl)gl=glossary();
  var el=$('#gl');
  el.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><h2>Parole</h2><button type="button" class="pill" data-act="closeglos">Chiudi</button></div><small>Glossario italiano → inglese / Italian → English glossary</small><input type="search" id="gs" placeholder="Cerca / Search" aria-label="Cerca / Search"><div id="gl-list">'+glList('')+'</div></div>';
  el.hidden=false;document.body.style.overflow='hidden';
}
var ITV=null,ITV_TRIED=false;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    var it=vs.filter(function(v){return /^it([-_]|$)/i.test(v.lang)||/ital/i.test(v.name)});
    if(!it.length)return null;
    function sc(v){var n=v.name||'',x=0;if(/^it[-_]IT/i.test(v.lang))x+=3;if(/premium|enhanced|natural|neural|google|siri/i.test(n))x+=4;if(/alice|federica|elsa|paola|luca|isabella|diego|emma|giorgio/i.test(n))x+=2;if(v.localService===false)x+=1;return x}
    it.sort(function(p,q){return sc(q)-sc(p)});
    return it[0];
  }catch(e){return null}
}
function refreshSay(){ITV=TTS?pickVoice():null;SAY=ITV?SAYB:''}
refreshSay();
if(TTS){try{window.speechSynthesis.onvoiceschanged=function(){var had=!!SAY;refreshSay();if(!!SAY!==had){var ap=document.getElementById('app');if(ap&&ap.innerHTML)render()}};if(window.speechSynthesis.getVoices)window.speechSynthesis.getVoices()}catch(e){}}
function prepSpeech(t){
  return t.replace(/[«»“”"]/g,'').replace(/\s+/g,' ')
   .replace(/\b(\d{1,2}):00\b/g,'$1 in punto')
   .replace(/\b(\d{1,2}):(\d{2})\b/g,'$1 e $2')
   .replace(/\s*[—–]\s*/g,', ').replace(/…/g,'.').trim();
}
function chunks(t){
  var parts=t.match(/[^.!?;:]+[.!?;:]*/g)||[t],out=[],cur='';
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.map(function(x){return x.trim()}).filter(Boolean);
}
function speak(card,btn){
  if(!TTS)return;
  try{
    var ss=window.speechSynthesis;
    if(btn.getAttribute('aria-pressed')==='true'){ss.cancel();btn.setAttribute('aria-pressed','false');return}
    ss.cancel();$$('.ico[aria-pressed="true"]').forEach(function(b){b.setAttribute('aria-pressed','false')});
    var txt=prepSpeech($$('.it',card).map(function(n){return n.textContent}).join(' '));
    var v=ITV||pickVoice();ITV=v;
    var gl=$('.gloss',card);
    if(!v&&gl){gl.innerHTML='Voce italiana non trovata sul telefono. Nelle impostazioni, scarica o scegli una voce italiana (Sintesi vocale).<br><i>Italian voice not found on your phone. In Settings, download or choose an Italian voice (Text-to-speech).</i>';gl.hidden=false}
    var list=chunks(txt),i=0;
    btn.setAttribute('aria-pressed','true');
    (function next(){
      if(i>=list.length||btn.getAttribute('aria-pressed')!=='true'){btn.setAttribute('aria-pressed','false');return}
      var u=new SpeechSynthesisUtterance(list[i++]);
      u.lang=v?v.lang.replace('_','-'):'it-IT';if(v)u.voice=v;u.rate=0.92;u.pitch=1;
      u.onend=next;u.onerror=function(){btn.setAttribute('aria-pressed','false')};
      ss.speak(u);
    })();
  }catch(e){btn.setAttribute('aria-pressed','false')}
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  var keep=(a==='restart'||a==='resetnb'||a==='reveal'||a==='teacher');
  if(!keep&&pend)pend='';
  switch(a){
   case 'n':S.n=+v;save();render();break;
   case 'start':S.started=true;S.turn=0;tab='caso';save();render();window.scrollTo(0,0);break;
   case 'tab':go(v);break;
   case 'en':S.en=!S.en;save();render();break;
   case 'glos':openGlossary();break;
   case 'closeglos':$('#gl').hidden=true;document.body.style.overflow='';break;
   case 'w':var cd=b.closest('.card,details'),g=cd&&$('.gloss',cd);if(g){g.textContent=b.textContent+' = '+b.getAttribute('data-t');g.hidden=false}break;
   case 'ent':var c2=b.closest('.card'),id=c2.getAttribute('data-id'),en=$('.en',c2);var op=en.hidden;en.hidden=!op;openEn[id]=op;b.setAttribute('aria-expanded',op?'true':'false');break;
   case 'enq':var nx=b.nextElementSibling;nx.hidden=!nx.hidden;b.setAttribute('aria-expanded',nx.hidden?'false':'true');break;
   case 'say':speak(b.closest('.card'),b);break;
   case 'sus':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'more':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'back':sus='';last=null;render();window.scrollTo(0,0);break;
   case 'ask':
     var s=b.getAttribute('data-s');
     if(left()<=0)break;
     S.asked[s]=S.asked[s]||{};S.asked[s][v]=true;S.used++;S.turn=(S.turn+1)%S.n;
     last={s:s,k:v,fresh:true};save();render();window.scrollTo(0,0);break;
   case 'reread':last={s:b.getAttribute('data-s'),k:v,fresh:false};render();window.scrollTo(0,0);break;
   case 'hint':if(!S.hint&&left()>=3){S.hint=true;S.used+=2;save();render();window.scrollTo(0,0)}break;
   case 'mark':
     var ss=b.getAttribute('data-s'),kk=b.getAttribute('data-k');S.marks[ss]=S.marks[ss]||{};
     var cur=S.marks[ss][kk]||'',nv=cur===''?'y':cur==='y'?'n':'';S.marks[ss][kk]=nv;save();
     b.className='cell '+nv;b.textContent=nv==='y'?'Sì':nv==='n'?'No':'?';break;
   case 'resetnb':if(pend==='resetnbx'){S.marks={};pend='';save();render()}else{pend='resetnbx';render()}break;
   case 'accuse':doAccuse();break;
   case 'reveal':if(pend==='revealx'){S.revealed=true;solStep=1;pend='';save();render();window.scrollTo(0,0)}else{pend='revealx';render()}break;
   case 'epistart':epiStep=1;render();break;
   case 'epinext':epiStep++;render();var nb2=$('[data-act=epinext]');if(nb2)nb2.scrollIntoView({block:'center'});break;
   case 'solnext':solStep++;render();var nb=$('[data-act=solnext]');if(nb)nb.scrollIntoView({block:'center'});else window.scrollTo(0,0);break;
   case 'restart':if(pend==='restartx'){newGame();pend=''}else{pend='restartx';render()}break;
   case 'again':newGame();break;
   case 'teacher':if(pend==='teacherx'){teacherOpen=!teacherOpen;pend=''}else{pend='teacherx';if(teacherOpen)teacherOpen=false}render();break;
  }
});
function newGame(){
  S.started=false;S.turn=0;S.used=0;S.asked={};S.seen=0;S.marks={};S.att=0;S.solved=false;S.revealed=false;S.hint=false;
  tab='caso';sus='';last=null;selSus='';selProofs={};resMsg='';solStep=1;epiStep=0;openEn={};save();render();window.scrollTo(0,0);
}
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-act');
  if(a==='pick')selSus=t.value;
  if(a==='proof')selProofs[t.value]=t.checked;
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.id==='gs'&&gl)$('#gl-list').innerHTML=glList(t.value);
  if(t.id.indexOf('pn')===0&&/^pn\d+$/.test(t.id)){S.names[+t.id.slice(2)]=t.value;save()}
});
function doAccuse(){
  var picked=Object.keys(selProofs).filter(function(k){return selProofs[k]});
  var box=$('#res');
  if(!selSus||picked.length!==3){resMsg='<div class="msg" role="alert"><span lang="it">Scegliete una persona e tre prove.</span><span class="e" lang="en">Choose one person and three proofs.</span></div>';box.innerHTML=resMsg;return}
  var ok=picked.every(function(k){return PROOFS.filter(function(p){return p.k===k})[0].ok});
  if(selSus===CULPRIT&&ok){S.solved=true;solStep=1;save();render();window.scrollTo(0,0);return}
  S.att=(S.att||0)+1;save();
  resMsg='<div class="msg" role="alert"><span lang="it">Non ancora. Il colpevole o le prove non sono giusti. Guardate il taccuino e i verbali.</span><span class="e" lang="en">Not yet. The culprit or the proofs are not right. Look at the notebook and the records.</span></div>';
  render();var r=$('#res');if(r)r.scrollIntoView({block:'center'});
}
render();

})();
</script>
</body></html>
