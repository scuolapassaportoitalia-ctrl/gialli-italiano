<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Delitto al Forno</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout concept: a police case file on a phone. Sticky header with hazard tape, one column of evidence cards, fixed bottom tab bar. */
:root{
  --bg:#E6E9E7; --surface:#F7F8F6; --fg:#15202B; --muted:#4F5C67; --line:#C5CCC8;
  --tape:#F2C300; --on-tape:#15202B; --stamp:#B3261E; --sea:#0A5A70; --yes:#1B6E45; --no:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
    --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
  --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0}
small{font-size:13px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#15202B 14px 28px)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{font-size:28px;letter-spacing:.05em}
.brand span{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{min-height:40px;min-width:44px;padding:0 12px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}

/* layout */
.main{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;background:var(--tape);color:var(--on-tape);padding:2px 8px;border-radius:2px;text-transform:uppercase}
.it{font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.en{color:var(--sea);font-size:16px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.entog{align-self:flex-start;min-height:36px;padding:0 12px;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:4px;font-size:14px;font-weight:700}
.entog[aria-expanded="true"]{background:var(--sea);color:var(--bg)}
.w{padding:0;border:0;border-bottom:2px dotted var(--sea);background:none;font:inherit;line-height:inherit;color:inherit;cursor:help}
.gloss{background:var(--tape);color:var(--on-tape);font-weight:700;padding:6px 10px;border-radius:3px;font-size:16px;align-self:flex-start}
.ico{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center;flex:none}
.ico[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.ico svg{width:22px;height:22px}

/* buttons */
.btn{min-height:50px;padding:0 20px;border:2px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:4px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn.tape{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-family:var(--body);font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:inherit;opacity:.85}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:15px;align-self:flex-start;min-height:44px}

/* setup */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-height:48px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[disabled]{opacity:.3;cursor:not-allowed}
.q{font-weight:700;font-size:18px}
.q small{display:block;font-weight:400}

/* rounds */
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rd{min-height:56px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.rd[aria-pressed="true"]{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.rd[aria-disabled="true"]{opacity:.45;border-style:dashed}
.rd svg{width:16px;height:16px;flex:none}
.task{border-left:6px solid var(--tape);padding-left:12px}
.ask{background:transparent;border:2px dashed var(--muted)}

/* cast */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:24px;flex:none}
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.who span{font-size:15px;color:var(--muted)}

/* notebook */
.tw{overflow-x:auto}
table.nb{border-collapse:collapse;width:100%;min-width:340px}
.nb th,.nb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.nb thead th{font-family:var(--mono);font-size:12px;text-transform:uppercase;vertical-align:bottom}
.nb thead th small{display:block;text-transform:none;font-family:var(--body)}
.nb tbody th{text-align:left;font-weight:700;font-size:16px;padding-right:8px}
.nb tbody th small{display:block;font-weight:400}
.cell{width:100%;min-width:52px;min-height:48px;border:2px solid var(--line);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted)}
.cell.y{border-color:var(--yes);color:var(--yes);background:color-mix(in srgb,var(--yes) 14%,transparent)}
.cell.n{border-color:var(--no);color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}

/* accuse */
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);min-height:56px}
.opt input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--sea);flex:none}
.opt:has(input:checked){border-color:var(--fg)}
.opt .e{display:block;color:var(--sea);font-size:15px}
.msg{padding:12px 14px;border-radius:4px;background:var(--surface);border:2px solid var(--stamp)}
.msg .e{display:block;color:var(--sea);font-size:15px}
.stamp{display:inline-block;align-self:flex-start;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;padding:2px 14px;transform:rotate(-5deg);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:st .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes st{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
}
ul.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li span{display:block;color:var(--sea);font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--fg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:58px;border:0;background:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-top:5px solid transparent;margin-top:-2px;padding:4px 2px}
.tab small{display:block;font-family:var(--body);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0}
.tab[aria-current="page"]{border-top-color:var(--tape);background:color-mix(in srgb,var(--tape) 16%,transparent)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.ov input[type=search]{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%}
.gl-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{overflow-wrap:anywhere}
.gl-item span{color:var(--sea);text-align:right;overflow-wrap:anywhere}
table.tt{border-collapse:collapse;width:100%;font-size:15px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tt td.c{font-family:var(--mono);text-align:center}

.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--tape)}
.turn{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:4px;display:flex;flex-direction:column}
.turn small{color:inherit;opacity:.85}
.txt{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%;min-width:0}
textarea.txt{min-height:96px;padding:10px 12px;resize:vertical}
details.old{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.old summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer}
details.old .card{border:0;border-top:1px solid var(--line);border-radius:0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img,.fig svg{display:block;width:100%;max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:#fff}
.fig.sm{max-width:260px}
.fig figcaption{font-size:14px;color:var(--muted)}
img.av{object-fit:cover;object-position:top center;background:#cde;border:2px solid var(--line)}
span.av{background:none}
.qa{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}.qa summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--stamp);margin-left:4px;vertical-align:middle}
.sus{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:68px;padding:8px 12px;border:2px solid var(--fg);background:var(--surface);border-radius:6px}
.sus .sn{flex:1;min-width:0;display:flex;flex-direction:column}
.sus .sn b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.sus .sn span,.sus .sn small{font-size:14px;color:var(--muted)}
.cnt2{font-family:var(--mono);font-weight:700}
.qbtn{text-align:left;min-height:60px;padding:10px 14px;border:2px solid var(--fg);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;gap:2px;width:100%}
.qbtn span{font-weight:700;font-size:17px}.qbtn small{color:var(--muted);font-size:14px}
.qbtn.done{border-style:dashed;color:var(--muted)}.qbtn[disabled]{opacity:.4;cursor:not-allowed}
.bubble{border-left:6px solid var(--tape)}
.who .ico{margin-left:auto}
.stars{background:var(--tape);color:#15202B;padding:4px 12px;border-radius:4px;display:inline-block;font-size:28px;letter-spacing:6px}
.pill.cnt{background:var(--tape);color:#15202B;border-color:#15202B;font-size:20px;line-height:1}

.clock{border:2px solid var(--fg);background:var(--surface);border-radius:6px;padding:10px 12px}
.clock-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.clock-t b{font-family:var(--display);font-size:30px;line-height:1}
.clock-t span{font-size:15px}.clock-t small{width:100%;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape)}
.clock.hot{border-color:#b3261e}.clock.hot .bar i{background:#b3261e}.clock.hot b{color:#b3261e}
.help{border:2px dashed var(--fg)}
.hl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.hl li{display:flex;gap:12px;align-items:flex-start}
.hl li>span:last-child{flex:1;display:block}.hl small{display:block;color:var(--muted)}
.demo{display:inline-block;width:78px;text-align:center;font-weight:700;border:2px solid var(--fg);border-radius:6px;padding:4px 6px;background:var(--surface);flex:none;font-size:14px}
.demo.w{border:0;border-bottom:2px dotted var(--fg);border-radius:0;background:none}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--tape);padding-left:10px}
.tl li b{font-family:var(--display);font-size:20px;min-width:54px}
.tl li>span{flex:1;display:block}.tl small{display:block;color:var(--muted);font-size:13px}
.tl li.unk{border-left-color:var(--line);color:var(--muted)}
.entog{font-weight:700;padding:10px 16px;min-height:44px}
img.av,span.av{width:104px;height:104px;border-radius:10px;object-fit:cover;object-position:50% 20%;border:2px solid var(--fg);flex:none}
span.av svg{width:100%;height:100%}
.sus img.av,.sus span.av{width:84px;height:84px}
.bubble .who img.av,.bubble .who span.av{width:76px;height:76px}
.sus{min-height:96px}
.fig.sm{max-width:none;width:100%}
.fig img,.fig svg{width:100%;height:auto;min-height:220px;object-fit:cover}
</style>

var VICTIM={name:'Rosa Lorusso',it:'68 anni · proprietaria del forno',en:'68 · owner of the bakery',face:{skin:'#e6b490',hair:'#c9c9c9',style:'bun',shirt:'#55616B',bg:'#e5e9ec'},bio:[`Rosa si alzava alle quattro ogni mattina da quarant'anni. Conosceva tutti: i clienti, i vicini, i corrieri. Era generosa con tutti, ma era anche una donna molto riservata: negli ultimi giorni portava un segreto pesante, e non lo aveva detto a nessuno.`,`Rosa got up at four every morning for forty years. She knew everyone: customers, neighbours, couriers. She was generous with everyone, but she was also a very private woman: in the last few days she was carrying a heavy secret, and had told nobody.`]};

 {k:'alibi',col:'alibi',it:`Dov'eri domenica mattina tra le 5:00 e le 6:00?`,en:'Where were you on Sunday morning between 5:00 and 6:00?'},

 {k:'key',col:'access',it:`Come si entra nel magazzino del forno?`,en:`How does one get into the bakery's storeroom?`},

var ANS={
 nicola:{
  alibi:[`Alle 5:30 ero al [mercato del pesce|fish market] di Molfetta, a quaranta minuti da Bari, e ho la [ricevuta|receipt] che lo dimostra: l'ho pagata alle 5:31. Come potevo essere qui nello stesso momento?`,`At 5:30 I was at the fish market in Molfetta, forty minutes from Bari, and I have the receipt that proves it: I paid it at 5:31. How could I be here at the same time?`],
  rosa:[`Mia madre era severa ma giusta. Sabato a cena, però, era strana: parlava poco, guardava Franco e continuava a girare il cucchiaino nel caffè. A un certo punto ha detto soltanto: «Domani le cose cambiano.» Non ho capito che cosa intendesse.`,`My mother was strict but fair. On Saturday at dinner, though, she was strange: she spoke little, looked at Franco and kept stirring the spoon in her coffee. At one point she only said: "Tomorrow things change." I did not understand what she meant.`],
  key:[`Dalla porta dietro, con la chiave: ce l'abbiamo mia madre, mia sorella, Franco e io. Io però dal magazzino non passo mai, entro sempre dal [negozio|shop]. Franco, invece, quando lavora presto entra quasi sempre da lì.`,`Through the back door, with the key: my mother, my sister, Franco and I have one. I never go through the storeroom, though, I always come in through the shop. Franco, on the other hand, almost always comes in that way when he works early.`],
  know:[`Alle 5:28 ho ricevuto un messaggio di mia madre: «Sto per ricevere una visita, ne parliamo dopo.» Mi hanno detto che aveva preparato anche il caffè: lo faceva sempre per Franco prima del turno, amaro e senza zucchero, mentre lei lo beve con due cucchiaini di zucchero.`,`At 5:28 I received a message from my mother: "I am about to receive a visit, we will talk later." They told me she had also made coffee: she always made it for Franco before his shift, bitter and without sugar, while she drinks hers with two spoonfuls of sugar.`]},
 marta:{
  alibi:[`Stavo correndo sul [Lungomare|seafront] con un amico, Luca. Abbiamo scattato due foto, una alle 5:15 e l'altra alle 5:45. Dal Lungomare al forno ci vogliono venti minuti, quindi non c'è modo che io sia stata qui.`,`I was running on the seafront with a friend, Luca. We took two photos, one at 5:15 and the other at 5:45. From the seafront to the bakery it takes twenty minutes, so there is no way I was here.`],
  rosa:[`Venerdì sera mia madre mi ha detto: «Ho saputo una cosa che non avrei mai voluto sapere. Devo essere sicura, prima di parlare.» Non ha voluto dirmi di più, ma aveva gli occhi rossi. Domenica volevo parlarle, e invece mi ha scritto di non venire prima delle otto.`,`On Friday evening my mother told me: "I found out something I never wanted to know. I must be sure before I speak." She did not want to tell me more, but her eyes were red. On Sunday I wanted to talk to her, and instead she wrote to me not to come before eight.`],
  key:[`Ho la chiave della porta dietro, come Nicola e Franco. Ma la serratura si chiude da fuori: chi ha una chiave può entrare e uscire senza lasciare tracce, e poi richiudere. E la porta, quando è arrivata la polizia, era chiusa.`,`I have the key to the back door, like Nicola and Franco. But the lock closes from outside: whoever has a key can come in and go out without leaving traces, and then lock up again. And the door, when the police arrived, was locked.`],
  know:[`Alle 5:28 mia madre mi ha mandato un [vocale|voice message]: «Oggi non venire prima delle otto.» Era calma, ma aveva la voce stanca, come dopo una notte in bianco. Ho riascoltato quel vocale centinaia di volte.`,`At 5:28 my mother sent me a voice message: "Don't come before eight today." She was calm, but her voice was tired, as after a sleepless night. I have listened to that message hundreds of times.`]},
 franco:{
  alibi:[`Alle 5:20 ero alla [stazione|station], perché aspettavo il treno di mia moglie Carmela, in arrivo da Lecce alle 5:55. C'è una telecamera che mi ha ripreso. Dalla stazione al forno ci vogliono sette minuti, ma io sono rimasto lì ad aspettare.`,`At 5:20 I was at the station, because I was waiting for the train of my wife Carmela, arriving from Lecce at 5:55. There is a camera that filmed me. From the station to the bakery it takes seven minutes, but I stayed there waiting.`],
  rosa:[`Rosa era per me come una sorella: lavoriamo insieme da trentacinque anni. Sabato era un po' fredda con me, ma credevo che fosse soltanto stanca. Perché dovrei averle fatto del male?`,`Rosa was like a sister to me: we have worked together for thirty-five years. On Saturday she was a little cold with me, but I thought she was only tired. Why would I have harmed her?`],
  key:[`Ho la chiave della porta dietro da trentacinque anni, come Rosa e i suoi figli. Ma questa mattina non l'ho usata: ero alla stazione, e la porta, a quanto dite, era chiusa.`,`I have had the key to the back door for thirty-five years, like Rosa and her children. But this morning I did not use it: I was at the station, and the door, from what you say, was locked.`],
  know:[`Niente di strano: ero alla stazione e ho aspettato. Il treno è arrivato in ritardo di qualche minuto, ho preso la valigia di Carmela e siamo tornati a casa. Soltanto più tardi ho saputo di Rosa.`,`Nothing strange: I was at the station and I waited. The train arrived a few minutes late, I took Carmela's suitcase and we went home. Only later did I hear about Rosa.`]},
 elena:{
  alibi:[`Dalle 5:00 alle 6:00 sono stata nel mio negozio a preparare le composizioni. Ero da sola, ma c'è la telecamera di sicurezza, che registra tutto, anche il cortile. Gianni, il [fornitore|supplier] dei fiori, è arrivato alle 6:00 in punto.`,`From 5:00 to 6:00 I was in my shop preparing the arrangements. I was alone, but there is the security camera, which records everything, even the courtyard. Gianni, the flower supplier, arrived at 6:00 sharp.`],
  rosa:[`Rosa era la mia [padrona di casa|landlady] e, almeno fino a poco tempo fa, anche una buona amica. Da qualche giorno, però, era fredda con me: sabato non mi ha nemmeno salutata. Non so che cosa avessi fatto di male, e ora non lo saprò mai.`,`Rosa was my landlady and, at least until a short time ago, also a good friend. For a few days, though, she had been cold with me: on Saturday she did not even greet me. I do not know what I had done wrong, and now I never will.`],
  key:[`Dal mio negozio non si può entrare nel forno, ve lo assicuro. Il [cortile|courtyard] è in comune, ma la porta del magazzino su quel lato si apre soltanto dall'interno. Per entrare da fuori serve la chiave della porta dietro, e io non ce l'ho.`,`You cannot get into the bakery from my shop, I assure you. The courtyard is shared, but the storeroom door on that side only opens from the inside. To get in from outside you need the key to the back door, and I do not have one.`],
  know:[`Dalla finestra del negozio vedo tutto il cortile, e alle 5:30 non c'era nessuno: la porta del magazzino è rimasta chiusa. Però ho sentito, dalla via dietro il forno, il rumore di una portiera e poi di una chiave nella serratura. Pensavo che fosse Rosa.`,`From the shop window I can see the whole courtyard, and at 5:30 there was nobody: the storeroom door stayed closed. But I heard, from the street behind the bakery, the sound of a car door and then of a key in the lock. I thought it was Rosa.`]},
 dario:{
  alibi:[`Il mio furgone è rimasto al [deposito|depot] fino alle 5:55, e lo conferma il [GPS|GPS]. Il deposito si trova a venti minuti dal forno. Ho consegnato farina e uova, come ogni domenica, e alle 6:30 ho trovato Rosa.`,`My van stayed at the depot until 5:55, and the GPS confirms it. The depot is twenty minutes from the bakery. I delivered flour and eggs, as every Sunday, and at 6:30 I found Rosa.`],
  rosa:[`Rosa mi trattava come un nipote: mi dava sempre un panino caldo. Sabato mi ha fatto una domanda strana: «Dario, tu hai mai visto Franco ed Elena parlare insieme nel cortile?» Le ho risposto di sì, spesso, e lei è diventata pallida.`,`Rosa treated me like a nephew: she always gave me a hot roll. On Saturday she asked me a strange question: "Dario, have you ever seen Franco and Elena talking together in the courtyard?" I answered yes, often, and she turned pale.`],
  key:[`Io entro dalla porta davanti. La porta dietro si apre con la chiave, e ce l'hanno Rosa, Nicola, Marta e Franco. Quella sul cortile, invece, si apre solo dall'interno: me l'ha spiegato Rosa il primo giorno.`,`I come in through the front door. The back door opens with a key, and Rosa, Nicola, Marta and Franco have one. The one onto the courtyard, on the other hand, only opens from the inside: Rosa explained it to me on the first day.`],
  know:[`Alle 6:30, quando ho trovato Rosa, sul bancone c'erano due tazzine di caffè: una piena e fredda, l'altra vuota. Mi è sembrato strano, perché Rosa beve il caffè soltanto con lo zucchero, e quella tazzina vuota aveva un fondo scuro, senza neanche un granello.`,`At 6:30, when I found Rosa, there were two coffee cups on the counter: one full and cold, the other empty. It seemed strange to me, because Rosa only drinks coffee with sugar, and that empty cup had a dark residue, without even a grain.`]},
 giulia:{
  alibi:[`Quella notte ho fatto il turno all'[ospedale|hospital], dalle 22:00 alle 6:00, e il [cartellino|time card] registra ogni mia uscita. Alle 5:30 stavo assistendo un paziente, insieme a due colleghi.`,`That night I worked the shift at the hospital, from 10:00 p.m. to 6:00 a.m., and the time card records every time I go out. At 5:30 I was assisting a patient, together with two colleagues.`],
  rosa:[`Rosa era la mia migliore amica da cinquant'anni. Venerdì sera ho dovuto dirle una cosa che le ha spezzato il cuore e che avrei voluto non sapere mai. Lei mi ha ringraziata e mi ha chiesto di non dire niente a nessuno.`,`Rosa was my best friend for fifty years. On Friday evening I had to tell her something that broke her heart and that I wish I had never known. She thanked me and asked me not to tell anyone.`],
  key:[`Io non ho nessuna chiave e non ho mai avuto bisogno di entrare dal retro: da cinquant'anni entro dal negozio, come una cliente. So soltanto che le chiavi della porta dietro le hanno la famiglia e Franco.`,`I have no key and I have never needed to go in at the back: for fifty years I have come in through the shop, like a customer. I only know that the family and Franco have the keys to the back door.`],
  know:[`Venerdì sera, tornando a casa, ho visto Franco ed Elena abbracciati nel cortile, vicino alla porta del magazzino. Non era un abbraccio tra amici, su questo non avevo dubbi. L'ho raccontato a Rosa quella stessa notte. Forse non avrei dovuto.`,`On Friday evening, going home, I saw Franco and Elena embracing in the courtyard, near the storeroom door. It was not an embrace between friends, I had no doubt about that. I told Rosa that same night. Perhaps I should not have.`]}
};

var STORY={
 it:[
  `Domenica, ore 4:30. A [Bari Vecchia|the old town of Bari] le strade sono ancora vuote. Nel forno Lorusso la luce è accesa, come ogni mattina: Rosa Lorusso, sessantotto anni, sta preparando il pane per tutto il quartiere. Questa mattina, però, è diversa: da sabato sera Rosa non è più la stessa.`,
  `Alle 6:30 il [fattorino|delivery man] Dario entra dal retro e trova Rosa ai piedi della [scala|ladder] del magazzino. È morta. Sembra un [incidente|accident]: una donna anziana, una scala, una caduta. Ma l'ispettrice Bruno non è convinta. «Rosa saliva su quella scala da quarant'anni», dice. «E sabato sera, a cena, era pallida e silenziosa: aveva scoperto qualcosa che l'aveva ferita nel profondo.»`,
  `Il medico conferma i sospetti: Rosa non è morta a causa della caduta. Qualcuno l'ha colpita alla testa e poi ha [sistemato|arranged] il corpo in modo da far pensare a un incidente. Non è stato un furto: nel forno non manca niente, a parte una teglia di ghisa.`,
  `Sono le 6:40. Il quartiere si sveglia e alle 9:00 il forno deve riaprire: dopo quell'ora il caso passa al procuratore. Sei persone avevano un legame stretto con Rosa e quasi tutte raccontano una storia credibile. Ma una di loro [mente|lies]. Voi siete gli assistenti dell'ispettrice: [interrogate|question] i sospettati, leggete i rapporti e trovate la contraddizione. Ogni domanda costa nove minuti: ne avete soltanto 14.`
 ],
 en:[
  `Sunday, 4:30 a.m. In the old town of Bari the streets are still empty. In the Lorusso bakery the light is on, as every morning: Rosa Lorusso, sixty-eight, is preparing bread for the whole neighbourhood. This morning, though, is different: since Saturday evening Rosa has not been herself.`,
  `At 6:30 the delivery man Dario comes in through the back and finds Rosa at the foot of the storeroom ladder. She is dead. It looks like an accident: an elderly woman, a ladder, a fall. But Inspector Bruno is not convinced. "Rosa had been climbing that ladder for forty years," she says. "And on Saturday evening, at dinner, she was pale and silent: she had found out something that had hurt her deeply."`,
  `The doctor confirms the suspicion: Rosa did not die from the fall. Someone hit her on the head, then arranged the body to make it look like an accident. It was not a theft: nothing is missing from the bakery, apart from a cast-iron tray.`,
  `It is 6:40. The neighbourhood is waking up and at 9:00 the bakery must reopen: after that the case goes to the prosecutor. Six people had a close bond with Rosa and almost all of them tell a believable story. But one of them is lying. You are the inspector's assistants: question the suspects, read the reports and find the contradiction. Every question costs nine minutes: you only have 14.`
 ]
};
var REPORTS=[
 {at:0,t:'Il ritrovamento',it:`Dario trova Rosa alle 6:30, ai piedi della [scala|ladder] del magazzino, e chiama la polizia alle 6:32. Sembra una caduta, ma alle 7:15 il medico dichiara: «Rosa è stata colpita alla testa con un oggetto pesante e piatto, tra le 5:28 e le 5:45. Poi qualcuno ha spostato il corpo sotto la scala.»`,en:`Dario finds Rosa at 6:30, at the foot of the storeroom ladder, and calls the police at 6:32. It looks like a fall, but at 7:15 the doctor declares: "Rosa was hit on the head with a heavy, flat object between 5:28 and 5:45. Then someone moved the body under the ladder."`,img:'piano'},
 {at:0,t:'Il telefono di Rosa',it:`Alle 5:28 Rosa ha mandato due messaggi: un [vocale|voice message] a Marta («Oggi non venire prima delle otto») e un testo a Nicola («Sto per ricevere una visita, ne parliamo dopo»). Dunque, alle 5:28 Rosa era ancora viva e stava aspettando una persona che conosceva bene.`,en:`At 5:28 Rosa sent two messages: a voice message to Marta ("Don't come before eight today") and a text to Nicola ("I am about to receive a visit, we will talk later"). So at 5:28 Rosa was still alive and was waiting for someone she knew well.`},
 {at:3,t:'Le due porte',it:`Il magazzino ha due porte. Quella dietro, sulla strada, si apre con la chiave: ce l'hanno Rosa, Nicola, Marta e Franco, e la serratura si chiude da fuori. Quella sul [cortile|courtyard], invece, non ha la chiave e si apre soltanto dall'interno. Quando è arrivata la polizia, la porta dietro era chiusa a chiave.`,en:`The storeroom has two doors. The back one, on the street, opens with a key: Rosa, Nicola, Marta and Franco have one, and the lock closes from outside. The one onto the courtyard, on the other hand, has no key and opens only from the inside. When the police arrived, the back door was locked.`,img:'doors'},
 {at:4,twist:true,t:'Nicola in questura',it:`La polizia scopre che Nicola ha quarantamila euro di debiti con un [usuraio|loan shark] e che sabato Rosa gli aveva detto di no a un nuovo prestito. Nicola viene portato in questura. «Abbiamo litigato, è vero, ma io non l'ho uccisa!» Nel quartiere tutti pensano che sia lui il colpevole: ha un movente, e Rosa gli ha scritto alle 5:28.`,en:`The police discover that Nicola has forty thousand euros of debt with a loan shark and that on Saturday Rosa had said no to a new loan. Nicola is taken to the police station. "We argued, it is true, but I did not kill her!" In the neighbourhood everyone thinks he is the culprit: he has a motive, and Rosa wrote to him at 5:28.`},
 {at:6,t:'Le prove digitali',it:`La telecamera del negozio di fiori mostra Elena al lavoro dalle 5:00 alle 6:00, e inquadra anche il cortile: nessuno è passato. Il [GPS|GPS] del furgone di Dario lo colloca al deposito fino alle 5:55. Il cartellino dell'ospedale conferma che Giulia era di turno. La ricevuta di Molfetta è delle 5:31 e le foto di Marta sono delle 5:15 e delle 5:45.`,en:`The flower shop camera shows Elena at work from 5:00 to 6:00, and it also films the courtyard: nobody went through. The GPS of Dario's van places him at the depot until 5:55. The hospital time card confirms that Giulia was on shift. The Molfetta receipt is from 5:31 and Marta's photos are from 5:15 and 5:45.`},
 {at:8,twist:true,t:'Il caffè amaro',it:`Colpo di scena! Il laboratorio analizza le due tazzine sul bancone. Quella piena e fredda è di Rosa: caffè con due cucchiaini di zucchero. Quella vuota non ha zucchero: Rosa aspettava una persona che beve il caffè [amaro|bitter], una persona di casa, con la chiave e con molta confidenza. Nicola viene [rilasciato|released]: la ricevuta di Molfetta lo scagiona. Il colpevole è ancora libero, e conosceva bene le abitudini di Rosa.`,en:`Plot twist! The laboratory analyses the two cups on the counter. The full, cold one is Rosa's: coffee with two spoonfuls of sugar. The empty one has no sugar: Rosa was waiting for a person who drinks bitter coffee, someone from the house, with a key and a lot of familiarity. Nicola is released: the Molfetta receipt clears him. The culprit is still free, and knew Rosa's habits well.`},
 {at:9,t:'La stazione',it:`La polizia controlla la telecamera della stazione di Bari. Franco appare alle 5:20, mentre guarda il tabellone, e di nuovo alle 5:52, mentre aspetta sul binario. Il treno da Lecce è arrivato alle 5:55. Tra le 5:20 e le 5:52 la telecamera non lo inquadra: sono trentadue minuti.`,en:`The police check the Bari station camera. Franco appears at 5:20, looking at the board, and again at 5:52, waiting on the platform. The train from Lecce arrived at 5:55. Between 5:20 and 5:52 the camera does not show him: that is thirty-two minutes.`},
 {at:12,t:'Messaggio di Bruno',it:`Siamo quasi alla fine. Dalla stazione al forno ci vogliono sette minuti in macchina. Pensate: quanto tempo serve per andare, parlare, colpire e tornare? Chi ha una chiave, un legame personale con Rosa e un buco nel suo alibi?`,en:`We are almost at the end. From the station to the bakery it takes seven minutes by car. Think: how long does it take to go, talk, strike and come back? Who has a key, a personal bond with Rosa and a gap in their alibi?`}
];
var HINT={it:`Aiuto di Bruno: non cercate il movente nei soldi, ma nei sentimenti. Poi confrontate gli alibi con i minuti tra le 5:28 e le 5:45: chi ha una prova che copre tutto il tempo e chi, invece, ha un buco che non sa spiegare?`,en:`Help from Bruno: do not look for the motive in money, but in feelings. Then compare the alibis with the minutes between 5:28 and 5:45: who has proof that covers the whole time and who, on the other hand, has a gap they cannot explain?`};

var SOL={
 it:[
  `L'ispettrice Bruno riunisce tutti nel forno e dice: «Questo non è un delitto per soldi, ma per amore e per vergogna. L'assassino non aveva un alibi falso: aveva un alibi con un buco.»`,
  `Per trent'anni Rosa e Franco hanno avuto una relazione segreta, mentre lui restava sposato con Carmela. Venerdì sera Giulia vede Franco abbracciare Elena nel cortile e lo racconta a Rosa. Rosa soffre, ma vuole essere sicura: il sabato chiede a Dario se ha mai visto i due parlare insieme e, a cena, osserva Franco in silenzio.`,
  `Domenica, alle 5:28, Rosa scrive a Marta e a Nicola che sta per ricevere una visita e prepara due caffè: uno dolce per sé e uno amaro per Franco. Franco lascia la stazione alle 5:21 e raggiunge il forno in sette minuti. Entra dalla porta dietro con la sua chiave e Rosa gli dice che ha scoperto tutto e che racconterà ogni cosa a Carmela.`,
  `Nella discussione Franco perde il controllo: colpisce Rosa con una pesante [teglia|baking tray] di ghisa e poi sposta il corpo sotto la scala per far pensare a un incidente. Beve il caffè amaro, richiude la porta a chiave e torna in macchina: alle 5:52 è di nuovo in stazione, ad aspettare il treno di sua moglie.`,
  `Gli altri hanno alibi solidi: Nicola (la ricevuta di Molfetta delle 5:31), Marta (le foto sul Lungomare delle 5:15 e delle 5:45), Elena (la telecamera del negozio), Dario (il GPS) e Giulia (il cartellino dell'ospedale). Franco, invece, appare alla stazione alle 5:20 e alle 5:52: in mezzo ci sono trentadue minuti e il forno è a sette minuti di macchina. Bastavano. Inoltre, la tazzina vuota senza zucchero era la sua.`,
  `Franco si siede e dice piano: «Voleva dire tutto a Carmela. Trentacinque anni... e in un attimo ho perso la testa.»`
 ],
 en:[
  `Inspector Bruno gathers everyone in the bakery and says: "This is not a crime for money, but for love and shame. The murderer did not have a false alibi: he had an alibi with a gap."`,
  `For thirty years Rosa and Franco had a secret relationship, while he stayed married to Carmela. On Friday evening Giulia sees Franco embracing Elena in the courtyard and tells Rosa. Rosa suffers, but she wants to be sure: on Saturday she asks Dario if he has ever seen the two talking together and, at dinner, she watches Franco in silence.`,
  `On Sunday, at 5:28, Rosa writes to Marta and Nicola that she is about to receive a visit and makes two coffees: a sweet one for herself and a bitter one for Franco. Franco leaves the station at 5:21 and reaches the bakery in seven minutes. He comes in through the back door with his key and Rosa tells him she has found out everything and that she will tell Carmela all.`,
  `In the argument Franco loses control: he hits Rosa with a heavy cast-iron tray and then moves the body under the ladder to suggest an accident. He drinks the bitter coffee, locks the door again and gets back in the car: at 5:52 he is at the station again, waiting for his wife's train.`,
  `The others have solid alibis: Nicola (the Molfetta receipt of 5:31), Marta (the seafront photos of 5:15 and 5:45), Elena (the shop camera), Dario (the GPS) and Giulia (the hospital time card). Franco, instead, appears at the station at 5:20 and 5:52: in between there are thirty-two minutes and the bakery is seven minutes away by car. They were enough. Besides, the empty cup without sugar was his.`,
  `Franco sits down and says quietly: "She wanted to tell Carmela everything. Thirty-five years... and in a moment I lost my head."`
 ]
};

var TEACHER=`Franco Mele. Movente passionale: Rosa e Franco erano amanti da decenni; Giulia vede Franco ed Elena abbracciati e lo dice a Rosa, che vuole affrontarlo e dirlo alla moglie Carmela. Rosa è viva alle 5:28 e aspetta una visita (due caffè: uno dolce, uno amaro: il caffè amaro è di Franco). Franco ha un buco nell'alibi: telecamera della stazione alle 5:20 e 5:52, stazione-forno 7 minuti. Ha la chiave della porta dietro (si richiude da fuori). Alibi degli altri: Nicola (Molfetta 5:31), Marta (foto 5:15 e 5:45), Elena (telecamera negozio), Dario (GPS), Giulia (turno in ospedale).`;

var EPI={title:'Il quaderno nero',teaser:['Il caso è chiuso. Ma nel cassetto del forno c\'è un quaderno che nessuno ha ancora aperto.','The case is closed. But in the bakery drawer there is a notebook that nobody has opened yet.'],
 it:[
  `Franco viene portato in questura. Nel forno resta un silenzio pesante: Marta piange, Nicola si siede sullo sgabello e Carmela, la moglie di Franco, appena scesa dal treno da Lecce, resta ferma sulla porta senza capire che cosa sia successo.`,
  `Poi l'ispettrice Bruno apre il cassetto sotto il bancone e tira fuori un quaderno nero. Sono trentacinque anni di appunti di Rosa: date, [ricette|recipes] e piccole frasi d'amore per Franco. Rosa e Franco erano innamorati in segreto fin dal 1990, quando lui era già sposato.`,
  `Ecco il segreto: l'ultima pagina è datata sabato notte. Rosa scrive: «Domani gli dico di scegliere: Elena o Carmela. Se sceglie Elena, lo lascio andare e resto sola. Non voglio vendetta, voglio soltanto la verità.» Non voleva rovinarlo: voleva guardarlo negli occhi.`,
  `Qualche mese dopo il forno riapre con il nome «Forno Rosa»: Marta e Nicola lo gestiscono insieme. Ogni mattina, alle 5:30, una signora anziana compra un filone ancora caldo e lo paga con una moneta da due euro: è Carmela. Non dice mai niente, ma lascia sempre un piccolo fiore di campo sul bancone.`
 ],
 en:[
  `Franco is taken to the police station. A heavy silence stays in the bakery: Marta cries, Nicola sits down on the stool and Carmela, Franco's wife, who has just got off the train from Lecce, stands still at the door without understanding what has happened.`,
  `Then Inspector Bruno opens the drawer under the counter and pulls out a black notebook. It is thirty-five years of Rosa's notes: dates, recipes and little love phrases for Franco. Rosa and Franco had been secretly in love since 1990, when he was already married.`,
  `Here is the secret: the last page is dated Saturday night. Rosa writes: "Tomorrow I will tell him to choose: Elena or Carmela. If he chooses Elena, I will let him go and stay alone. I do not want revenge, I only want the truth." She did not want to ruin him: she wanted to look him in the eye.`,
  `A few months later the bakery reopens under the name "Forno Rosa": Marta and Nicola run it together. Every morning, at 5:30, an elderly lady buys a loaf still warm and pays with a two-euro coin: it is Carmela. She never says anything, but she always leaves a small wildflower on the counter.`
 ]};

    if(nm.length)h+='<div class="msg" role="status"><span lang="it"><b>Nuovo rapporto</b> '+esc(GAME.fromIt)+'!</span><span class="e" lang="en">New report '+esc(GAME.fromEn)+'!</span></div><button type="button" class="btn tape" data-act="tab" data-v="caso">Leggi il rapporto<small>Read the report</small></button>';
    if(S.n>1&&last.fresh)h+='<div class="turn"><span lang="it">Passa il telefono a <b>'+esc(pname(S.turn%S.n))+'</b></span><small lang="en">Pass the phone to the next player</small></div>';
    if(left()>0)h+='<button type="button" class="btn" data-act="more" data-v="'+last.s+'">Altra domanda a '+esc(c.name.split(' ')[0])+'<small>Another question</small></button><button type="button" class="btn ghost" data-act="back">Altri sospettati<small>Other suspects</small></button>';
    else h+='<button type="button" class="btn tape" data-act="tab" data-v="accusa">Vai all\'accusa<small>Go to the accusation</small></button>';
    return h;
  }
  if(sus){
    var c2=castById(sus);
    h+='<div class="card"><div class="who">'+av(c2.face)+'<div><b>'+esc(c2.name)+'</b><span lang="it">'+c2.age+' anni · '+esc(c2.role)+'</span><small lang="en" style="display:block">'+c2.age+' · '+esc(c2.roleEn)+'</small></div></div><p class="it" lang="it">'+mk(c2.desc)+'</p><div class="gloss" hidden></div></div>';
    h+=turnBanner()+'<div class="q" lang="it">Scegli una domanda<small lang="en">Choose a question ('+left()+' left)</small></div><div class="stack">';
    QS.forEach(function(q){
      var done=S.asked[sus]&&S.asked[sus][q.k];
      h+='<button type="button" class="qbtn'+(done?' done':'')+'" data-act="'+(done?'reread':'ask')+'" data-s="'+sus+'" data-v="'+q.k+'"'+((!done&&left()===0)?' disabled':'')+'><span lang="it">'+esc(q.it)+'</span><small lang="en">'+esc(q.en)+(done?' · già chiesta / already asked':'')+'</small></button>';
    });
    h+='</div><button type="button" class="btn ghost" data-act="back">Altri sospettati<small>Other suspects</small></button>';
    return h;
  }
  h+=turnBanner()+'<p class="it" lang="it">Tocca un sospettato.</p><small lang="en">Tap a suspect.</small><div class="stack">';
  CAST.forEach(function(c){
    var n=S.asked[c.id]?Object.keys(S.asked[c.id]).length:0;
    h+='<button type="button" class="sus" data-act="sus" data-v="'+c.id+'">'+av(c.face)+'<span class="sn"><b>'+esc(c.name)+'</b><span lang="it">'+esc(c.role)+'</span><small lang="en">'+esc(c.roleEn)+'</small></span><span class="cnt2">'+n+'/4</span></button>';
  });
  h+='</div>';
  if(S.hint)h+=cardHtml('hint',GAME.helpTag,'',HINT.it,HINT.en);
  else if(left()>=3)h+='<button type="button" class="btn ghost" data-act="hint">'+esc(GAME.helpBtn[0])+'<small>'+esc(GAME.helpBtn[1])+' · costs 2 questions</small></button>';
  return h;
}
function viewNote(){
  var h='<h2>Il taccuino</h2><p lang="it">Tocca una casella: <b>?</b> → <b>Sì</b> → <b>No</b>.</p><small lang="en">Tap a box: ? (not sure) → Yes → No.</small>';
  h+='<div class="tw"><table class="nb"><thead><tr><th scope="col"><span lang="it">Sospetto</span><small lang="en">Suspect</small></th>'+COLS.map(function(c){return '<th scope="col"><span lang="it">'+esc(c.it)+'</span><small lang="en">'+esc(c.en)+'</small></th>'}).join('')+'</tr></thead><tbody>';
  CAST.forEach(function(c){
    h+='<tr><th scope="row">'+esc(c.name.split(' ')[0])+'<small>'+esc(c.roleEn)+'</small></th>';
    COLS.forEach(function(col){var v=(S.marks[c.id]&&S.marks[c.id][col.k])||'';
      h+='<td><button type="button" class="cell '+v+'" data-act="mark" data-s="'+c.id+'" data-k="'+col.k+'" aria-label="'+esc(c.name+', '+col.it)+': '+(v==='y'?'Sì':v==='n'?'No':'?')+'">'+(v==='y'?'Sì':v==='n'?'No':'?')+'</button></td>'});
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="card"><p class="it" lang="it">Esempio: Nicola ha una chiave? Se sì, tocca <b>Sì</b> nella colonna Chiave.</p><p class="en" lang="en">Example: does Nicola have a key? If yes, tap Yes in the Key column.</p></div>';
  h+=timelineHtml();
  h+='<h3 lang="it" style="margin-top:6px">I verbali (risposte dei sospettati)</h3>';
  var any=false;
  CAST.forEach(function(c){
    var a=S.asked[c.id];if(!a||!Object.keys(a).length)return;any=true;
    h+='<details class="old"><summary>'+esc(c.name)+' · '+Object.keys(a).length+'/4</summary><div class="stack" style="padding:12px 14px">';
    QS.forEach(function(q){if(a[q.k]){var an=ANS[c.id][q.k];h+='<div><p class="it" lang="it"><b>'+esc(q.it)+'</b></p><p class="it" lang="it">«'+mk(an[0])+'»</p><div class="gloss" hidden></div><button type="button" class="entog" data-act="enq" aria-expanded="false">English</button><p class="en" lang="en" hidden>'+esc(an[1])+'</p></div>'}});
    h+='</div></details>';
  });
  if(!any)h+='<div class="card"><p class="it" lang="it">Non ci sono ancora verbali. Interrogate un sospettato!</p><p class="en" lang="en">No records yet. Question a suspect!</p></div>';
  h+=cb('resetnb','x','Cancella le caselle','Clear the boxes');
  return h;
}
function ratingHtml(){
  if(!S.solved)return '';
  var sc=S.used+3*(S.att||0),stars=sc<=10?3:(sc<=14?2:1);
  var L={3:['Investigatore Maestro','Master detective'],2:['Investigatore Esperto','Expert detective'],1:['Investigatore Junior','Junior detective']}[stars];
  var s='';for(var i=0;i<3;i++)s+=i<stars?'★':'☆';
  return '<div class="card"><div class="card-h"><span class="tag">Il vostro grado</span></div><div><span class="stars" aria-label="'+stars+' / 3">'+s+'</span></div><p class="it" lang="it"><b>'+L[0]+'</b></p><p class="en" lang="en">'+L[1]+'</p><small lang="en">Questions used: '+S.used+' · wrong accusations: '+(S.att||0)+'</small></div>';
}
function solDone(){return solStep>=SOL.it.length}
function solBlock(){
  var n=SOL.it.length;if(solStep<1)solStep=1;var k=Math.min(solStep,n);
  var h=cardHtml('sol',k<n?'Il momento della verità':'La verità','',SOL.it.slice(0,k),SOL.en.slice(0,k));
  if(k<n)return h+'<button type="button" class="btn tape" data-act="solnext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  var c=castById(CULPRIT);
  h+='<div class="card"><div class="who">'+av(c.face)+'<div><b>'+esc(c.name)+'</b><span lang="it">'+esc(c.role)+'</span></div></div><span class="stamp">Colpevole</span></div>';
  return h+ratingHtml();
}
function epiBlock(){
  var n=EPI.it.length,h='';
  if(epiStep<1)return '<div class="card" style="border-style:dashed"><div class="card-h"><span class="tag">Finale nascosto</span></div><p class="it" lang="it"><b>'+esc(EPI.teaser[0])+'</b></p><p class="en" lang="en">'+esc(EPI.teaser[1])+'</p></div><button type="button" class="btn tape" data-act="epistart">Leggi l\'epilogo<small>Read the epilogue</small></button>';
  var k=Math.min(epiStep,n);
  h+='<h2>Epilogo</h2>'+cardHtml('epi',k<n?'Dopo l\'arresto':'Il segreto',EPI.title,EPI.it.slice(0,k),EPI.en.slice(0,k));
  if(k<n)h+='<button type="button" class="btn tape" data-act="epinext">Continua<small>Continue ('+k+'/'+n+')</small></button>';
  else h+='<span class="stamp">Fine</span>';
  return h;
}
function viewAccusa(){
  var h='';
  if(S.solved||S.revealed){
    h+='<span class="stamp">Caso chiuso</span><h2>La soluzione</h2>'+solBlock();
    if(solDone()){
      h+='<div class="card"><div class="card-h"><span class="tag">Le prove</span></div><ol class="steps">'+PROOFS.filter(function(p){return p.ok}).map(function(p){return '<li>'+esc(p.it)+'<span lang="en">'+esc(p.en)+'</span></li>'}).join('')+'</ol></div>';
      h+=cardHtml('red','Le false piste','',RED.it,RED.en);
      h+=epiBlock();
      if(epiStep>=EPI.it.length)h+='<button type="button" class="btn tape" data-act="again">Nuova partita<small>New game</small></button>';
    }
    return h;
  }
  h+='<h2>Accusa</h2><p class="it" lang="it">'+esc(GAME.q[0])+' Scegliete una persona e tre prove.</p><p class="en" lang="en">'+esc(GAME.q[1])+' Choose one person and three proofs.</p>';
  h+='<fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">1. Il colpevole<small lang="en">The culprit</small></legend>';
  CAST.forEach(function(c){h+='<label class="opt"><input type="radio" name="sus" data-act="pick" value="'+c.id+'"'+(selSus===c.id?' checked':'')+'><span><b>'+esc(c.name)+'</b><span class="e">'+esc(c.roleEn)+'</span></span></label>'});
  h+='</fieldset><fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">2. Tre prove<small lang="en">Three proofs</small></legend>';
  PROOFS.forEach(function(p){h+='<label class="opt"><input type="checkbox" data-act="proof" value="'+p.k+'"'+(selProofs[p.k]?' checked':'')+'><span lang="it">'+esc(p.it)+'<span class="e" lang="en">'+esc(p.en)+'</span></span></label>'});
  h+='</fieldset><div id="res" aria-live="polite">'+resMsg+'</div><button type="button" class="btn tape" data-act="accuse">Accuso!<small>I accuse!</small></button>';
  if(S.att>=2)h+=cb('reveal','x','Mostra la soluzione','Show the solution');
  return h;
}
function render(){
  var body=!S.started?viewSetup():({caso:viewCaso,interroga:viewInterroga,taccuino:viewNote,accusa:viewAccusa})[tab]();
  $('#app').innerHTML=header()+'<main class="wrap main">'+body+'</main>'+(S.started?nav():'');
}
function go(t){tab=t;pend='';sus='';last=null;render();window.scrollTo(0,0)}

function glossary(){
  var map={},texts=[].concat(STORY.it,SOL.it,EPI.it);
  REPORTS.forEach(function(r){texts.push(r.it)});
  CAST.forEach(function(c){texts.push(c.desc)});TIMELINE.forEach(function(e){texts.push(e.it)});if(VICTIM.bio)texts.push(VICTIM.bio[0]);
  Object.keys(ANS).forEach(function(id){Object.keys(ANS[id]).forEach(function(k){texts.push(ANS[id][k][0])})});
  texts.forEach(function(t){var re=/\[([^|\]]+)\|([^\]]+)\]/g,m;while((m=re.exec(t))){var key=m[1].toLowerCase();if(!map[key])map[key]=[m[1],m[2]]}});
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,'it')}).map(function(k){return map[k]});
}
function glList(q){
  q=q.toLowerCase();
  var items=gl.filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>-1||p[1].toLowerCase().indexOf(q)>-1});
  if(!items.length)return '<p>Nessun risultato / No results</p>';
  return items.map(function(p){return '<div class="gl-item"><b lang="it">'+esc(p[0])+'</b><span lang="en">'+esc(p[1])+'</span></div>'}).join('');
}
function openGlossary(){
  if(!gl)gl=glossary();
  var el=$('#gl');
  el.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><h2>Parole</h2><button type="button" class="pill" data-act="closeglos">Chiudi</button></div><small>Glossario italiano → inglese / Italian → English glossary</small><input type="search" id="gs" placeholder="Cerca / Search" aria-label="Cerca / Search"><div id="gl-list">'+glList('')+'</div></div>';
  el.hidden=false;document.body.style.overflow='hidden';
}
var ITV=null,ITV_TRIED=false;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    var it=vs.filter(function(v){return /^it([-_]|$)/i.test(v.lang)||/ital/i.test(v.name)});
    if(!it.length)return null;
    function sc(v){var n=v.name||'',x=0;if(/^it[-_]IT/i.test(v.lang))x+=3;if(/premium|enhanced|natural|neural|google|siri/i.test(n))x+=4;if(/alice|federica|elsa|paola|luca|isabella|diego|emma|giorgio/i.test(n))x+=2;if(v.localService===false)x+=1;return x}
    it.sort(function(p,q){return sc(q)-sc(p)});
    return it[0];
  }catch(e){return null}
}
function refreshSay(){ITV=TTS?pickVoice():null;SAY=ITV?SAYB:''}
refreshSay();
if(TTS){try{window.speechSynthesis.onvoiceschanged=function(){var had=!!SAY;refreshSay();if(!!SAY!==had){var ap=document.getElementById('app');if(ap&&ap.innerHTML)render()}};if(window.speechSynthesis.getVoices)window.speechSynthesis.getVoices()}catch(e){}}
function prepSpeech(t){
  return t.replace(/[«»“”"]/g,'').replace(/\s+/g,' ')
   .replace(/\b(\d{1,2}):00\b/g,'$1 in punto')
   .replace(/\b(\d{1,2}):(\d{2})\b/g,'$1 e $2')
   .replace(/\s*[—–]\s*/g,', ').replace(/…/g,'.').trim();
}
function chunks(t){
  var parts=t.match(/[^.!?;:]+[.!?;:]*/g)||[t],out=[],cur='';
  parts.forEach(function(p){if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.map(function(x){return x.trim()}).filter(Boolean);
}
function speak(card,btn){
  if(!TTS)return;
  try{
    var ss=window.speechSynthesis;
    if(btn.getAttribute('aria-pressed')==='true'){ss.cancel();btn.setAttribute('aria-pressed','false');return}
    ss.cancel();$$('.ico[aria-pressed="true"]').forEach(function(b){b.setAttribute('aria-pressed','false')});
    var txt=prepSpeech($$('.it',card).map(function(n){return n.textContent}).join(' '));
    var v=ITV||pickVoice();ITV=v;
    var gl=$('.gloss',card);
    if(!v&&gl){gl.innerHTML='Voce italiana non trovata sul telefono. Nelle impostazioni, scarica o scegli una voce italiana (Sintesi vocale).<br><i>Italian voice not found on your phone. In Settings, download or choose an Italian voice (Text-to-speech).</i>';gl.hidden=false}
    var list=chunks(txt),i=0;
    btn.setAttribute('aria-pressed','true');
    (function next(){
      if(i>=list.length||btn.getAttribute('aria-pressed')!=='true'){btn.setAttribute('aria-pressed','false');return}
      var u=new SpeechSynthesisUtterance(list[i++]);
      u.lang=v?v.lang.replace('_','-'):'it-IT';if(v)u.voice=v;u.rate=0.92;u.pitch=1;
      u.onend=next;u.onerror=function(){btn.setAttribute('aria-pressed','false')};
      ss.speak(u);
    })();
  }catch(e){btn.setAttribute('aria-pressed','false')}
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  var keep=(a==='restart'||a==='resetnb'||a==='reveal'||a==='teacher');
  if(!keep&&pend)pend='';
  switch(a){
   case 'n':S.n=+v;save();render();break;
   case 'start':S.started=true;S.turn=0;tab='caso';save();render();window.scrollTo(0,0);break;
   case 'tab':go(v);break;
   case 'en':S.en=!S.en;save();render();break;
   case 'glos':openGlossary();break;
   case 'closeglos':$('#gl').hidden=true;document.body.style.overflow='';break;
   case 'w':var cd=b.closest('.card,details'),g=cd&&$('.gloss',cd);if(g){g.textContent=b.textContent+' = '+b.getAttribute('data-t');g.hidden=false}break;
   case 'ent':var c2=b.closest('.card'),id=c2.getAttribute('data-id'),en=$('.en',c2);var op=en.hidden;en.hidden=!op;openEn[id]=op;b.setAttribute('aria-expanded',op?'true':'false');break;
   case 'enq':var nx=b.nextElementSibling;nx.hidden=!nx.hidden;b.setAttribute('aria-expanded',nx.hidden?'false':'true');break;
   case 'say':speak(b.closest('.card'),b);break;
   case 'sus':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'more':sus=v;last=null;render();window.scrollTo(0,0);break;
   case 'back':sus='';last=null;render();window.scrollTo(0,0);break;
   case 'ask':
     var s=b.getAttribute('data-s');
     if(left()<=0)break;
     S.asked[s]=S.asked[s]||{};S.asked[s][v]=true;S.used++;S.turn=(S.turn+1)%S.n;
     last={s:s,k:v,fresh:true};save();render();window.scrollTo(0,0);break;
   case 'reread':last={s:b.getAttribute('data-s'),k:v,fresh:false};render();window.scrollTo(0,0);break;
   case 'hint':if(!S.hint&&left()>=3){S.hint=true;S.used+=2;save();render();window.scrollTo(0,0)}break;
   case 'mark':
     var ss=b.getAttribute('data-s'),kk=b.getAttribute('data-k');S.marks[ss]=S.marks[ss]||{};
     var cur=S.marks[ss][kk]||'',nv=cur===''?'y':cur==='y'?'n':'';S.marks[ss][kk]=nv;save();
     b.className='cell '+nv;b.textContent=nv==='y'?'Sì':nv==='n'?'No':'?';break;
   case 'resetnb':if(pend==='resetnbx'){S.marks={};pend='';save();render()}else{pend='resetnbx';render()}break;
   case 'accuse':doAccuse();break;
   case 'reveal':if(pend==='revealx'){S.revealed=true;solStep=1;pend='';save();render();window.scrollTo(0,0)}else{pend='revealx';render()}break;
   case 'epistart':epiStep=1;render();break;
   case 'epinext':epiStep++;render();var nb2=$('[data-act=epinext]');if(nb2)nb2.scrollIntoView({block:'center'});break;
   case 'solnext':solStep++;render();var nb=$('[data-act=solnext]');if(nb)nb.scrollIntoView({block:'center'});else window.scrollTo(0,0);break;
   case 'restart':if(pend==='restartx'){newGame();pend=''}else{pend='restartx';render()}break;
   case 'again':newGame();break;
   case 'teacher':if(pend==='teacherx'){teacherOpen=!teacherOpen;pend=''}else{pend='teacherx';if(teacherOpen)teacherOpen=false}render();break;
  }
});
function newGame(){
  S.started=false;S.turn=0;S.used=0;S.asked={};S.seen=0;S.marks={};S.att=0;S.solved=false;S.revealed=false;S.hint=false;
  tab='caso';sus='';last=null;selSus='';selProofs={};resMsg='';solStep=1;epiStep=0;openEn={};save();render();window.scrollTo(0,0);
}
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-act');
  if(a==='pick')selSus=t.value;
  if(a==='proof')selProofs[t.value]=t.checked;
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.id==='gs'&&gl)$('#gl-list').innerHTML=glList(t.value);
  if(t.id.indexOf('pn')===0&&/^pn\d+$/.test(t.id)){S.names[+t.id.slice(2)]=t.value;save()}
});
function doAccuse(){
  var picked=Object.keys(selProofs).filter(function(k){return selProofs[k]});
  var box=$('#res');
  if(!selSus||picked.length!==3){resMsg='<div class="msg" role="alert"><span lang="it">Scegliete una persona e tre prove.</span><span class="e" lang="en">Choose one person and three proofs.</span></div>';box.innerHTML=resMsg;return}
  var ok=picked.every(function(k){return PROOFS.filter(function(p){return p.k===k})[0].ok});
  if(selSus===CULPRIT&&ok){S.solved=true;solStep=1;save();render();window.scrollTo(0,0);return}
  S.att=(S.att||0)+1;save();
  resMsg='<div class="msg" role="alert"><span lang="it">Non ancora. Il colpevole o le prove non sono giusti. Guardate il taccuino e i verbali.</span><span class="e" lang="en">Not yet. The culprit or the proofs are not right. Look at the notebook and the records.</span></div>';
  render();var r=$('#res');if(r)r.scrollIntoView({block:'center'});
}
render();

})();
</script>
</body></html>
