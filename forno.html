<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Delitto al Forno</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout concept: a police case file on a phone. Sticky header with hazard tape, one column of evidence cards, fixed bottom tab bar. */
:root{
  --bg:#E6E9E7; --surface:#F7F8F6; --fg:#15202B; --muted:#4F5C67; --line:#C5CCC8;
  --tape:#F2C300; --on-tape:#15202B; --stamp:#B3261E; --sea:#0A5A70; --yes:#1B6E45; --no:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
    --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#192027; --fg:#E8ECEA; --muted:#9BA8B2; --line:#2B353E;
  --stamp:#FF7A6E; --sea:#6CC6DC; --yes:#5FD08F; --no:#FF7A6E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0}
small{font-size:13px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#15202B 14px 28px)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{font-size:28px;letter-spacing:.05em}
.brand span{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{min-height:40px;min-width:44px;padding:0 12px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:14px}
.pill[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}

/* layout */
.main{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;background:var(--tape);color:var(--on-tape);padding:2px 8px;border-radius:2px;text-transform:uppercase}
.it{font-size:19px;line-height:1.55;overflow-wrap:anywhere}
.en{color:var(--sea);font-size:16px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.entog{align-self:flex-start;min-height:36px;padding:0 12px;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:4px;font-size:14px;font-weight:700}
.entog[aria-expanded="true"]{background:var(--sea);color:var(--bg)}
.w{padding:0;border:0;border-bottom:2px dotted var(--sea);background:none;font:inherit;line-height:inherit;color:inherit;cursor:help}
.gloss{background:var(--tape);color:var(--on-tape);font-weight:700;padding:6px 10px;border-radius:3px;font-size:16px;align-self:flex-start}
.ico{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center;flex:none}
.ico[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.ico svg{width:22px;height:22px}

/* buttons */
.btn{min-height:50px;padding:0 20px;border:2px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:4px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn.tape{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-family:var(--body);font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:inherit;opacity:.85}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:15px;align-self:flex-start;min-height:44px}

/* setup */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-height:48px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[disabled]{opacity:.3;cursor:not-allowed}
.q{font-weight:700;font-size:18px}
.q small{display:block;font-weight:400}

/* rounds */
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rd{min-height:56px;border:2px solid var(--fg);background:transparent;border-radius:4px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.rd[aria-pressed="true"]{background:var(--tape);color:var(--on-tape);border-color:var(--on-tape)}
.rd[aria-disabled="true"]{opacity:.45;border-style:dashed}
.rd svg{width:16px;height:16px;flex:none}
.task{border-left:6px solid var(--tape);padding-left:12px}
.ask{background:transparent;border:2px dashed var(--muted)}

/* cast */
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:24px;flex:none}
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.who span{font-size:15px;color:var(--muted)}

/* notebook */
.tw{overflow-x:auto}
table.nb{border-collapse:collapse;width:100%;min-width:340px}
.nb th,.nb td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.nb thead th{font-family:var(--mono);font-size:12px;text-transform:uppercase;vertical-align:bottom}
.nb thead th small{display:block;text-transform:none;font-family:var(--body)}
.nb tbody th{text-align:left;font-weight:700;font-size:16px;padding-right:8px}
.nb tbody th small{display:block;font-weight:400}
.cell{width:100%;min-width:52px;min-height:48px;border:2px solid var(--line);background:transparent;border-radius:4px;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted)}
.cell.y{border-color:var(--yes);color:var(--yes);background:color-mix(in srgb,var(--yes) 14%,transparent)}
.cell.n{border-color:var(--no);color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}

/* accuse */
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);min-height:56px}
.opt input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--sea);flex:none}
.opt:has(input:checked){border-color:var(--fg)}
.opt .e{display:block;color:var(--sea);font-size:15px}
.msg{padding:12px 14px;border-radius:4px;background:var(--surface);border:2px solid var(--stamp)}
.msg .e{display:block;color:var(--sea);font-size:15px}
.stamp{display:inline-block;align-self:flex-start;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;padding:2px 14px;transform:rotate(-5deg);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:st .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes st{from{transform:rotate(-14deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
}
ul.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.steps li span{display:block;color:var(--sea);font-size:15px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--fg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:58px;border:0;background:none;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-top:5px solid transparent;margin-top:-2px;padding:4px 2px}
.tab small{display:block;font-family:var(--body);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0}
.tab[aria-current="page"]{border-top-color:var(--tape);background:color-mix(in srgb,var(--tape) 16%,transparent)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.ov input[type=search]{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%}
.gl-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{overflow-wrap:anywhere}
.gl-item span{color:var(--sea);text-align:right;overflow-wrap:anywhere}
table.tt{border-collapse:collapse;width:100%;font-size:15px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tt td.c{font-family:var(--mono);text-align:center}

.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--tape)}
.turn{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:4px;display:flex;flex-direction:column}
.turn small{color:inherit;opacity:.85}
.txt{min-height:48px;padding:0 12px;border:2px solid var(--fg);border-radius:4px;background:var(--surface);color:var(--fg);font:inherit;width:100%;min-width:0}
textarea.txt{min-height:96px;padding:10px 12px;resize:vertical}
details.old{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.old summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;cursor:pointer}
details.old .card{border:0;border-top:1px solid var(--line);border-radius:0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig img,.fig svg{display:block;width:100%;max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:#fff}
.fig.sm{max-width:260px}
.fig figcaption{font-size:14px;color:var(--muted)}
img.av{object-fit:cover;object-position:top center;background:#cde;border:2px solid var(--line)}
span.av{background:none}
</style>

<div id="app"></div>
<div id="gl" class="ov" hidden></div>

<script>

 if(m.face)return '<span class="av" style="background:none;overflow:hidden" aria-hidden="true">'+faceSVG(m.face,52)+'</span>';
 return '<div class="av" style="background:'+m.color+'" aria-hidden="true">'+m.init+'</div>'}
function clueImg(id){return (typeof CLUE_IMG!=='undefined'&&CLUE_IMG[id])||''}

/* ---------- state ---------- */
var KEY=META.key;
var S={mode:'split',deck:null,n:1,me:1,started:false,unlocked:1,en:false,marks:{},attempts:0,solved:false,revealed:false};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o){S[k]=o[k]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var tab='caso',round=2,pend='',openEn={},selSus='',selProofs={},hintShown=false,teacherOpen=false,resHtml='';

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mk(s){return esc(s).replace(/\[([^|\]]+)\|([^\]]+)\]/g,function(m,a,b){return '<button type="button" class="w" data-act="w" data-t="'+b+'">'+a+'</button>'})}
function plain(s){return s.replace(/\[([^|\]]+)\|([^\]]+)\]/g,'$1')}
function owner(i){return (i%S.n)+1}
function myClues(r){var out=[];CLUES.forEach(function(c,i){if(c.r===r&&owner(i)===S.me)out.push(c)});return out}
function cardHtml(id,tag,title,it,en,img){
  var open=S.en||openEn[id];
  var its=(Array.isArray(it)?it:[it]).map(function(p){return '<p class="it" lang="it">'+mk(p)+'</p>'}).join('');
  var ens=(Array.isArray(en)?en:[en]).map(function(p){return '<p lang="en">'+esc(p)+'</p>'}).join('');
  return '<article class="card" data-id="'+id+'"><div class="card-h"><span class="tag">'+tag+'</span>'+
    (TTS?'<button type="button" class="ico" data-act="say" aria-pressed="false" aria-label="Ascolta / Listen">'+SPK+'</button>':'')+'</div>'+
    (title?'<h3>'+esc(title)+'</h3>':'')+(img||'')+its+'<div class="gloss" hidden aria-live="polite"></div>'+
    '<button type="button" class="entog" data-act="ent" aria-expanded="'+(open?'true':'false')+'">English</button>'+
    '<div class="en" '+(open?'':'hidden')+'>'+ens+'</div></article>';
}
function bi(it,en){return '<span lang="it">'+esc(it)+'</span><small lang="en">'+esc(en)+'</small>'}

/* ---------- views ---------- */
function header(){
  return '<header class="top"><div class="tape"></div><div class="wrap top-row"><div class="brand"><h1>'+esc(META.title)+'</h1><span>Giallo in italiano · A1–A2</span></div>'+
   '<button type="button" class="pill" data-act="en" aria-pressed="'+(S.en?'true':'false')+'" aria-label="Mostra sempre inglese / Always show English">EN</button>'+
   '<button type="button" class="pill" data-act="glos" aria-label="Parole / Glossary">Aa</button></div></header>';
}
function nav(){
  var T=[['caso','Caso','Case'],['indizi','Indizi','Clues'],['sospetti','Sospetti','Suspects'],['taccuino','Taccuino','Notebook'],['accusa','Accusa','Accuse']];

  if(S.mode==='deck')return deckSetup();

    else h+=confirmBtn('unlock',String(round+1),'Siamo pronti: Round '+(round+1),'We are ready: Round '+(round+1));
  }else{

function viewAccusa(){
  if(S.solved||S.revealed)return viewSol();
  var h='<h2>Accusa</h2><p class="it" lang="it">Chi è il colpevole? Scegliete insieme una persona e tre prove.</p><p class="en" lang="en">Who is the culprit? Choose one person and three proofs together.</p>';
  h+='<fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">1. Il colpevole<small lang="en">The culprit</small></legend>';
  CAST.forEach(function(c){h+='<label class="opt"><input type="radio" name="sus" data-act="pick" value="'+c.id+'"'+(selSus===c.id?' checked':'')+'><span><b>'+c.name+'</b><span class="e">'+esc(c.roleEn)+'</span></span></label>'});
  h+='</fieldset><fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">2. Tre prove<small lang="en">Three proofs</small></legend>';
  PROOFS.forEach(function(p){h+='<label class="opt"><input type="checkbox" data-act="proof" value="'+p.k+'"'+(selProofs[p.k]?' checked':'')+'><span lang="it">'+esc(p.it)+'<span class="e" lang="en">'+esc(p.en)+'</span></span></label>'});
  h+='</fieldset><div id="res" aria-live="polite">'+resHtml+'</div>';
  h+='<button type="button" class="btn tape" data-act="accuse">Accuso!<small>I accuse!</small></button>';

  if(hintShown)h+='<div class="card"><p class="it" lang="it">Aiuto: Chi ha una chiave? Chi non ha un alibi? Chi sa come muore Rosa?</p><p class="en" lang="en">Hint: Who has a key? Who has no alibi? Who knows how Rosa dies?</p></div>';
  if(S.attempts>=3)h+=confirmBtnGhost('reveal','x','Mostra la soluzione','Show the solution');

function viewSol(){
  var h='<span class="stamp">Caso chiuso</span><h2>La soluzione</h2>'+cardHtml('sol','Soluzione','',SOL.it,SOL.en);
  h+='<div class="card"><div class="card-h"><span class="tag">Le prove</span></div><ol class="steps">'+META.solProofs.map(function(p){return '<li>'+esc(p[0])+'<span lang="en">'+esc(p[1])+'</span></li>'}).join('')+'</ol></div>';
  h+='<button type="button" class="btn tape" data-act="again">Gioca ancora<small>Play again</small></button>';
  return h;
}
function glossaryData(){
  var map={};var texts=[].concat(STORY.it,SOL.it);
  RULES.forEach(function(r){texts.push(r[0])});
  CLUES.forEach(function(c){texts.push(c.it)});
  Object.keys(ROUNDS).forEach(function(k){texts.push(ROUNDS[k].task)});
  CAST.forEach(function(c){texts.push(c.desc)});
  texts.push(META.suspectsLine);
  texts.forEach(function(t){var re=/\[([^|\]]+)\|([^\]]+)\]/g,m;while((m=re.exec(t))){var k=m[1].toLowerCase();if(!map[k])map[k]=[m[1],m[2]]}});
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,'it')}).map(function(k){return map[k]});
}
var GL=null;
function openGlossary(){
  if(!GL)GL=glossaryData();
  var el=$('#gl');
  el.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><h2>Parole</h2><button type="button" class="pill" data-act="closeglos">Chiudi</button></div><small>Glossario italiano → inglese / Italian → English glossary</small><input type="search" id="gs" placeholder="Cerca / Search" aria-label="Cerca / Search"><div id="gl-list">'+glList('')+'</div></div>';
  el.hidden=false;
  document.body.style.overflow='hidden';
}
function glList(q){
  q=q.toLowerCase();
  var items=GL.filter(function(p){return !q||p[0].toLowerCase().indexOf(q)>-1||p[1].toLowerCase().indexOf(q)>-1});
  if(!items.length)return '<p>Nessun risultato / No results</p>';
  return items.map(function(p){return '<div class="gl-item"><b lang="it">'+esc(p[0])+'</b><span lang="en">'+esc(p[1])+'</span></div>'}).join('');
}

function render(){
  if(S.mode==='deck'){
    if(S.deck&&S.deck.started){renderDeck();return}
    $('#app').innerHTML=header()+'<main class="wrap main">'+viewSetup()+'</main>';return;
  }
  var body;
  if(!S.started)body=viewSetup();
  else body=({caso:viewCaso,indizi:viewIndizi,sospetti:viewSospetti,taccuino:viewNote,accusa:viewAccusa})[tab]();
  $('#app').innerHTML=header()+'<main class="wrap main">'+body+'</main>'+(S.started?nav():'');
}
function go(t){tab=t;pend='';render();window.scrollTo(0,0)}

/* ---------- speech ---------- */
function speak(card,btn){
  if(!TTS)return;
  try{
    var ss=window.speechSynthesis;
    if(btn.getAttribute('aria-pressed')==='true'){ss.cancel();btn.setAttribute('aria-pressed','false');return}
    ss.cancel();
    $$('.ico[aria-pressed="true"]').forEach(function(b){b.setAttribute('aria-pressed','false')});
    var txt=$$('.it',card).map(function(n){return n.textContent}).join(' ');
    var u=new SpeechSynthesisUtterance(txt);u.lang='it-IT';u.rate=0.85;
    var v=ss.getVoices().filter(function(x){return /^it/i.test(x.lang)})[0];if(v)u.voice=v;
    btn.setAttribute('aria-pressed','true');
    u.onend=u.onerror=function(){btn.setAttribute('aria-pressed','false')};
    ss.speak(u);
  }catch(e){btn.setAttribute('aria-pressed','false')}
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  var keep=(a==='unlock'||a==='resetnb'||a==='reveal'||a==='teacher'||a==='dmenu');
  if(!keep&&pend){pend=''}
  switch(a){
   case 'n':S.n=+v;if(S.me>S.n)S.me=S.n;save();render();break;
   case 'me':S.me=+v;save();render();break;
   case 'start':S.started=true;tab='caso';save();render();window.scrollTo(0,0);break;
   case 'restart':S.started=false;save();render();window.scrollTo(0,0);break;
   case 'tab':go(v);break;
   case 'round':if(+v<=S.unlocked){round=+v;pend='';render();window.scrollTo(0,0)}break;
   case 'unlock':
     if(pend==='unlock'+v){S.unlocked=Math.max(S.unlocked,+v);round=+v;pend='';save();tab='indizi';render();window.scrollTo(0,0)}
     else{pend='unlock'+v;render()}
     break;
   case 'en':S.en=!S.en;save();render();break;
   case 'glos':openGlossary();break;
   case 'closeglos':$('#gl').hidden=true;document.body.style.overflow='';break;
   case 'w':
     var card=b.closest('.card'),g=$('.gloss',card);
     if(g){g.textContent=b.textContent+' = '+b.getAttribute('data-t');g.hidden=false}
     break;
   case 'ent':
     var c2=b.closest('.card'),id=c2.getAttribute('data-id'),en=$('.en',c2);
     var open=en.hidden;en.hidden=!open;openEn[id]=open;b.setAttribute('aria-expanded',open?'true':'false');
     break;
   case 'say':speak(b.closest('.card'),b);break;
   case 'mark':
     var s=b.getAttribute('data-s'),k=b.getAttribute('data-k');
     S.marks[s]=S.marks[s]||{};
     var cur=S.marks[s][k]||'',nx=cur===''?'y':cur==='y'?'n':'';
     S.marks[s][k]=nx;save();
     b.className='cell '+nx;b.textContent=nx==='y'?'Sì':nx==='n'?'No':'?';
     break;
   case 'resetnb':
     if(pend==='resetnbx'){S.marks={};pend='';save();render()}else{pend='resetnbx';render()}
     break;
   case 'accuse':doAccuse();break;
   case 'hint':hintShown=true;render();break;
   case 'reveal':
     if(pend==='revealx'){S.revealed=true;pend='';save();render();window.scrollTo(0,0)}else{pend='revealx';render()}
     break;
   case 'again':
     S.marks={};S.attempts=0;S.solved=false;S.revealed=false;S.unlocked=1;S.started=false;
     selSus='';selProofs={};hintShown=false;resHtml='';openEn={};tab='caso';round=2;save();render();window.scrollTo(0,0);
     break;
   case 'teacher':
     if(pend==='teacherx'){teacherOpen=!teacherOpen;pend=''}else{pend='teacherx';if(teacherOpen)teacherOpen=false}
     render();
     break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-act');
  if(a==='pick')selSus=t.value;
  if(a==='proof')selProofs[t.value]=t.checked;
});
document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id==='gs'&&GL){$('#gl-list').innerHTML=glList(ev.target.value)}
});

function doAccuse(){
  var picked=Object.keys(selProofs).filter(function(k){return selProofs[k]});
  var box=$('#res');
  if(!selSus||picked.length!==3){
    box.innerHTML='<div class="msg" role="alert"><span lang="it">Scegliete una persona e tre prove.</span><span class="e" lang="en">Choose one person and three proofs.</span></div>';
    return;
  }
  var okProofs=picked.every(function(k){return PROOFS.filter(function(p){return p.k===k})[0].ok});
  if(selSus===META.culprit&&okProofs){S.solved=true;save();render();window.scrollTo(0,0);return}
  S.attempts++;save();
  resHtml='<div class="msg" role="alert"><span lang="it">Non ancora. Il colpevole o le prove non sono giusti. Guardate il taccuino.</span><span class="e" lang="en">Not yet. The culprit or the proofs are not right. Look at the notebook.</span></div>';
  render();
  var r=$('#res');if(r)r.scrollIntoView({block:'center'});
}

/* ---------- deck mode ---------- */
var selDP=-1,selDS='',dEx='',dMsg=null;
function newDeck(){return {n:1,names:[],expert:false,started:false,idx:0,turn:0,g:{},fin:false,puz:{},tab:'carte'}}
function dk(){if(!S.deck)S.deck=newDeck();return S.deck}
function pname(p){var d=dk();var s=(d.names[p]||'').replace(/^\s+|\s+$/g,'');return s||('Giocatore '+(p+1))}
function firstClue(){for(var i=0;i<DECK.length;i++){if(DECK[i].t==='clue')return i}return DECK.length}
function clueById(id){for(var i=0;i<CLUES.length;i++){if(CLUES[i].id===id)return CLUES[i]}return null}
function castById(id){for(var i=0;i<CAST.length;i++){if(CAST[i].id===id)return CAST[i]}return null}
function deckTitle(i){var it=DECK[i];if(it.t==='clue')return clueById(it.id).t;return {story:'La storia',map:'Mappa',cast:'Personaggi',puzzle:'Enigma',final:'Fine'}[it.t]}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(/[.,h]/g,':').replace(/^0+(?=\d)/,'')}
var SPKBTN=TTS?'<button type="button" class="ico" data-act="say" aria-pressed="false" aria-label="Ascolta / Listen">'+SPK+'</button>':'';

function headBlock(){
  return '<div class="stack"><h2>'+esc(META.setupH)+'</h2><p class="it" lang="it">Un giallo da risolvere. Pescate le carte, leggete gli indizi e trovate il colpevole.</p><p class="en" lang="en">A mystery to solve. Draw the cards, read the clues and find the culprit.</p></div>';
}
function modeChooser(){
  var deck=S.mode==='deck';
  return '<section class="stack"><div class="q" lang="it">Come giocate?<small lang="en">How do you play?</small></div><div class="rounds" style="grid-template-columns:1fr 1fr">'+
   '<button type="button" class="rd" data-act="mode" data-v="split" aria-pressed="'+(!deck)+'" style="flex-direction:column;text-transform:none"><span>Una squadra</span><small style="color:inherit">Everyone has a phone</small></button>'+
   '<button type="button" class="rd" data-act="mode" data-v="deck" aria-pressed="'+deck+'" style="flex-direction:column;text-transform:none"><span>Il mazzo</span><small style="color:inherit">One phone, or play alone</small></button></div></section>';
}
function deckSetup(){
  var d=dk(),chips='',i;
  for(i=1;i<=10;i++)chips+='<button type="button" class="chip" data-act="dn" data-v="'+i+'" aria-pressed="'+(d.n===i)+'">'+i+'</button>';
  var names='';
  if(d.n>1)for(i=0;i<d.n;i++)names+='<input class="txt" id="dname'+i+'" type="text" maxlength="20" value="'+esc(d.names[i]||'')+'" placeholder="Giocatore '+(i+1)+'" aria-label="Nome del giocatore '+(i+1)+'">';
  var rules=[['A turno, pesca una carta e leggila a voce alta.','In turn, draw a card and read it out loud.'],['Scrivi le tue idee nel taccuino.','Write your ideas in the notebook.'],['Quando sai chi è il colpevole, tocca «Ipotesi». Hai due tentativi: la seconda ipotesi annulla la prima.','When you know who the culprit is, tap “Guess”. You have two attempts: the second guess cancels the first.'],['Prima dell\'ultima carta, tutti devono fare un\'ipotesi.','Before the last card, everyone must make a guess.'],['Vince chi indovina con la carta più bassa.','The winner is whoever guesses right with the lowest card number.']];
  return headBlock()+modeChooser()+
   '<section class="stack"><div class="q" lang="it">Quanti giocatori siete?<small lang="en">How many players are you? (1 = play alone)</small></div><div class="chips">'+chips+'</div>'+
   (names?'<div class="q" lang="it">I nomi<small lang="en">Names (optional)</small></div><div class="stack">'+names+'</div>':'')+'</section>'+
   '<label class="opt"><input type="checkbox" data-act="dexp"'+(d.expert?' checked':'')+'><span lang="it">Versione per esperti: scrivi una breve spiegazione con l\'ipotesi.<span class="e" lang="en">Expert version: write a short explanation with your guess.</span></span></label>'+
   '<div class="card"><div class="card-h"><span class="tag">Come si gioca</span></div><ol class="steps">'+rules.map(function(r){return '<li>'+esc(r[0])+'<span lang="en">'+esc(r[1])+'</span></li>'}).join('')+'</ol></div>'+
   '<button type="button" class="btn tape" data-act="dstart">Inizia<small>Start</small></button>'+
   '<button type="button" class="link" data-act="teacher">Per l\'insegnante / For the teacher</button>'+(teacherOpen?'<div class="card"><h3>Soluzione / Solution</h3><p>'+esc(META.teacher)+'</p></div>':'');
}
function castCard(i,it){
  var open=S.en||openEn['d-'+i],its='',ens='';
  it.ids.forEach(function(id){var c=castById(id);
    its+='<div class="who">'+avHtml(c)+'<div><b>'+esc(c.name)+'</b><span lang="it">'+c.age+' anni · '+esc(c.role)+'</span></div></div><p class="it" lang="it">'+mk(c.desc)+'</p>';
    ens+='<p lang="en"><b>'+esc(c.name)+'</b>: '+c.age+', '+esc(c.roleEn)+'. '+esc(c.descEn)+'</p>';});
  return '<article class="card" data-id="d-'+i+'"><div class="card-h"><span class="tag">Carta '+(i+1)+' · Personaggi</span>'+SPKBTN+'</div>'+its+'<div class="gloss" hidden></div><button type="button" class="entog" data-act="ent" aria-expanded="'+(open?'true':'false')+'">English</button><div class="en" '+(open?'':'hidden')+'>'+ens+'</div></article>';
}
function deckCardHtml(i){
  var it=DECK[i],d=dk(),tag='Carta '+(i+1);
  if(it.t==='story')return cardHtml('d-'+i,tag+' · La storia','',STORY.it,STORY.en,IMGS.scena||'');
  if(it.t==='map')return META.caso||'';
  if(it.t==='cast')return castCard(i,it);
  if(it.t==='clue'){var c=clueById(it.id);return cardHtml('d-'+i,tag+' · Indizio',c.t,c.it,c.en,clueImg(c.id))}
  if(it.t==='final')return cardHtml('d-'+i,tag+' · Fine','',it.it,it.en);
  if(it.t==='puzzle'){
    var h=cardHtml('d-'+i,tag+' · Enigma','',it.it,it.en,it.img?IMGS[it.img]:'');
    var ex='<div class="row" style="flex-wrap:nowrap"><input class="txt" id="pz'+i+'" type="text" autocomplete="off" placeholder="Risposta / Answer" aria-label="Risposta"><button type="button" class="btn ghost" data-act="pz" data-v="'+i+'" style="flex:none">Controlla</button></div><div id="pzr'+i+'" aria-live="polite">'+(d.puz[i]?'<b>Esatto! / Correct!</b>':'')+'</div>';
    return h.replace(/<\/article>$/,ex+'</article>');
  }
  return '';
}
function deckCarte(){
  var d=dk(),N=DECK.length,h='<h2>Le carte</h2>';
  h+='<div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+N+'" aria-valuenow="'+d.idx+'"><i style="width:'+Math.round(d.idx/N*100)+'%"></i></div><small>Carta '+d.idx+' di '+N+' · Card '+d.idx+' of '+N+'</small></div>';
  if(d.idx===0)h+='<div class="card"><p class="it" lang="it">Il mazzo è pronto. Pesca la prima carta e leggila a voce alta.</p><p class="en" lang="en">The deck is ready. Draw the first card and read it out loud.</p></div>';
  else h+=deckCardHtml(d.idx-1);
  var nx=DECK[d.idx];
  if(nx){
    var missing=[];
    if(nx.t==='final'){for(var p=0;p<d.n;p++){if(!(d.g[p]&&d.g[p].att>0))missing.push(pname(p))}}
    if(missing.length){
      h+='<div class="card ask"><p class="it" lang="it">Prima dell\'ultima carta, tutti devono fare un\'ipotesi. Mancano: <b>'+esc(missing.join(', '))+'</b>.</p><p class="en" lang="en">Before the last card, everyone must make a guess. Still missing: '+esc(missing.join(', '))+'.</p></div>';
      h+='<button type="button" class="btn tape" data-act="dtab" data-v="ipotesi">Fai l\'ipotesi<small>Make your guess</small></button>';
    }else{
      if(d.n>1)h+='<div class="turn"><span lang="it">Turno di <b>'+esc(pname(d.turn))+'</b></span><small lang="en">Draw the next card and read it aloud</small></div>';
      h+='<button type="button" class="btn tape" data-act="ddraw">'+(nx.t==='final'?'Pesca l\'ultima carta':'Pesca la carta successiva')+'<small>'+(nx.t==='final'?'Draw the last card':'Draw the next card')+'</small></button>';
    }
  }
  if(d.idx>=firstClue())h+='<button type="button" class="btn ghost" data-act="dtab" data-v="ipotesi">So chi è il colpevole!<small>I know who the culprit is!</small></button>';
  if(d.idx>1){
    h+='<h3 lang="it" style="margin-top:6px">Carte sul tavolo</h3>';
    for(var i=d.idx-2;i>=0;i--)h+='<details class="old"><summary>Carta '+(i+1)+' · '+esc(deckTitle(i))+'</summary>'+deckCardHtml(i)+'</details>';
  }
  h+=confirmBtnGhost('dmenu','x','Torna al menu','Back to menu');
  return h;
}
function deckIpotesi(){
  var d=dk(),h='<h2>Ipotesi</h2>',p;
  if(d.idx<firstClue())return h+'<div class="card"><p class="it" lang="it">Prima pescate le carte dei personaggi. Poi potete fare un\'ipotesi.</p><p class="en" lang="en">First draw the character cards. Then you can make a guess.</p></div>';
  h+='<p class="it" lang="it">Hai due tentativi. La seconda ipotesi annulla la prima. Nessuno vede la tua risposta.</p><p class="en" lang="en">You have two attempts. The second guess cancels the first. Nobody sees your answer.</p>';
  if(dMsg)h+='<div class="msg" role="status"><span lang="it">'+esc(dMsg[0])+'</span><span class="e" lang="en">'+esc(dMsg[1])+'</span></div>';
  if(d.n===1)selDP=0;
  else{
    h+='<div class="stack"><div class="q" lang="it">Chi fa l\'ipotesi?<small lang="en">Who is guessing?</small></div>';
    for(p=0;p<d.n;p++){var a=(d.g[p]&&d.g[p].att)||0;h+='<button type="button" class="rd" style="justify-content:space-between;padding:0 14px" data-act="dsel" data-v="'+p+'" aria-pressed="'+(selDP===p)+'" aria-disabled="'+(a>=2)+'"><span>'+esc(pname(p))+'</span><span>'+a+'/2</span></button>'}
    h+='</div>';
  }
  if(selDP>=0){
    var att=(d.g[selDP]&&d.g[selDP].att)||0;
    if(att>=2)return h+'<div class="card"><p class="it" lang="it">'+esc(pname(selDP))+' ha finito i tentativi.</p><p class="en" lang="en">No attempts left.</p></div>';
    if(att===1)h+='<div class="card ask"><p class="it" lang="it">Questa è la seconda ipotesi: annulla la prima.</p><p class="en" lang="en">This is the second guess: it cancels the first.</p></div>';
    h+='<fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="q" lang="it" style="padding:0 0 8px">Il colpevole<small lang="en">The culprit</small></legend>';
    CAST.forEach(function(c){h+='<label class="opt"><input type="radio" name="dsus" data-act="dsus" value="'+c.id+'"'+(selDS===c.id?' checked':'')+'><span><b>'+esc(c.name)+'</b><span class="e">'+esc(c.roleEn)+'</span></span></label>'});
    h+='</fieldset>';
    if(d.expert)h+='<div class="stack"><label class="q" for="dexpl" lang="it">La tua spiegazione<small lang="en">Your short explanation</small></label><textarea class="txt" id="dexpl" maxlength="400" placeholder="Perché?">'+esc(dEx)+'</textarea></div>';
    h+='<button type="button" class="btn tape" data-act="dsave">Salva l\'ipotesi<small>Carta '+d.idx+' · Save guess</small></button>';
  }
  return h;
}
function deckRisultati(){
  var d=dk(),h='<span class="stamp">Caso chiuso</span><h2>Risultati</h2>',p,fi=DECK.length-1;
  h+=deckCardHtml(fi);
  h+=cardHtml('sol','Soluzione','',SOL.it,SOL.en);
  h+='<div class="card"><div class="card-h"><span class="tag">Le prove</span></div><ol class="steps">'+META.solProofs.map(function(x){return '<li>'+esc(x[0])+'<span lang="en">'+esc(x[1])+'</span></li>'}).join('')+'</ol></div>';
  var best=1e9,win=[],rows='';
  for(p=0;p<d.n;p++){var g=d.g[p];if(g&&g.sus===META.culprit){if(g.card<best){best=g.card;win=[p]}else if(g.card===best)win.push(p)}}
  h+='<div class="card"><div class="card-h"><span class="tag">Chi vince?</span></div>';
  if(win.length)h+='<p class="it" lang="it">'+(d.n>1?(win.length>1?'Vincono: ':'Vince: ')+'<b>'+esc(win.map(pname).join(', '))+'</b>':'<b>Bravo!</b> Hai trovato il colpevole')+' con la carta <b>'+best+'</b>.</p><p class="en" lang="en">'+(d.n>1?'Winner: '+esc(win.map(pname).join(', ')):'Well done! You found the culprit')+' at card '+best+'.</p>';
  else h+='<p class="it" lang="it">Nessuno ha trovato il colpevole.</p><p class="en" lang="en">Nobody found the culprit.</p>';
  h+='</div>';
  for(p=0;p<d.n;p++){var gg=d.g[p],c=gg?castById(gg.sus):null;
    rows+='<tr><td>'+esc(pname(p))+'</td><td>'+(c?esc(c.name.split(' ')[0]):'–')+'</td><td class="c">'+(gg?gg.card:'–')+'</td><td class="c">'+(gg?(gg.sus===META.culprit?'Sì':'No'):'–')+'</td></tr>';
    if(d.expert&&gg&&gg.expl)rows+='<tr><td colspan="4"><small>'+esc(gg.expl)+'</small></td></tr>';}
  h+='<div class="tw"><table class="tt"><thead><tr><th>Giocatore</th><th>Ipotesi</th><th>Carta</th><th>Giusto?</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  var pz='';DECK.forEach(function(it,i){if(it.t==='puzzle')pz+='<li>Carta '+(i+1)+': <b>'+esc(it.ans[0])+'</b> '+(d.puz[i]?'(risolto)':'')+'</li>'});
  if(pz)h+='<div class="card"><div class="card-h"><span class="tag">Enigmi</span></div><ul class="pl">'+pz+'</ul></div>';
  h+='<button type="button" class="btn tape" data-act="dagain">Nuova partita<small>New game</small></button>';
  return h;
}
function deckNav(){
  var d=dk();
  var T=[['carte','Carte','Cards'],['taccuino','Taccuino','Notebook'],d.fin?['risultati','Risultati','Results']:['ipotesi','Ipotesi','Guess']];
  return '<nav class="nav" aria-label="Menu"><div class="nav-in" style="grid-template-columns:repeat(3,1fr)">'+T.map(function(t){return '<button type="button" class="tab" data-act="dtab" data-v="'+t[0]+'"'+(d.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'<small>'+t[2]+'</small></button>'}).join('')+'</div></nav>';
}
function renderDeck(){
  var d=dk();
  if(d.fin&&d.tab==='ipotesi')d.tab='risultati';
  var f={carte:deckCarte,taccuino:viewNote,ipotesi:deckIpotesi,risultati:deckRisultati}[d.tab]||deckCarte;
  $('#app').innerHTML=header()+'<main class="wrap main">'+f()+'</main>'+deckNav();
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),d;
  switch(a){
   case 'mode':S.mode=v;if(v==='deck')dk();save();render();break;
   case 'dn':d=dk();d.n=+v;save();render();break;
   case 'dstart':d=dk();d.started=true;d.idx=0;d.turn=0;d.g={};d.fin=false;d.puz={};d.tab='carte';selDP=-1;selDS='';dEx='';dMsg=null;save();render();window.scrollTo(0,0);break;
   case 'dtab':d=dk();d.tab=v;dMsg=null;save();render();window.scrollTo(0,0);break;
   case 'ddraw':
     d=dk();
     if(DECK[d.idx]){
       if(DECK[d.idx].t==='final'){for(var p=0;p<d.n;p++){if(!(d.g[p]&&d.g[p].att>0)){render();return}}}
       d.idx++;d.turn=(d.turn+1)%d.n;
       if(DECK[d.idx-1].t==='final'){d.fin=true;d.tab='risultati'}
       save();render();window.scrollTo(0,0);
     }
     break;
   case 'dsel':d=dk();selDP=+v;selDS='';dEx='';dMsg=null;render();break;
   case 'dsave':
     d=dk();
     var ex=document.getElementById('dexpl');if(ex)dEx=ex.value;
     var att=(d.g[selDP]&&d.g[selDP].att)||0;
     if(selDP<0||att>=2){break}
     if(!selDS){dMsg=['Scegli una persona.','Choose a person.'];render();break}
     if(d.expert&&dEx.replace(/\s+/g,'').length<3){dMsg=['Scrivi una breve spiegazione.','Write a short explanation.'];render();break}
     d.g[selDP]={att:att+1,sus:selDS,card:d.idx,expl:dEx};
     dMsg=['Ipotesi salvata alla carta '+d.idx+'. Nessuno vede la risposta.','Guess saved at card '+d.idx+'. Nobody sees the answer.'];
     selDS='';dEx='';if(d.n>1)selDP=-1;
     save();render();window.scrollTo(0,0);
     break;
   case 'pz':
     d=dk();
     var inp=document.getElementById('pz'+v),it=DECK[+v],ok=false;
     if(inp){var val=norm(inp.value);it.ans.forEach(function(x){if(norm(x)===val)ok=true})}
     var out=document.getElementById('pzr'+v);
     if(ok){d.puz[v]=true;save();if(out)out.innerHTML='<b>Esatto! / Correct!</b>'}
     else if(out)out.textContent='Riprova / Try again';
     break;
   case 'dagain':S.deck=newDeck();selDP=-1;selDS='';dEx='';dMsg=null;save();render();window.scrollTo(0,0);break;
   case 'dmenu':
     if(pend==='dmenux'){d=dk();d.started=false;pend='';save();render();window.scrollTo(0,0)}
     else{pend='dmenux';render()}
     break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t||!t.getAttribute)return;
  var a=t.getAttribute('data-act');
  if(a==='dsus')selDS=t.value;
  if(a==='dexp'){dk().expert=t.checked;save()}
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.id==='dexpl')dEx=t.value;
  if(t.id.indexOf('dname')===0){dk().names[+t.id.slice(5)]=t.value;save()}
});

render();
})();
</script>
</body></html>
